<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Context Engineering | Write, Select, Compress, Isolate, Failure Modes, KV Cache, Multi-Agents</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🧠 <span>Context Engineering</span> Masterclass</div>
        <div class="muted small">Write • Select • Compress • Isolate • Failure Modes • KV Cache • Multi-Agents</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "context-engineering-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express") {
      return `
        <div class="quiz" data-module="${moduleId}">
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "budget") updateBudget();
      if (id === "kv-cache") updateKv();
      if (id === "failures") resetFailureMatcher();
      if (id === "workflow") initPhaseSim();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    // ============ DIAGNOSTIC ============
    const DIAG_TEXT = {
      debutant: "Commencez par la définition : prompt engineering vs context engineering, puis la fenêtre de contexte comme RAM. Les 4 stratégies seront votre boussole.",
      builder: "Passez vite sur la théorie, concentrez-vous sur les failure modes, la compression des tool outputs, la sélection dynamique des outils et le KV cache.",
      senior: "Allez directement aux architectures : isolation multi-agents, workflow par phases, plateforme comparison, autorité du contexte et pipeline commun."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.builder}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ CONTEXT BUDGET SIMULATOR ============
    function updateBudget() {
      const vals = {
        system: Number($("#cb-system")?.value || 0),
        tools: Number($("#cb-tools")?.value || 0),
        toolResults: Number($("#cb-tool-results")?.value || 0),
        rag: Number($("#cb-rag")?.value || 0),
        history: Number($("#cb-history")?.value || 0),
        memory: Number($("#cb-memory")?.value || 0),
        state: Number($("#cb-state")?.value || 0)
      };
      const windowSize = Number($("#cb-window")?.value || 128000);
      const total = Object.values(vals).reduce((a, b) => a + b, 0);
      const pct = windowSize ? (total / windowSize) * 100 : 0;

      $("#cbv-system").textContent = vals.system.toLocaleString("fr-FR");
      $("#cbv-tools").textContent = vals.tools.toLocaleString("fr-FR");
      $("#cbv-tool-results").textContent = vals.toolResults.toLocaleString("fr-FR");
      $("#cbv-rag").textContent = vals.rag.toLocaleString("fr-FR");
      $("#cbv-history").textContent = vals.history.toLocaleString("fr-FR");
      $("#cbv-memory").textContent = vals.memory.toLocaleString("fr-FR");
      $("#cbv-state").textContent = vals.state.toLocaleString("fr-FR");

      const fill = $("#cb-fill");
      const status = $("#cb-status");
      const advice = $("#cb-advice");
      if (fill) fill.style.width = Math.min(100, pct) + "%";

      let statusClass = "status-good";
      let statusText = "Contexte sain : vous êtes sous les seuils critiques.";
      if (pct >= 80) {
        statusClass = "status-bad";
        statusText = "Contexte critique : dégradation forte, risque élevé d’oubli, d’erreurs et de coûts.";
      } else if (pct >= 60) {
        statusClass = "status-warn";
        statusText = "Contexte à risque : la fenêtre se remplit, le raisonnement peut commencer à se dégrader.";
      } else if (pct >= 40) {
        statusClass = "status-warn";
        statusText = "Zone d’attention : commencez à compresser, sélectionner et isoler avant saturation.";
      }

      if (status) {
        status.className = "status-line " + statusClass;
        status.textContent = "Utilisation : " + pct.toFixed(1) + "% — " + statusText;
      }

      const tips = [];
      if (vals.tools > 10000) tips.push("Tool definitions lourdes : utilisez SELECT (RAG sur les outils, tool masking, jeu minimal viable).");
      if (vals.toolResults > 20000) tips.push("Tool results accumulés : utilisez COMPRESS (résumé, clearing des anciens outputs, validation avant entrée).");
      if (vals.history > 30000) tips.push("Historique trop long : COMPRESS avec résumé hybride, garder derniers messages verbatim, résumer l’ancien.");
      if (vals.rag > 20000) tips.push("Documents RAG trop nombreux : SELECT + reranking + chunking + agentic retrieval.");
      if (vals.system > 15000) tips.push("System prompt très long : vérifiez que chaque token est nécessaire ; structurez avec XML/markdown ; écrivez à la bonne altitude.");
      if (vals.memory > 10000) tips.push("Mémoire volumineuse : WRITE vers stockage externe + SELECT au bon moment.");
      if (vals.state > 8000) tips.push("Agent state lourd : persistez un to-do / progress file, compressez les marqueurs obsolètes.");
      if (pct > 50 && (vals.toolResults + vals.history) > total * 0.55) tips.push("Risque lost in the middle : les instructions initiales peuvent être enfouies sous les outputs et l’historique.");

      if (advice) advice.innerHTML = tips.length ? "<strong>Recommandations :</strong><ul>" + tips.map(t => "<li>" + t + "</li>").join("") + "</ul>" : "Aucune alerte majeure. Continuez à surveiller la croissance à chaque tool call.";
    }

    // ============ KV CACHE CALCULATOR ============
    function updateKv() {
      const stable = Number($("#kv-stable")?.value || 20000);
      const dynamic = Number($("#kv-dynamic")?.value || 3000);
      const calls = Number($("#kv-calls")?.value || 30);

      $("#kvv-stable").textContent = stable.toLocaleString("fr-FR");
      $("#kvv-dynamic").textContent = dynamic.toLocaleString("fr-FR");
      $("#kvv-calls").textContent = calls.toLocaleString("fr-FR");

      const cachedPrice = 0.30;
      const uncachedPrice = 3.00;

      const stableCost = (stable * calls / 1_000_000) * cachedPrice;
      const dynamicCost = (dynamic * calls / 1_000_000) * uncachedPrice;
      const stableOrderCost = stableCost + dynamicCost;
      const unstableCost = ((stable + dynamic) * calls / 1_000_000) * uncachedPrice;
      const savings = unstableCost - stableOrderCost;

      const out = $("#kv-out");
      if (out) {
        out.textContent =
          "Coût avec préfixe stable et cache réutilisé : " + stableOrderCost.toFixed(4) + " USD\n" +
          "Coût si le préfixe change à chaque appel : " + unstableCost.toFixed(4) + " USD\n" +
          "Économie potentielle : " + savings.toFixed(4) + " USD (" + (unstableCost ? (savings / unstableCost * 100).toFixed(1) : "0") + "%)\n\n" +
          "Lecture : garder stables system prompt, tool definitions et préfixe en haut du contexte permet de réutiliser le KV cache. Déplacer ou retirer des outils au milieu invalide le cache et force le recalcul, ce qui peut multiplier les coûts par 10 sur les tokens concernés.";
      }
    }

    // ============ FAILURE MATCHER ============
    const FAILURE_TEXT = {
      poisoning: "Symptôme : une hallucination ou une erreur ancienne est reprise en boucle.\nFailure mode : CONTEXT POISONING.\nExplication : un mauvais output d’outil ou une inférence erronée entre dans le contexte, puis l’agent construit dessus étape après étape.\nFix : pruning actif, validation des tool outputs avant entrée, compression de l’historique d’échec une fois la résolution trouvée.",
      distraction: "Symptôme : l’agent répète des patterns récents au lieu de raisonner.\nFailure mode : CONTEXT DISTRACTION.\nExplication : le contexte devient si long que le modèle sur-utilise son historique récent et sous-utilise ce qu’il a appris à l’entraînement.\nFix : résumer et élaguer agressivement, même avec une grande fenêtre de contexte.",
      confusion: "Symptôme : l’agent appelle des outils hors sujet ou produit des réponses basses qualité.\nFailure mode : CONTEXT CONFUSION.\nExplication : contenu superflu, notamment trop de tool definitions, rend le raisonnement moins clair. Exemple : un modèle échoue avec 46 outils mais réussit avec 19, alors que la fenêtre avait la place.\nFix : sélection dynamique des outils, RAG sur les descriptions d’outils, jeu minimal viable, tool masking.",
      clash: "Symptôme : l’agent suit tantôt une source, tantôt une autre, ou produit un comportement incohérent.\nFailure mode : CONTEXT CLASH.\nExplication : une nouvelle information contredit une information déjà présente, par exemple system prompt vs document récupéré.\nFix : établir une hiérarchie d’autorité, valider les nouvelles infos avant injection, utiliser sections structurées, XML tags, headers clairs."
    };

    function resetFailureMatcher() {
      $$(".matcher-btn").forEach(b => b.classList.remove("active"));
      const out = $("#failure-out");
      if (out) out.textContent = "Sélectionnez un symptôme pour identifier le failure mode et la stratégie de remédiation.";
    }

    function chooseFailure(key) {
      $$(".matcher-btn").forEach(b => b.classList.toggle("active", b.dataset.key === key));
      const out = $("#failure-out");
      if (out) out.textContent = FAILURE_TEXT[key] || "";
    }

    // ============ STRATEGY SELECTOR ============
    function chooseStrategy(key) {
      const texts = {
        forget_rules: "Problème : l’agent oublie les fondamentaux entre les sessions ou après compaction.\nStratégie : WRITE.\nTactiques : rules files type CLAUDE.md, scratch pads, memory extraction, think tool, fichiers de progression.",
        too_much: "Problème : le contexte est saturé par d’anciens tool outputs et l’historique.\nStratégie : COMPRESS.\nTactiques : chunking avant entrée, résumé continu, trimming, garder derniers messages verbatim, clear des résultats déjà utilisés, autocompact en secours.",
        too_many_tools: "Problème : trop d’outils disponibles, l’agent hésite ou appelle les mauvais outils.\nStratégie : SELECT.\nTactiques : RAG sur tool definitions, tool masking, préfixes cohérents, hybrid strategy frontload + just-in-time retrieval.",
        dirty_context: "Problème : une phase de recherche salit le contexte de la phase d’implémentation.\nStratégie : ISOLATE.\nTactiques : sous-agents avec fenêtres propres, parent reçoit seulement un résumé condensé, reset de contexte entre phases.",
        contradiction: "Problème : documents récupérés et instructions se contredisent.\nStratégie : WRITE + SELECT.\nTactiques : hiérarchie d’autorité, sections structurées, validation avant injection, sourcing explicite, règles persistantes."
      };
      const out = $("#strategy-out");
      if (out) out.textContent = texts[key] || "";
    }

    // ============ PHASE WORKFLOW SIMULATOR ============
    const PHASES = [
      { who: "Phase 1 — Recherche", text: "Fenêtre fraîche + objectif. Des sous-agents explorent le codebase, lisent des fichiers, tracent les data flows, font les grep/scan bruts. Les résultats sales restent dans leurs contextes." },
      { who: "Stratégie Isolate", text: "Le parent ne reçoit pas tout le bruit de recherche. Chaque sous-agent travaille dans une fenêtre propre et rapporte un résumé condensé." },
      { who: "Stratégie Write", text: "La recherche produit un artefact compact : research.md avec chemins, signatures, patterns existants, pièges." },
      { who: "Reset de contexte", text: "La recherche brute consommait peut-être 60 à 80% du contexte. L’artefact compact ramène cela à environ 15 à 20%." },
      { who: "Phase 2 — Planification", text: "Nouvelle fenêtre contenant seulement research.md + définition du problème. L’agent produit un plan d’implémentation détaillé." },
      { who: "Checkpoint humain", text: "C’est le moment idéal pour relire la logique. Si une erreur de raisonnement existe, elle est encore bon marché à corriger." },
      { who: "Phase 3 — Implémentation", text: "Encore une fenêtre fraîche, cette fois avec seulement le plan. L’agent exécute étape par étape." },
      { who: "Stratégie Write continue", text: "Un progress.md suit ce qui est terminé et ce qui reste. Les tâches longues gardent un état externe sans encombrer la fenêtre." }
    ];

    let phaseStep = 0;

    function initPhaseSim() {
      phaseStep = 0;
      const container = $("#phase-history");
      if (!container) return;
      container.innerHTML = PHASES.map((p, i) => `
        <div class="phase-step" id="phase-step-${i}">
          <span class="who">${p.who}</span>
          <span>${p.text}</span>
        </div>
      `).join("");
      const status = $("#phase-status");
      if (status) status.textContent = "Cliquez sur Étape suivante pour dérouler le workflow par compaction intentionnelle.";
      const nextBtn = $("#phase-next");
      if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = "Étape suivante →"; }
      const resetBtn = $("#phase-reset");
      if (resetBtn) resetBtn.style.display = "inline-flex";
    }

    function nextPhaseStep() {
      if (phaseStep >= PHASES.length) return;
      const el = $("#phase-step-" + phaseStep);
      if (el) el.classList.add("visible");
      phaseStep++;
      const status = $("#phase-status");
      if (status) {
        if (phaseStep < PHASES.length) status.textContent = "Étape " + phaseStep + "/" + PHASES.length + " — chaque phase produit un artefact compact, puis le contexte est réinitialisé.";
        else status.textContent = "Workflow terminé : vous avez vu comment rester sous 40-60% de la fenêtre grâce à write, select, compress, isolate.";
      }
      if (phaseStep >= PHASES.length) {
        const nextBtn = $("#phase-next");
        if (nextBtn) nextBtn.disabled = true;
      }
    }

    // ============ SCENARIOS ============
    function chooseScenario(key) {
      const texts = {

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous comprenez le context engineering comme discipline : fenêtre finie, dégradation continue, 4 stratégies, failure modes, KV cache, workflow par phases et architectures de plateformes."
          : (correct >= 5 ? "Bases correctes. Revoyez les failure modes, la distinction Select/Compress, et le principe stable top / dynamic bottom." : "Reprenez les modules définition, budget, stratégies et failures avant de réessayer.");
        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

    function restoreExam() {
      updateExamTimer();
      if (STATE.exam.finished) {
        const btn = $("#exam-start");
        if (btn) btn.style.display = "none";
        const res = $("#exam-result");
        if (res && !res.innerHTML) res.innerHTML = `Examen terminé : ${STATE.exam.score}/${STATE.exam.total}. ${STATE.exam.passed ? "Certificat disponible." : "Revoyez les modules puis réessayez."}`;
        const certBtn = $("#go-cert");
        if (certBtn) certBtn.style.display = "inline-flex";
      }
    }

      if (!STATE.exam.finished) { alert("Terminez d’abord l’examen final."); return; }
      const name = ($("#cert-name")?.value || "Apprenant").trim();
      STATE.certName = name;
      saveState();
      const block = $("#certificate");
      if (!block) return;
      block.classList.add("show");
      $("#cert-name-out").textContent = name;
      $("#cert-date").textContent = new Date().toLocaleDateString("fr-FR");
      $("#cert-score").textContent = STATE.exam.score + "/" + STATE.exam.total;
      $("#cert-level").textContent = STATE.exam.passed ? "Maîtrise validée" : "Fin de parcours";
      block.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function restoreAction() {

      if (nameInput && STATE.certName) nameInput.value = STATE.certName;

          <p class="lead">

            donner de bons exemples, dire au modèle quel rôle jouer. Ça marche très bien quand vous conversez avec ChatGPT.

          </p>

          <div class="grid">
            <div class="card info">
              <h3>Prompt engineering</h3>
              <p>Écrire de bonnes instructions initiales : clarté, exemples, rôle, format. Utile pour une conversation.</p>
            </div>
            <div class="card purple">
              <h3>Context engineering</h3>
              <p>Concevoir tout le système d’information autour du modèle : pas seulement l’instruction initiale, mais tout ce que le modèle voit à chaque étape.</p>
            </div>
            <div class="card warn">

            <p>Context = l’ensemble des tokens inclus quand vous samplez depuis un LLM. Context engineering = optimiser l’utilité de ces tokens pour atteindre de manière consistente un outcome désiré. En gros : faire en sorte que votre agent voie la bonne information, au bon format, au bon moment. <span class="source">⏱ 1:54</span></p>

          <h1>Comment les agents échouent quand le contexte tourne mal</h1>
          <p class="lead">
            Comprendre les modes de défaillance est un bon moyen d’apprendre proactivement ce qu’on essaie d’éviter.
            Drew Breunig a publié une série influente en deux parties mi-2025 identifiant quatre façons distinctes dont
            les agents échouent à mesure que leur contexte grandit. <span class="source">⏱ 14:34</span>
          </p>

          <div class="grid">
            <div class="card bad">
              <h3>1. Context poisoning</h3>
              <p>Une hallucination ou erreur entre dans le contexte, puis est référencée encore et encore dans les steps suivants. Un outil renvoie bad data, ou l’agent fait une inférence flawed 5 steps ago, et l’info reste là, construite dessus. <span class="source">⏱ 14:51</span></p>
              <p><strong>Fix :</strong> context pruning, valider tool outputs avant entrée, compresser l’historique d’échec après résolution. Ne laissez pas 10 steps de debugging dead-end visibles quand seule la résolution compte.</p>
            </div>
            <div class="card warn">
              <h3>2. Context distraction</h3>
              <p>Le contexte devient si long que le modèle sur-utilise son history récente et sous-utilise ce qu’il a appris pendant training. L’agent arrête de penser par lui-même et répète des patterns de ce qu’il a récemment vu. Au lieu de synthétiser un plan novel, il rehash des actions passées. <span class="source">⏱ 15:34</span></p>
              <p><strong>Fix :</strong> summarize et prune agressivement, même avec grande fenêtre.</p>
            </div>
            <div class="card bad">
              <h3>3. Context confusion</h3>
              <p>Contenu superflu entre dans le contexte et mène à des réponses basse qualité. Exemple classique : tool confusion. L’agent voit 46 tool definitions et commence à appeler des outils sans rapport avec la tâche. Un benchmark : un modèle Llama 3.1 8B quantized a échoué quand on lui donnait les 46 outils, mais a bien marché avec 19. La fenêtre avait la place, mais le modèle ne raisonnait pas clairement avec autant d’options. <span class="source">⏱ 15:59</span></p>
              <p><strong>Fix :</strong> dynamic tool management, RAG-MCP, semantic retrieval over tool descriptions, jeu minimal viable.</p>
            </div>
            <div class="card purple">
              <h3>4. Context clash</h3>
              <p>Nouvelle information gatherée pendant le run contredit quelque chose déjà dans le contexte. System prompt dit une chose, retrieved document dit autre. L’agent ne peut pas réconcilier, produit comportement incohérent : tantôt une source, tantôt l’autre, tantôt quelque chose qui ne match ni l’une ni l’autre. <span class="source">⏱ 16:47</span></p>
              <p><strong>Fix :</strong> établir autorité claire, valider nouvelles infos avant injection, structured sections, XML tags, headers clairs.</p>

        id: "best-practices", title: "6. System prompt & tools", express: true,
        content: `
          <h1>Best practices : system prompt d’agent et définitions d’outils</h1>
          <p class="lead">
            Deux choses sur lesquelles vous travaillerez en premier quand vous construisez un agent : le system prompt
            et les tool definitions. L’approche est très différente d’un chatbot. <span class="source">⏱ 18:03</span>
          </p>

          <div class="card info">
            <h3>System prompt d’un agent</h3>
            <p>Un system prompt de chatbot set le tone : « you are a helpful assistant, be concise and friendly ». Un system prompt d’agent définit son architecture. Il spécifie control flow : comment approcher différents types de tâches, quels outils utiliser dans quelles situations, que faire en cas d’erreur, quels safety guardrails suivre. C’est plus proche d’une job description pour un employé autonome. <span class="source">⏱ 18:12</span></p>
          </div>

          <div class="card good">
            <h3>Writing at the right altitude</h3>
            <p>Anthropic a un concept utile : la zone Goldilocks. Trop prescriptif est mauvais : « if user mentions billing and refund and amount over $100, call tool X » est fragile et cassera sur chaque edge case non anticipé. Trop vague est aussi mauvais : « be helpful and use appropriate tools » ne donne rien à l’agent. Le sweet spot : assez spécifique pour guider le comportement autonome, assez flexible pour laisser le modèle appliquer son jugement dans des situations novel. Vous donnez de fortes heuristiques, pas des règles rigides. <span class="source">⏱ 18:39</span></p>
          </div>

          <div class="grid">
            <div class="card warn">
              <h3>Structurez</h3>
              <p>Organisez avec XML tags ou markdown headers : background information, instructions, tool guidance. Sections distinctes aident le modèle à parser quelle info vient de quelle source. <span class="source">⏱ 19:25</span></p>
            </div>
            <div class="card warn">
              <h3>Start minimal, iterate</h3>
              <p>Ne tentez pas d’anticiper chaque edge case upfront. Run l’agent sur vraies tâches, observez où il casse, ajoutez instructions pour ces failure modes spécifiques. Minimal ne veut pas dire court : des milliers de tokens sont OK si chaque token est pertinent. <span class="source">⏱ 19:35</span></p>
            </div>
            <div class="card warn">
              <h3>Few-shot examples</h3>
              <p>Au lieu d’articuler chaque rule en mots, montrez ce à quoi ressemble le bon comportement : sélection d’outils, bon reasoning, proper multi-step execution. <span class="source">⏱ 19:56</span></p>
            </div>
          </div>

          <div class="card bad">
            <h3>Tool definitions et MCP</h3>
            <p>Chaque outil potentiellement appelable a besoin d’un schéma : ce qu’il fait, paramètres, quand l’utiliser. Chaque définition devrait être self-contained, robuste aux erreurs, avec instructions claires. En production, c’est de plus en plus géré via MCP, Model Context Protocol, standard pour connecter agents à outils et data sources externes. Vous hookez un serveur MCP pour GitHub, un pour database, un pour file system. Chaque serveur expose ses tools via interface consistente. Le catch : MCP rend très facile de plugger beaucoup d’outils, et c’est exactement le trap. Avec 4 ou 5 MCP servers, les tool definitions peuvent manger des milliers de tokens avant tout travail. <span class="source">⏱ 20:09</span></p>
          </div>

          <div class="card purple">
            <h3>Deux approches pour scaler les outils</h3>
            <p>1. Tool masking : garder définitions stables dans le préfixe caché, marquer certains outils unavailable pour la phase courante. 2. RAG-based tool selection : semantic retrieval pour pré-sélectionner seulement les tools pertinents. Elles ne sont pas mutuellement exclusives. Masking marche bien quand le jeu est modéré ; RAG selection quand vous avez vraiment beaucoup d’outils. <span class="source">⏱ 21:00</span></p>
          </div>

          ${quizHTML([
            { q: "Un system prompt d’agent devrait être...", o: ["Assez spécifique pour guider, assez flexible pour laisser le jugement", "Toujours le plus court possible", "Toujours une liste de règles rigides"], a: 0, e: "Writing at the right altitude : strong heuristics, not rigid rules." },

        content: `
          <h1>KV cache : pourquoi l’ordre du contexte coûte cher</h1>
          <p class="lead">
            Beaucoup de gens construisant des agents ne connaissent même pas le KV cache. Pourtant, il change la façon
            dont vous devez organiser le contexte. <span class="source">⏱ 21:13</span>
          </p>

          <div class="card info">
            <h3>Mécanisme</h3>
            <p>Quand vous envoyez des tokens à un LLM, le modèle compute des key-value representations pour chaque token. C’est computationnellement expensive, donc les inference providers cachent ces representations. Si le début de votre contexte, le préfixe, reste le même entre API calls, le provider peut réutiliser le cache et seulement processer les nouveaux tokens à la fin, ce qui est beaucoup plus rapide et bon marché. Mais si vous rearrangez ou changez la partie early de votre contexte entre calls, vous invalidez le cache et le provider doit recomputer tout from scratch. <span class="source">⏱ 21:18</span></p>
          </div>

          <div class="card bad">
            <h3>Exemple de prix</h3>
            <p>Avec Claude Sonnet, cached input tokens coûtent 30 cents par million, tandis qu’uncached tokens coûtent 3 dollars par million : différence x10. Pour un agent faisant 30 ou 40 API calls par tâche, ça s’additionne très vite. <span class="source">⏱ 21:51</span></p>
          </div>

          <div class="simulator">
            <div class="budget-row">

              <span class="budget-val" id="kvv-stable">20 000</span>
            </div>
            <div class="budget-row">
              <label for="kv-dynamic">Tokens dynamiques par appel</label>
              <input type="range" id="kv-dynamic" min="0" max="20000" step="250" value="3000" oninput="updateKv()">
              <span class="budget-val" id="kvv-dynamic">3 000</span>
            </div>
            <div class="budget-row">
              <label for="kv-calls">Nombre d’API calls</label>
              <input type="range" id="kv-calls" min="1" max="100" step="1" value="30" oninput="updateKv()">
              <span class="budget-val" id="kvv-calls">30</span>
            </div>
            <pre id="kv-out" class="prompt"></pre>
          </div>

          <div class="card good">
            <h3>Recommandation Manus</h3>
            <p>Tool masking plutôt que tool removal. Gardez toutes les tool definitions stables dans le contexte. Elles siègent near le top dans le préfixe qui gets cached, mais vous marquez certains tools unavailable pour la phase courante. Les définitions sont toujours là pour cache stability, mais l’agent sait ne pas les utiliser. Ils utilisent aussi des naming prefixes consistants pour aider l’agent à raisonner sur les catégories d’outils. <span class="source">⏱ 22:04</span></p>

            <h3>Principe large</h3>
            <p>Contenu stable va en haut du contexte : system prompt, tool definitions, tout ce qui ne change pas entre turns. Contenu dynamique — conversation history, current step, agent state — va en bas. <span class="source">⏱ 22:52</span></p>

          <h1>Put it all together : frequent intentional compaction</h1>
          <p class="lead">
            Dexy Horthy, CEO de HumanLayer, a présenté une méthodologie à l’AI Engineer Code Summit qui est un exemple
            très clean de tout cela. Son équipe aurait utilisé cette méthode pour shipper environ 35 000 lignes de code
            dans un large codebase Rust en une seule session de 7 heures. <span class="source">⏱ 23:30</span>
          </p>

          <div class="card info">
            <h3>Core idea</h3>
            <p>Frequent intentional compaction : structurer proactivement le travail de l’agent en phases, où chaque phase produit un artefact compacté, comme un structured markdown summary, et chaque nouvelle phase démarre avec une fresh context window contenant seulement cet artefact. De cette façon, vous restez délibérément sous 40 à 60% de la context window. <span class="source">⏱ 23:44</span></p>
          </div>

            </div>
          </div>

          <div class="grid">
            <div class="card good">

              <p>Avant code, l’agent explore codebase, lit fichiers, trace data flows, map architecture. Sous-agents handle raw file searches et code analysis. Résultats grep et file contents restent dans leurs contextes : isolate. Output : research file compact markdown avec file paths, function signatures, existing patterns, gotchas : write. Raw research peut consommer 60-80% contexte, artefact compresse à 15-20% : compress. <span class="source">⏱ 24:05</span></p>

              <div class="card info">
                <h3>Claude Code</h3>
                <p>CLI coding agent d’Anthropic, un des meilleurs exemples documentés de context engineering en pratique. Hybrid retrieval model : CLAUDE.md files loaded upfront at start of every session for foundational context, puis agent utilise tools comme Glob et Grep pour just-in-time navigation du codebase. Il n’essaie pas de pre-index everything, mais explore on demand. <span class="source">⏱ 25:43</span></p>

                <li>Autocompaction déclenchée à 95% context utilization.</li>
                <li>Préserve architectural decisions dans les five most recently accessed files.</li>
                <li>Peut spawn subagents pour tâches complexes, donnant à chacun une clean context window.</li>
                <li>Memory tool pour persister info across sessions.</li>
                <li>Philosophie : do the simplest thing that works. Ne pas overengineer la context pipeline. Laisser le modèle être smart sur ce dont il a besoin et lui donner les tools pour aller le chercher.</li>
