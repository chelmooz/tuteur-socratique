<html lang="fr">

  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🧠 <span>Agent Memory</span> Masterclass</div>
        <div class="muted small">SQLite • Vector DB • mem0 • Zep • LangMem • Waku / Hermes</div>
      </div>

      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>

      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les sources du transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "agent-memory-masterclass-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      race: { seeded: false },
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { started: false, finished: false, score: 0, total: 8, passed: false, remaining: 360, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          race: STATE.race,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        STATE.theme = data.theme || "dark";
        STATE.visited = new Set(data.visited || []);
        STATE.quizScores = data.quizScores || {};
        STATE.diagnostic = data.diagnostic || null;
        STATE.path = data.path || "masterclass";
        STATE.race = data.race || { seeded: false };
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        STATE.certName = data.certName || "";
        STATE.sourcesHidden = !!data.sourcesHidden;
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 8;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quiz(items, moduleId, title = "Quiz express", id = "") {
      return `
        <div class="quiz" data-module="${moduleId}" ${id ? `id="${id}"` : ""}>
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const total = qs.length;
      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + total;
      STATE.quizScores[moduleId] = { correct, total };
      saveState();
      updateScore();
    }

    function copyText(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.innerText.trim();
      const done = () => {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "✅ Copié";
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      const mods = visibleModules();
      $("#nav").innerHTML = mods.map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">
          ${m.title}
        </button>
      `).join("");

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `
        <section id="${m.id}" class="section">
          ${m.content}
        </section>
      `).join("");
    }

    function showSection(id) {
      const mod = MODULES.find(m => m.id === id);
      if (!mod) return;

      if (STATE.path === "express" && mod.express === false) {
        STATE.path = "masterclass";
        saveState();
        renderNav();
      }

      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));

      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "race") restoreRace();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0;
      let total = 0;
      Object.values(STATE.quizScores).forEach(s => {
        correct += s.correct || 0;
        total += s.total || 0;
      });
      if (STATE.exam.finished) {
        correct += STATE.exam.score;
        total += STATE.exam.total;
      }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() {
      STATE.theme = STATE.theme === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", STATE.theme);
      saveState();
    }

    function toggleSources() {
      STATE.sourcesHidden = !STATE.sourcesHidden;
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      saveState();
    }

    function toggleMobileNav() {
      $("#sidebar").classList.toggle("mobile-open");
    }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }

    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    const RACE_QUESTIONS = [
      {
        id: "jensen",
        q: "Qu est-ce que Jensen Huang a renversé sur mon tapis blanc ?",
        results: [
          { l: "SQLite FTS5", t: "4.6 s", s: "correct", a: "Chili oil / huile piment sur le tapis blanc." },
          { l: "mem0", t: "5.1 s", s: "correct", a: "Chili oil. Réponse courte et directe." },
          { l: "LangMem", t: "7.5 s", s: "correct", a: "Trouve le fait via le store sous-jacent, mais plus lent." },
          { l: "Zep", t: "en cours", s: "slow", a: "Le graphe temporel est encore en train d être construit." },
          { l: "Contrôle", t: "0 s", s: "none", a: "Aucune information : pas de mémoire injectée." }
        ],
        note: "Le contrôle répond correctement qu il ne sait pas, car il n a aucun souvenir."
      },
      {
        id: "paul",
        q: "Combien Paul Graham me doit-il ? (posée en chinois)",
        results: [
          { l: "SQLite FTS5", t: "10.3 s", s: "partial", a: "Keyword search fragile en cross-language. Peut répondre en anglais ou rater la nuance." },
          { l: "mem0", t: "6.2 s", s: "correct", a: "Paul Graham doit 20 quid / livres, pari sourdough à Lisbonne. Peut répondre en chinois." },
          { l: "LangMem", t: "8.1 s", s: "correct", a: "Correct si le store sous-jacent gère bien la similarité." },
          { l: "Zep", t: "lent", s: "slow", a: "Peut retenir la relation, mais latence élevée au seeding." },
          { l: "Contrôle", t: "0 s", s: "none", a: "Aucune idée." }
        ],
        note: "C est le genre de test qui montre les limites du simple keyword search."
      },
      {
        id: "elon",
        q: "À quelle heure Elon Musk arrive-t-il ?",
        results: [
          { l: "SQLite FTS5", t: "4.9 s", s: "correct", a: "21h, car l ancienne valeur 19h a été rendue obsolète." },
          { l: "mem0", t: "5.4 s", s: "correct", a: "21h avec supersede / invalidation temporelle." },
          { l: "LangMem", t: "7.8 s", s: "correct", a: "Dépend du store, mais peut gérer l update." },
          { l: "Zep", t: "lent", s: "partial", a: "Le graphe temporel est puissant, mais peut être overkill et lent." },
          { l: "Contrôle", t: "0 s", s: "none", a: "Cherche dans le calendrier : aucun événement trouvé." }
        ],
        note: "Ici, la vraie compétence est le supersede : ne pas supprimer 19h, mais la marquer dépassée."
      }
    ];

    function seedRace() {
      const btn = $("#seed-btn");
      const log = $("#race-log");
      if (!btn || !log) return;
      btn.disabled = true;
      btn.textContent = "Seeding...";
      log.innerHTML = "<p>Envoi des mêmes faits à SQLite, mem0, LangMem, Zep et au groupe contrôle.</p>";
      setTimeout(() => {
        STATE.race.seeded = true;
        saveState();
        btn.textContent = "✅ Stores seedés";
        log.innerHTML += "<p>Zep construit encore son graphe temporel. C est normal : plus riche, mais plus lent.</p>";
      }, 850);
    }

    function askRace(id) {
      if (!STATE.race.seeded) {
        alert("Commencez par seed les stores avec les mêmes faits.");
        return;
      }
      const q = RACE_QUESTIONS.find(x => x.id === id);
      const out = $("#race-results");
      if (!q || !out) return;

      out.innerHTML = `
        <h4>${q.q}</h4>
        ${q.results.map((r, i) => `
          <div class="race-row" style="animation-delay:${i * 0.08}s">
            <div class="head">
              <span>${r.l}</span>
              <span>
                <span class="race-time">${r.t}</span>
                <span class="race-status ${r.s}">${statusLabel(r.s)}</span>
              </span>
            </div>
            <div class="race-answer">${r.a}</div>
          </div>
        `).join("")}
        <p class="muted">${q.note}</p>
      `;
    }

    function statusLabel(s) {
      if (s === "correct") return "OK";
      if (s === "partial") return "Partiel";
      if (s === "slow") return "Lent";
      return "Aucune info";
    }

    function restoreRace() {
      const btn = $("#seed-btn");
      const log = $("#race-log");
      if (!btn || !log) return;
      if (STATE.race.seeded) {
        btn.disabled = true;
        btn.textContent = "✅ Stores seedés";
        log.innerHTML = "<p>Les faits ont déjà été envoyés. Vous pouvez poser les questions de test.</p>";
      }
    }

    const FLASHCARDS = [
      { front: "Amnésie par défaut", back: "Chaque appel LLM repart de zéro. La mémoire vient du harness, pas du modèle.", tip: "0:00" },
      { front: "Mémoire procédurale", back: "Savoir-faire, skills, procédures réutilisables. Exemple : rechercher les vidéos IA du matin.", tip: "0:25" },
      { front: "Mémoire sémantique", back: "Faits durables. Exemple : préférences, règles, procédures internes.", tip: "0:25" },
      { front: "Mémoire épisodique", back: "Événements datés. Exemple : réunion d hier, avis reçu mardi, arrivée changée à 21h.", tip: "0:25" },
      { front: "Do nothing", back: "memory.MD ou SOUL.MD est chargé directement dans le contexte. Simple, mais consomme des tokens.", tip: "5:08" },
      { front: "Keyword search", back: "SQLite FTS5 cherche des mots-clés. Rapide, explicable, mais fragile en synonymes et cross-language.", tip: "5:47" },
      { front: "RAG / vector", back: "Embeddings + similarité sémantique. Trouve des idées proches, pas seulement des mots identiques.", tip: "6:20" },
      { front: "Graph RAG", back: "Vectorise nodes et edges. Utile pour relations et contexte riche, mais peut être overkill.", tip: "6:52" },
      { front: "Retire / supersede", back: "Ne pas supprimer. Invalidé la valeur précédente avec une plage temporelle. L histoire reste traçable.", tip: "7:52" },
      { front: "Reflect / dreaming", back: "Tâche différée qui fusionne doublons, retire obsolete, consolide faits et skills.", tip: "9:01" },
      { front: "Zep", back: "Graphe temporel. Nodes, edges, validité. Puissant pour histoire vivante, lent au seeding.", tip: "16:32" },
      { front: "LangMem", back: "Un package, pas un store. Utilise votre propre base et gère extraction / mise à jour.", tip: "17:21" }
    ];

    function renderFlashcard() {
      const card = $("#flashcard");
      if (!card) return;
      const i = STATE.flash.index;
      const c = FLASHCARDS[i];
      card.classList.remove("flipped");
      card.innerHTML = `
        <div class="flash-inner" onclick="flipFlash()">
          <div class="flash-face flash-front">
            <h3>${c.front}</h3>
            <p class="muted">Cliquez pour retourner la carte.</p>
            <div><span class="pill">Carte ${i + 1}/${FLASHCARDS.length}</span><span class="pill">${c.tip}</span></div>
          </div>
          <div class="flash-face flash-back">
            <p><strong>${c.back}</strong></p>
            <p class="muted">${STATE.flash.known.has(i) ? "Déjà marquée connue." : "Marquez-la connue si vous la maîtrisez."}</p>
          </div>
        </div>
      `;
      const knownBtn = $("#flash-known");
      if (knownBtn) knownBtn.textContent = STATE.flash.known.has(i) ? "✅ Connue" : "Marquer connue";
    }

    function flipFlash() { $("#flashcard")?.classList.toggle("flipped"); }
    function nextFlash() { STATE.flash.index = (STATE.flash.index + 1) % FLASHCARDS.length; saveState(); renderFlashcard(); }
    function prevFlash() { STATE.flash.index = (STATE.flash.index - 1 + FLASHCARDS.length) % FLASHCARDS.length; saveState(); renderFlashcard(); }
    function markFlash() {
      const i = STATE.flash.index;
      if (STATE.flash.known.has(i)) STATE.flash.known.delete(i); else STATE.flash.known.add(i);
      saveState();
      renderFlashcard();
    }

    function generateArchitecture() {
      const useCase = $("#arch-usecase")?.value || "assistant_perso";
      const volume = $("#arch-volume")?.value || "faible";
      const temporal = $("#arch-temporal")?.value === "oui";
      const relations = $("#arch-relations")?.value === "oui";
      const multilingue = $("#arch-multilingue")?.value === "oui";
      const complexite = $("#arch-complexite")?.value || "simple";

      let stack = [];
      let why = [];
      let risks = [];
      let prompt = "";

      if (useCase === "assistant_perso") {
        stack = ["SOUL.MD", "memory.MD", "skills/", "SQLite state.db + FTS5", "consolidation périodique"];
        why = ["Simple à auditer", "Editable directement", "Suffisant pour un assistant personnel", "Évite la dépendance aux embeddings"];
        risks = ["Le keyword search peut rater les synonymes", "Ne pas tout charger dans le contexte si memory.MD grossit"];
      } else if (useCase === "support_interne") {
        stack = ["memory.MD pour politiques stables", "Supabase PGVector pour documentation", "metadata : date, service, version", "reranker si beaucoup de chunks"];
        why = ["Les procédures changent", "La recherche sémantique aide les formulations variées", "Les metadata permettent de filtrer"];
        risks = ["Sans refresh, la base vectorielle devient obsolète", "Trop de chunks non pertinents diluent la réponse"];
      } else if (useCase === "crm_relations") {
        stack = relations ? ["mem0 graph memory", "ou Zep si historique temporel fort", "attributs source : email, réunion, web"] : ["mem0 row memory", "SQLite pour historique simple"];
        why = ["Les relations comptent : personne, produit, événement, dette", "Le graphe révèle des liens indirects"];
        risks = ["Overkill si peu d entités", "Zep peut être lent au seeding"];
      } else if (useCase === "analyse_avis") {
        stack = ["Supabase PGVector", "metadata : établissement, plateforme, note, date", "episodic log pour tendances", "SQLite pour requêtes simples"];
        why = ["Beaucoup de texte court", "Filtres métadonnées indispensables", "La similarité aide à regrouper problèmes récurrents"];
        risks = ["Attention aux doublons d avis", "Ne pas confondre note basse et contenu négatif"];
      } else if (useCase === "agent_codage") {
        stack = ["skills procéduraux", "state.db épisodique", "memory.MD pour conventions", "retrieval gate sélectif"];
        why = ["Le code a besoin de procédures et d historique de tâches", "Moins besoin de graphe lourd"];
        risks = ["Trop de mémoire non structurée pollue le contexte", "Il faut retirer les décisions dépassées"];
      }

      if (multilingue) {
        stack.push("préférer embeddings / mem0 / vector plutôt que seul FTS5");
        why.push("Le keyword search est fragile entre langues");
      }
      if (temporal) {
        stack.push("supersede / invalidation temporelle obligatoire");
        why.push("Les faits changent : conserver l histoire sans confondre le présent");
      }
      if (volume === "élevé") {
        stack.push("consolidation + reflection différée");
        why.push("Sinon la mémoire grossit sans devenir un actif");
      }
      if (complexite === "avancée") {
        stack.push("retrieval gate + tracing + eval");
        why.push("Pour mesurer quelle mémoire sert réellement la réponse");
      }

      prompt = `Tu es un agent IA avec une architecture mémoire explicite.

Règles mémoire :
- Consulte memory.MD pour les faits durables.
- Consulte state.db pour les événements datés et l historique récent.
- Utilise les skills pour les procédures.
- Avant de répondre, décide si une retrieval est nécessaire.
- Si une information est dépassée, ne la supprime pas : marque-la superseded avec date.
- Cite la source interne quand c est possible.
- Ne charge pas toute la mémoire dans le contexte : récupère seulement le nécessaire.

Stack recommandée : ${stack.join(", ")}.`;

      const out = $("#arch-output");
      if (!out) return;
      out.textContent =
        "Cas d usage : " + useCase + "\n" +
        "Complexité : " + complexite + "\n\n" +
        "STACK RECOMMANDÉE\n- " + stack.join("\n- ") + "\n\n" +
        "POURQUOI\n- " + why.join("\n- ") + "\n\n" +

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 6;
      saveState();
      updateScore();

      const res = $("#exam-result");

        const level = STATE.diagnostic?.level || "praticien";

      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

              <li><strong>Hermes</strong> : exemple de mémoire simple via SOUL.MD, memory.MD, skills, state.db.</li>
              <li><strong>Sean Chen / seanchen.io</strong> : créateur du contenu, fondateur AutoManus, parcours MIT / Google / Walmart, canal bilingue IA.</li>
              <li><strong>GitHub ShenSeanChen</strong> : dépôts liés à React, Supabase, Deep Research, RAG, Waku.</li>
            </ul>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('action')">← Revenir à l examen</button>
            <button class="btn" onclick="showSection('home')">Retour à l accueil</button>
          </div>
        `
      }
    ];

    function pickRetrieval(type) {
      const out = $("#retrieval-out");
      if (!out) return;
      const texts = {
        simple: "Recommandation : Do nothing.\nSi le fait est court, stable et critique, il peut vivre dans memory.MD et être chargé directement dans le contexte.\nÉviter un vector store pour une préférence permanente simple.",
        synonyme: "Recommandation : Vector search.\nLa question utilise des mots différents du souvenir. L embedding rapproche sens et variantes lexicales.",
        relation: "Recommandation : Graph RAG ou mem0 graph.\nSi la réponse dépend de liens entre entités, un graphe peut révéler des connexions qu une simple ligne ne montre pas.",
        agent: "Recommandation : Agentic RAG.\nL agent décide des outils, vérifie la pertinence, combine vector DB, SQL, web search, puis rerank avant génération."
      };
      out.style.display = "block";
      out.textContent = texts[type] || "";
    }

    function init() {
      loadState();
      document.body.setAttribute("data-theme", STATE.theme);
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      const first = visibleModules()[0]?.id || "home";
      showSection(first);
      updateScore();
      updateChecklistProgress();

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.copyText = copyText;
    window.seedRace = seedRace;
    window.askRace = askRace;
    window.renderFlashcard = renderFlashcard;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.generateArchitecture = generateArchitecture;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;
    window.pickRetrieval = pickRetrieval;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
