<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Premium : Agent de Recherche LangGraph | State, Nodes, Edges, Human-in-the-loop, Send API</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);

  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);

  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🕸️ <span>LangGraph Research Agent</span> Atelier</div>
        <div class="muted small">State • Nodes • Edges • Human-in-the-loop • Subgraph • Send API • Tavily • LangSmith</div>
      </div>

      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>

      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation de l atelier"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "langgraph-research-agent-workshop-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { started: false, finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        STATE.theme = data.theme || "dark";
        STATE.visited = new Set(data.visited || []);
        STATE.quizScores = data.quizScores || {};
        STATE.diagnostic = data.diagnostic || null;
        STATE.path = data.path || "masterclass";
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        STATE.certName = data.certName || "";
        STATE.sourcesHidden = !!data.sourcesHidden;
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express", boxId = "") {
      const idAttr = boxId ? ' id="' + boxId + '"' : "";
      return `
        <div class="quiz" data-module="${moduleId}"${idAttr}>
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function codeHTML(label, id, code) {
      return `
        <div class="card">
          <h3>${label}</h3>
          <pre class="code" id="${id}">${code}</pre>
          <button class="btn secondary small" onclick="copyText('${id}', this)">Copier</button>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const total = qs.length;
      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + total;
      STATE.quizScores[moduleId] = { correct, total };
      saveState();
      updateScore();
    }

    function copyText(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.innerText.trim();
      const done = () => {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "✅ Copié";
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      const mods = visibleModules();
      $("#nav").innerHTML = mods.map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">
          ${m.title}
        </button>
      `).join("");

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `
        <section id="${m.id}" class="section">
          ${m.content}
        </section>
      `).join("");
    }

    function showSection(id) {
      const mod = MODULES.find(m => m.id === id);
      if (!mod) return;

      if (STATE.path === "express" && mod.express === false) {
        STATE.path = "masterclass";
        saveState();
        renderNav();
      }

      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));

      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "simulator") simReset();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0;
      let total = 0;
      Object.values(STATE.quizScores).forEach(s => {
        correct += s.correct || 0;
        total += s.total || 0;
      });
      if (STATE.exam.finished) {
        correct += STATE.exam.score;
        total += STATE.exam.total;
      }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() {
      STATE.theme = STATE.theme === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", STATE.theme);
      saveState();
    }

    function toggleSources() {
      STATE.sourcesHidden = !STATE.sourcesHidden;
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      saveState();
    }

    function toggleMobileNav() {
      $("#sidebar").classList.toggle("mobile-open");
    }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }

    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    const DIAG_TEXT = {
      debutant: "Commencez par les piliers State / Nodes / Edges, puis suivez l atelier pas à pas. Ne cherchez pas à tout paralléliser au début.",
      praticien: "Focus sur le subgraph interview, le human-in-the-loop et la Send API. Vous pouvez coder un graphe complet et le monitorer avec LangSmith.",
      expert: "Analysez les trade-offs : coût, latence, parallelisme, qualité du rapport, contrôle humain. Ajoutez eval, tracing et garde-fous de boucle."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) {
        alert("Répondez aux trois questions du diagnostic.");
        return;
      }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.praticien}</p>
          <p class="muted">Le mode express masque les modules avancés. Vous pouvez basculer en masterclass à tout moment depuis le diagnostic.</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    let sim = {
      stage: "idle",
      topic: "LangGraph",
      maxAnalysts: 1,
      analysts: [],
      feedback: "",
      sections: [],
      turns: 0
    };

    function simReset() {
      sim = {
        stage: "idle",
        topic: "LangGraph",
        maxAnalysts: 1,
        analysts: [],
        feedback: "",
        sections: [],
        turns: 0
      };
      const log = $("#sim-log");
      const state = $("#sim-state");
      const stage = $("#sim-stage");
      const fb = $("#sim-feedback");
      if (log) log.textContent = "Atelier prêt. Commencez par create_analysts.";
      if (state) state.textContent = JSON.stringify(sim, null, 2);
      if (stage) stage.textContent = "idle";
      if (fb) fb.value = "Je veux deux analystes, dont un nommé Mike.";
    }

    function simLog(msg) {
      const log = $("#sim-log");
      if (!log) return;
      log.textContent += "\n" + msg;
      log.scrollTop = log.scrollHeight;
    }

    function simUpdate() {
      const state = $("#sim-state");
      const stage = $("#sim-stage");
      if (state) state.textContent = JSON.stringify(sim, null, 2);
      if (stage) stage.textContent = sim.stage;
      saveState();
    }

    function simStep(action) {
      if (action === "create") {
        if (sim.stage === "idle" || sim.stage === "feedback_received") {
          if (sim.stage === "feedback_received") {
            sim.maxAnalysts = 2;
            sim.analysts = [
              { name: "Dr. Emily Carter", role: "Theoretical Physics", affiliation: "Institute of Theoretical Physics" },
              { name: "Mike", role: "Systems Engineer", affiliation: "Applied AI Lab" }
            ];
            sim.stage = "recreated";
            simLog("create_analysts relancé avec le feedback humain. 2 analystes créés.");
          } else {
            sim.analysts = [
              { name: "Dr. Emily Carter", role: "Theoretical Physics", affiliation: "Institute of Theoretical Physics" }
            ];
            sim.stage = "created";
            simLog("create_analysts exécuté. 1 analyste créé à partir du topic LangGraph.");
          }
        } else {
          simLog("Impossible : create_analysts n est pas attendu à ce stade.");
        }
      }

      if (action === "feedback") {
        if (sim.stage === "created" || sim.stage === "recreated") {
          const fb = $("#sim-feedback");
          sim.feedback = fb ? fb.value : "";
          sim.stage = "feedback_received";
          simLog("human_feedback interrompt le graphe et renvoie le feedback vers create_analysts.");
        } else {
          simLog("Impossible : il faut d abord créer des analystes.");
        }
      }

      if (action === "approve") {
        if (sim.stage === "created" || sim.stage === "recreated") {
          sim.feedback = "";
          sim.stage = "approved";
          simLog("Feedback validé. Le graphe peut passer à initiate_all_interviews.");
        } else {
          simLog("Impossible : rien à approuver.");
        }
      }

      if (action === "fanout") {
        if (sim.stage === "approved") {
          sim.stage = "interviewing";
          sim.turns = 0;
          sim.sections = [];
          simLog("Send API fan-out : une interview parallèle est lancée pour chaque analyste.");
        } else {
          simLog("Impossible : approuvez d abord les analystes.");
        }
      }

      if (action === "interview") {
        if (sim.stage === "interviewing") {
          sim.turns++;
          simLog("Tour " + sim.turns + " : generate_question, search_web, answer_question.");
          if (sim.turns >= 2) {
            sim.sections = sim.analysts.map(a => a.name + " : section rédigée après interview.");
            sim.stage = "sections_ready";
            simLog("route_messages atteint max_turns. save_interview puis write_section exécutés.");
          }
        } else {
          simLog("Impossible : lancez d abord le fan-out des interviews.");
        }
      }

      if (action === "finalize") {
        if (sim.stage === "sections_ready") {
          sim.stage = "finalized";
          simLog("write_report, write_introduction, write_conclusion, finalize_report exécutés. Rapport disponible dans LangSmith.");
        } else {
          simLog("Impossible : les sections ne sont pas prêtes.");
        }
      }

      simUpdate();
    }

    function chooseScenario(key) {
      const out = $("#scenario-out");
      if (!out) return;
      const texts = {
        simple: "Cas : question factuelle simple.\nArchitecture recommandée : un LLM + web search, pas de LangGraph complexe.\nPourquoi : un graphe ajoute de la latence, des coûts et de la surface de bug sans bénéfice réel.",
        multi_angle: "Cas : sujet needing plusieurs angles (science, business, réglementation, expérience utilisateur).\nArchitecture recommandée : create_analysts, human_feedback, Send API parallel interviews, write_report.\nPourquoi : les analystes personas structurent la diversité des questions et des sources.",
        regulated: "Cas : domaine sensible, conformité, validation humaine obligatoire.\nArchitecture recommandée : interrupt human-in-the-loop avant interviews, traçabilité LangSmith, sources attribuées, garde-fous de boucle.\nPourquoi : l humain doit pouvoir rejeter ou corriger les analystes avant la production du rapport.",
        cost: "Cas : budget serré, beaucoup de requêtes.\nArchitecture recommandée : max_turns faible, modèles auxiliaires moins chers pour consolidation, caching des recherches, limitation du fan-out.\nPourquoi : paralleliser sans plafond consomme rapidement des tokens et des appels d outils."
      };
      out.style.display = "block";
      out.textContent = texts[key] || "";
    }

    function generateWorkshopPrompt() {
      const topic = $("#pg-topic")?.value || "LangGraph";
      const personas = $("#pg-personas")?.value || "2";
      const depth = $("#pg-depth")?.value || "intermédiaire";
      const tone = $("#pg-tone")?.value || "pédagogique";
      const sources = $("#pg-sources")?.value || "web + documents internes";
      const format = $("#pg-format")?.value || "rapport markdown";

      const prompt = `Tu es un architecte d agent de recherche LangGraph.

Objectif : produire un rapport ${format} sur le sujet suivant : ${topic}.

Configuration :
- Nombre d analystes : ${personas}
- Profondeur : ${depth}
- Ton : ${tone}
- Sources autorisées : ${sources}

Instructions :
1. Crée des analystes personas distincts, chacun avec nom, rôle, affiliation, description, préoccupations et motivations.
2. Avant de lancer les interviews, soumets les analystes à validation humaine via interrupt.
3. Si l humain demande une modification, régénère les analystes sans perdre l historique du state.
4. Lance une interview parallèle par analyste avec Send API.
5. Dans chaque subgraph interview : pose une question, effectue une recherche web, réponds, itère jusqu à max_turns.
6. Sauvegarde chaque interview, rédige une section, puis agrège les sections.
7. Rédige introduction, corps du rapport, conclusion et rapport final.
8. Trace tout dans LangSmith : state, nodes, edges, appels d outils, latence, erreurs.

Contraintes :
- Ne supprime pas les informations obsolètes : marque-les comme remplacées si nécessaire.
- Utilise des reducers pour context et sections.
- Limite le nombre de tours pour contrôler les coûts.
- Cite les sources quand elles existent.`;

      const out = $("#pg-out");
      if (out) {
        out.textContent = prompt;
        out.style.display = "block";
      }
      const copy = $("#pg-copy");
      if (copy) copy.style.display = "inline-flex";
    }

    const FLASHCARDS = [
      { front: "State", back: "Le contrat de données que le graphe suit du début à la fin. Il définit ce qui est disponible à chaque node.", tip: "0:24:10" },
      { front: "Node", back: "Une unité de travail : créer des analystes, interroger, chercher, répondre, rédiger une section.", tip: "0:23:29" },
      { front: "Edge", back: "La règle de transition entre nodes. Peut être conditionnelle selon le state.", tip: "0:23:29" },
      { front: "Human-in-the-loop", back: "Interrupt qui suspend le graphe pour demander une validation ou un feedback humain.", tip: "0:56:39" },
      { front: "Send API", back: "Permet de fan-out plusieurs sous-graphes en parallèle, un par analyste.", tip: "2:33:37" },
      { front: "Subgraph", back: "Un graphe imbriqué dans un autre. Ici, le subgraph interview est appelé par conduct_interview.", tip: "1:22:01" },
      { front: "Reducer", back: "Fusionne les mises à jour d une clé du state. Exemple : ajouter au context ou aux sections au lieu de remplacer.", tip: "1:24:26" },
      { front: "Tavily", back: "Outil de recherche web utilisé pour alimenter les réponses de l expert pendant l interview.", tip: "1:42:19" },
      { front: "LangSmith", back: "Plateforme de tracing pour observer les runs, latences, erreurs et le rapport final.", tip: "0:08:38" },
      { front: "Structured output", back: "Forcer le LLM à respecter un schéma Pydantic, ici Perspectives avec une liste d Analyst.", tip: "0:30:43" }
    ];

    function renderFlashcard() {
      const card = $("#flashcard");
      if (!card) return;
      const i = STATE.flash.index;
      const c = FLASHCARDS[i];
      card.classList.remove("flipped");
      card.innerHTML = `
        <div class="flash-inner" onclick="flipFlash()">
          <div class="flash-face flash-front">
            <h3>${c.front}</h3>
            <p class="muted">Cliquez pour retourner la carte.</p>
            <div><span class="pill">Carte ${i + 1}/${FLASHCARDS.length}</span><span class="pill">${c.tip}</span></div>
          </div>
          <div class="flash-face flash-back">
            <p><strong>${c.back}</strong></p>
            <p class="muted">${STATE.flash.known.has(i) ? "Déjà marquée connue." : "Marquez-la connue si vous la maîtrisez."}</p>
          </div>
        </div>
      `;
      const knownBtn = $("#flash-known");
      if (knownBtn) knownBtn.textContent = STATE.flash.known.has(i) ? "✅ Connue" : "Marquer connue";
    }

    function flipFlash() { $("#flashcard")?.classList.toggle("flipped"); }
    function nextFlash() { STATE.flash.index = (STATE.flash.index + 1) % FLASHCARDS.length; saveState(); renderFlashcard(); }

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.started = true;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = "";
        if (STATE.exam.passed) {
          advice = "Vous pouvez architecturer un agent de recherche LangGraph avec contrôle humain, subgraph parallèle et tracing.";
        } else if (correct >= 5) {
          advice = "Bases solides. Revoyez Send API, route_messages, reducers et validation Pydantic.";
        } else {
          advice = "Reprenez les piliers State / Nodes / Edges, puis l atelier pas à pas avant de coder.";
        }
        res.innerHTML = `
          <strong>Résultat : ${correct}/${qs.length}</strong><br>
          ${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br>
          <span class="muted">${advice}</span>
        `;
      }

      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

    function restoreExam() {
      updateExamTimer();
      if (STATE.exam.finished) {
        const btn = $("#exam-start");

        const res = $("#exam-result");
        if (res && !res.innerHTML) {

        }
        const certBtn = $("#go-cert");

      }
    }

          <div class="simulator">
            <div class="step-row no-print">
              <button class="btn" onclick="simStep('create')">1. create_analysts</button>
              <button class="btn secondary" onclick="simStep('feedback')">2. human_feedback</button>
              <button class="btn secondary" onclick="simStep('approve')">3. approuver</button>
              <button class="btn secondary" onclick="simStep('fanout')">4. Send fan-out</button>
              <button class="btn secondary" onclick="simStep('interview')">5. interview tour</button>
              <button class="btn secondary" onclick="simStep('finalize')">6. finalize report</button>
              <button class="btn secondary" onclick="simReset()">Réinitialiser</button>
            </div>

            <label for="sim-feedback">Feedback humain simulé</label>
            <input id="sim-feedback" value="Je veux deux analystes, dont un nommé Mike." />

            <p class="small muted">Étape courante : <span class="highlight" id="sim-stage">idle</span></p>
            <div id="sim-log" class="sim-log"></div>
            <div id="sim-state" class="sim-state"></div>
          </div>

          <div class="grid">
            <div class="card good">
              <h3>Ce que vous observez</h3>
              <p>Le state évolue : analysts, feedback, turns, sections. Chaque button simule un node ou un edge conditionnel.</p>
            </div>
            <div class="card warn">
              <h3>Réflexe pro</h3>
              <p>Avant de coder, simulez toujours le chemin heureux et le chemin de rejet humain. Cela révèle les edges manquants.</p>
            </div>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('simulator')">← Précédent</button>
            <button class="btn" onclick="nextFrom('simulator')">Scénarios →</button>
          </div>
        `
      },
      {
        id: "scenarios",
        title: "12. Scénarios",
        express: false,
        content: `
          <h1>Scénarios branching : choisir la bonne architecture</h1>
          <p class="lead">Tous les projets ne méritent pas un agent complexe. Sélectionnez un scénario pour voir la recommandation.</p>

          <div class="simulator">
            <div class="step-row no-print">
              <button class="btn secondary" onclick="chooseScenario('simple')">Question simple</button>
              <button class="btn secondary" onclick="chooseScenario('multi_angle')">Recherche multi-angle</button>
              <button class="btn secondary" onclick="chooseScenario('regulated')">Domaine sensible</button>
              <button class="btn secondary" onclick="chooseScenario('cost')">Budget serré</button>
            </div>
            <pre id="scenario-out" class="prompt" style="display:none"></pre>
          </div>

          <div class="card info">
            <h3>Leçon du transcript</h3>
            <p>La complexité doit être justifiée par un besoin : diversité des angles, contrôle humain, parallelisme, qualité du livrable, traçabilité.</p>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('scenarios')">← Précédent</button>
            <button class="btn" onclick="nextFrom('scenarios')">Générateur de prompts →</button>
          </div>
        `
      },
      {
        id: "generator",
        title: "13. Prompts",
        express: false,
        content: `
          <h1>Générateur de prompt système pour votre agent</h1>
          <p class="lead">Remplissez les champs, générez un prompt réutilisable pour create_analysts, interviews et rapport final.</p>

          <div class="generator">
            <div class="grid">
              <div>
                <label for="pg-topic">Sujet de recherche</label>
                <input id="pg-topic" value="LangGraph" />
              </div>
              <div>
                <label for="pg-personas">Nombre d analystes</label>
                <input id="pg-personas" value="2" />
              </div>
              <div>
                <label for="pg-depth">Profondeur</label>
                <select id="pg-depth">
                  <option>superficielle</option>
                  <option selected>intermédiaire</option>
                  <option>deep research</option>
                </select>
              </div>
              <div>
                <label for="pg-tone">Ton du rapport</label>
                <select id="pg-tone">
                  <option selected>pédagogique</option>
                  <option>technique</option>
                  <option>exécutif</option>
                  <option>critique</option>
                </select>
              </div>
              <div>
                <label for="pg-sources">Sources autorisées</label>
                <input id="pg-sources" value="web + documents internes" />
              </div>
              <div>
                <label for="pg-format">Format de sortie</label>
                <input id="pg-format" value="rapport markdown" />
              </div>
            </div>

            <button class="btn" onclick="generateWorkshopPrompt()">Générer le prompt</button>
            <pre id="pg-out" class="prompt" style="display:none"></pre>
            <button class="btn secondary small" id="pg-copy" style="display:none" onclick="copyText('pg-out', this)">Copier le prompt</button>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('generator')">← Précédent</button>
            <button class="btn" onclick="nextFrom('generator')">Flashcards →</button>
          </div>
        `
      },
      {
        id: "flashcards",
        title: "14. Flashcards",
        express: false,
        content: `
          <h1>Flashcards de mémorisation active</h1>
          <p class="lead">Retournez la carte, marquez-la connue, avancez. Ces cartes résument le vocabulaire essentiel du transcript.</p>

          <div class="flashcards">
            <div id="flashcard" class="flashcard"></div>
            <div class="toolbar no-print">
              <button class="btn secondary" onclick="prevFlash()">← Précédente</button>
              <button class="btn" onclick="flipFlash()">Retourner</button>
              <button class="btn secondary" onclick="nextFlash()">Suivante →</button>
              <button class="btn secondary" id="flash-known" onclick="markFlash()">Marquer connue</button>
            </div>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('flashcards')">← Précédent</button>
            <button class="btn" onclick="nextFrom('flashcards')">Erreurs fréquentes →</button>
          </div>
        `
      },
      {
        id: "errors",
        title: "15. Erreurs",
        express: true,
        content: `
          <h1>Erreurs fréquentes à éviter absolument</h1>
          <p class="lead">Le transcript montre aussi des difficultés réelles : imports relatifs, state mal typé, boucles non contrôlées, clés exposées, dépendance excessive à l IA pendant l apprentissage.</p>

          <div class="grid">
            <div class="card bad">
              <h3>Imports relatifs cassés</h3>
              <p>Le formateur rencontre plusieurs erreurs de module. Solutions : structure source/, fichiers __init__.py si nécessaire, imports absolus ou configuration correcte.</p>
            </div>
            <div class="card bad">
              <h3>State trop strict</h3>
              <p>human_analyst_feedback et analysts doivent être Optional. Sinon le graphe échoue au premier passage.</p>
            </div>
            <div class="card bad">
              <h3>Dictionary au lieu d Analyst</h3>
              <p>Si vous recevez un dict, la property persona n existe pas. Il faut model_validate pour reconstruire l objet.</p>
            </div>
            <div class="card bad">
              <h3>Boucle infinie d interview</h3>
              <p>Sans max_turns et route_messages, generate_question et answer_question peuvent tourner indéfiniment.</p>
            </div>
            <div class="card bad">
              <h3>Parallélisation sans plafond</h3>
              <p>Send API multiplie les coûts. Fixez max_analysts, max_results, max_turns et surveillez LangSmith.</p>
            </div>
            <div class="card bad">
              <h3>Trop déléguer à l IA</h3>
              <p>Le transcript conseille : pendant l apprentissage, faites vos propres erreurs, comprenez, puis utilisez l IA pour accélérer.</p>
            </div>
          </div>

          ${quizHTML([
            { q: "Quelle erreur provoque souvent no module named states ou relative import ?", o: ["Mauvaise structure de paquets / imports", "Tavily indisponible", "Température trop basse"], a: 0, e: "C est un problème de configuration projet, visible dans le transcript." },
            { q: "Pourquoi rendre human_analyst_feedback Optional ?", o: ["Parce qu il peut ne pas exister au premier passage", "Pour supprimer le state", "Pour forcer l humain à répondre"], a: 0, e: "Le grappe doit pouvoir démarrer sans feedback initial." },
            { q: "Quel garde-fou empêche la boucle interview de durer trop longtemps ?", o: ["LangSmith", "max_turns dans route_messages", "Pydantic"], a: 1, e: "La condition de sortie compte les réponses expert." }
          ], "errors")}

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('errors')">← Précédent</button>
            <button class="btn" onclick="nextFrom('errors')">Examen final →</button>
          </div>
        `
      },
      {
        id: "final",
        title: "✅ Examen final",
        express: true,
        content: `
          <h1>Examen final chronométré</h1>
          <p class="lead">10 questions. 8 minutes. Seuil de réussite : 7/10. Objectif : vérifier que vous pouvez concevoir, coder et déboguer l agent de recherche.</p>

          <div class="toolbar no-print">
            <button class="btn" id="exam-start" onclick="startExam()">Démarrer le minuteur</button>
            <div id="exam-timer" class="pill">⏱ 8:00</div>
          </div>

          ${finalQuizHTML()}

          <div class="toolbar no-print">
            <button class="btn" onclick="submitExam()">Soumettre l examen</button>
            <button class="btn secondary" id="go-cert" style="display:none" onclick="showSection('action')">Voir certificat →</button>
          </div>
          <div class="result" id="exam-result" aria-live="polite"></div>
        `
      },
      {
        id: "action",
        title: "🏆 Certificat",
        express: true,
        content: `
          <h1>Certificat et plan d action 7 jours</h1>
          <p class="lead">Générez votre certificat, exportez votre rapport de progression et passez à l implémentation réelle.</p>

          <div class="card info no-print">
            <h3>Votre nom pour le certificat</h3>
            <input id="cert-name" placeholder="Prénom / pseudo" />
            <div class="toolbar">
              <button class="btn" onclick="generateCert()">Générer le certificat</button>
              <button class="btn secondary" onclick="exportJSON()">Exporter JSON</button>
              <button class="btn secondary" onclick="window.print()">Imprimer / PDF</button>
              <button class="btn secondary" onclick="resetCourse()">Réinitialiser</button>
            </div>
          </div>

          <div id="certificate" class="certificate">
            <span class="badge">🕸️</span>
            <h2>Certificat de maîtrise</h2>
            <p>Décerné à</p>
            <h3 id="cert-name-out">Apprenant</h3>
            <p>pour avoir complété l atelier</p>
            <p class="highlight">Agent de Recherche LangGraph : State, Nodes, Edges, Human-in-the-loop, Send API</p>
            <p class="muted">Date : <span id="cert-date"></span> • Score : <span id="cert-score"></span> • Niveau : <span id="cert-level"></span></p>
          </div>

          <h2>Plan d action 7 jours</h2>
          <div class="card checklist">
            <label><input type="checkbox" id="c1" onchange="toggleCheck('c1')"> Jour 1 : créer le projet UV, .env, langgraph.json et vérifier les imports.</label>
            <label><input type="checkbox" id="c2" onchange="toggleCheck('c2')"> Jour 2 : coder Analyst, Perspectives, GenerateAnalystState et le node create_analysts.</label>
            <label><input type="checkbox" id="c3" onchange="toggleCheck('c3')"> Jour 3 : ajouter human_feedback avec interrupt et conditional edge.</label>
            <label><input type="checkbox" id="c4" onchange="toggleCheck('c4')"> Jour 4 : construire le subgraph interview avec max_turns.</label>
            <label><input type="checkbox" id="c5" onchange="toggleCheck('c5')"> Jour 5 : intégrer Tavily, structured search query et formatage des docs.</label>
            <label><input type="checkbox" id="c6" onchange="toggleCheck('c6')"> Jour 6 : brancher Send API pour paralléliser plusieurs analystes.</label>
            <label><input type="checkbox" id="c7" onchange="toggleCheck('c7')"> Jour 7 : rédiger report/intro/conclusion, finaliser et inspecter dans LangSmith.</label>
          </div>
          <p class="muted small">Checklist : <span id="check-progress">0/7</span></p>

          <h2>Ressources ancrées au transcript</h2>
          <div class="resources">
            <ul>
              <li><strong>Projet</strong> : agent de recherche LangGraph avec analystes, interviews, web search, parallelisation et rapport final.</li>
              <li><strong>Outils</strong> : VS Code, UV, OpenAI, Tavily, LangSmith, Pydantic, LangChain, LangGraph.</li>
              <li><strong>Concepts clés</strong> : state, nodes, edges, interrupt, Send API, subgraph, reducers, structured output.</li>
              <li><strong>Conseil du formateur</strong> : ne pas déléguer entièrement l apprentissage à l IA ; comprendre ses erreurs d abord.</li>
            </ul>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('action')">← Revenir à l examen</button>
            <button class="btn" onclick="showSection('home')">Retour à l accueil</button>
          </div>
        `
      }
    ];

    function init() {
      loadState();
      document.body.setAttribute("data-theme", STATE.theme);
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      const first = visibleModules()[0]?.id || "home";
      showSection(first);
      updateScore();
      updateChecklistProgress();

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.copyText = copyText;
    window.simStep = simStep;
    window.simReset = simReset;
    window.chooseScenario = chooseScenario;
    window.generateWorkshopPrompt = generateWorkshopPrompt;
    window.renderFlashcard = renderFlashcard;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
</html>
