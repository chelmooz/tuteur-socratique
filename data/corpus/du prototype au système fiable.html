}

<body data-theme="dark">
  <header class="topbar">

      <div>

  </div>

  <script>
    const KEY = "ai-agents-complete-premium-v1";
    const STATE = {theme:"dark",visited:new Set(),quizScores:{},diagnostic:null,path:"masterclass",flash:{index:0,known:new Set()},checklist:{},exam:{finished:false,score:0,total:10,passed:false,remaining:480,interval:null},certName:"",sourcesHidden:false};
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

    function saveState(){try{localStorage.setItem(KEY,JSON.stringify({theme:STATE.theme,visited:[...STATE.visited],quizScores:STATE.quizScores,diagnostic:STATE.diagnostic,path:STATE.path,flash:{index:STATE.flash.index,known:[...STATE.flash.known]},checklist:STATE.checklist,exam:{finished:STATE.exam.finished,score:STATE.exam.score,total:STATE.exam.total,passed:STATE.exam.passed},certName:STATE.certName,sourcesHidden:STATE.sourcesHidden}))}catch(e){}}
    function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);Object.assign(STATE,{theme:d.theme||"dark",visited:new Set(d.visited||[]),quizScores:d.quizScores||{},diagnostic:d.diagnostic||null,path:d.path||"masterclass",certName:d.certName||"",sourcesHidden:!!d.sourcesHidden});STATE.flash.index=d.flash?.index||0;STATE.flash.known=new Set(d.flash?.known||[]);STATE.checklist=d.checklist||{};if(d.exam){STATE.exam.finished=!!d.exam.finished;STATE.exam.score=d.exam.score||0;STATE.exam.total=d.exam.total||10;STATE.exam.passed=!!d.exam.passed}}catch(e){}}
    function quizHTML(items,moduleId,title="Quiz express"){return `<div class="quiz" data-module="${moduleId}"><h3>${title}</h3>${items.map((it,i)=>`<div class="q" data-answer="${it.a}"><p class="q-text">${i+1}. ${it.q}</p>${it.o.map((opt,j)=>`<label class="q-option"><input type="radio" name="${moduleId}-q${i}" value="${j}">${opt}</label>`).join("")}<div class="explain">${it.e||""}</div></div>`).join("")}<button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button><div class="result" aria-live="polite"></div></div>`}
    function switchTab(btn,panelId){const root=btn.closest(".tabs");$$(".tab-btn",root).forEach(b=>b.classList.remove("active"));btn.classList.add("active");$$(".tab-panel",root).forEach(p=>p.classList.toggle("active",p.id===panelId))}
    function checkQuiz(btn){const box=btn.closest(".quiz"),moduleId=box.dataset.module,qs=$$(".q",box);let correct=0;qs.forEach(q=>{const sel=q.querySelector("input:checked"),ex=q.querySelector(".explain"),opts=$$(".q-option",q);q.classList.remove("correct","incorrect");opts.forEach(o=>o.classList.remove("correct","incorrect"));if(ex)ex.style.display="block";if(!sel){q.classList.add("incorrect");return}const ans=Number(q.dataset.answer),val=Number(sel.value),chosen=sel.closest(".q-option");if(val===ans){q.classList.add("correct");if(chosen)chosen.classList.add("correct");correct++}else{q.classList.add("incorrect");if(chosen)chosen.classList.add("incorrect");if(opts[ans])opts[ans].classList.add("correct")}});const res=box.querySelector(".result");if(res)res.textContent="Résultat : "+correct+"/"+qs.length;STATE.quizScores[moduleId]={correct,total:qs.length};saveState();updateScore()}
    function visibleModules(){return MODULES.filter(m=>STATE.path==="masterclass"||m.express!==false)}
    function renderNav(){$("#nav").innerHTML=visibleModules().map(m=>`<button data-target="${m.id}" class="${STATE.visited.has(m.id)?"completed":""}">${m.title}</button>`).join("");$$("#nav button").forEach(b=>b.addEventListener("click",()=>showSection(b.dataset.target)))}
    function renderSections(){$("#content").innerHTML=MODULES.map(m=>`<section id="${m.id}" class="section">${m.content}</section>`).join("")}
    function showSection(id){if(!MODULES.find(m=>m.id===id))return;$$(".section").forEach(s=>s.classList.toggle("active",s.id===id));$$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.target===id));STATE.visited.add(id);saveState();updateProgress();initModule(id);$("#sidebar").classList.remove("mobile-open");window.scrollTo({top:0,behavior:"smooth"})}
    function initModule(id){if(id==="diagnostic")restoreDiagnostic();if(id==="basics")initReactSim();if(id==="tasks")resetMatrix();if(id==="tools")initToolSim();if(id==="multi-design")resetPattern();if(id==="latency-cost")updateCost();if(id==="obs-security")updateSecurity();if(id==="flashcards")renderFlashcard();if(id==="final")restoreExam();if(id==="action")restoreAction()}
    function updateProgress(){const mods=visibleModules(),done=mods.filter(m=>STATE.visited.has(m.id)).length,pct=mods.length?Math.round(done/mods.length*100):0;$("#progressBar").style.width=pct+"%";$("#progressText").textContent=pct+"%"}
    function updateScore(){let c=0,t=0;Object.values(STATE.quizScores).forEach(s=>{c+=s.correct||0;t+=s.total||0});if(STATE.exam.finished){c+=STATE.exam.score;t+=STATE.exam.total}$("#scoreDisplay").textContent="Score "+c+"/"+t}
    function toggleTheme(){STATE.theme=STATE.theme==="dark"?"light":"dark";document.body.setAttribute("data-theme",STATE.theme);saveState()}
    function toggleSources(){STATE.sourcesHidden=!STATE.sourcesHidden;document.body.classList.toggle("hide-sources",STATE.sourcesHidden);saveState()}
    function toggleMobileNav(){$("#sidebar").classList.toggle("mobile-open")}
    function nextFrom(id){const mods=visibleModules(),i=mods.findIndex(m=>m.id===id);if(i>=0&&i<mods.length-1)showSection(mods[i+1].id)}
    function prevFrom(id){const mods=visibleModules(),i=mods.findIndex(m=>m.id===id);if(i>0)showSection(mods[i-1].id)}

    const DIAG_TEXT={novice:"Commencez par les fondamentaux : boucle ReAct, tâches, autonomie, decomposition, puis un no-code. Ne sautez pas les evals.",builder:"Focus sur tools, planning, multi-agents, mémoire, guardrails et trace. Construisez un système mesurable, pas une démo.",prod:"Allez vers production : observabilité, coût, latence, sécurité, code exécution sandbox, interfaces claires et evaluation continue."};
    function validateDiagnostic(){const level=document.querySelector("input[name='diag-level']:checked"),goal=document.querySelector("input[name='diag-goal']:checked"),time=document.querySelector("input[name='diag-time']:checked");if(!level||!goal||!time){alert("Répondez aux trois questions.");return}STATE.diagnostic={level:level.value,goal:goal.value,time:time.value};STATE.path=time.value==="express"?"express":"masterclass";saveState();renderNav();const rec=$("#diag-rec"),next=$("#diag-next");if(rec){rec.style.display="block";rec.innerHTML=`<h3>Parcours recommandé</h3><p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p><p>${DIAG_TEXT[level.value]||DIAG_TEXT.builder}</p>`}if(next)next.style.display="inline-flex"}
    function restoreDiagnostic(){if(!STATE.diagnostic)return;const rec=$("#diag-rec"),next=$("#diag-next");if(rec){rec.style.display="block";rec.innerHTML=`<h3>Parcours enregistré</h3><p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p><p>${DIAG_TEXT[STATE.diagnostic.level]||""}</p>`}if(next)next.style.display="inline-flex"}

    const REACT_STEPS=[{who:"Utilisateur",text:"Écris un essai sur la musculation pour débutants.",cls:"react-user"},{who:"Modèle raisonne",text:"Je commence par un plan : objectifs, échauffement, exercices, progression, sécurité.",cls:"react-model"},{who:"Action",text:"Générer outline structuré.",cls:"react-code"},{who:"Observation",text:"Outline prêt. Il manque des sources sur forme et prévention des blessures.",cls:"react-result"},{who:"Modèle raisonne",text:"Je vais chercher des sources fiables avant de rédiger.",cls:"react-model"},{who:"Action",text:"web_search : forme musculation débutant sécurité",cls:"react-code"},{who:"Observation",text:"Trois sources pertinentes récupérées.",cls:"react-result"},{who:"Action",text:"Rédiger un brouillon avec citations.",cls:"react-code"},{who:"Modèle réfléchit",text:"Le paragraphe 2 est vague. Je resserre l argument, j ajoute des transitions et je vérifie le sourcing.",cls:"react-model"},{who:"Action",text:"Réviser et finaliser.",cls:"react-code"},{who:"Résultat",text:"Essai itératif, sourcé et révisé, livré à l utilisateur.",cls:"react-done"}];
    let reactIndex=0;
    function initReactSim(){reactIndex=0;const log=$("#react-log");if(log)log.innerHTML="";const st=$("#react-status");if(st)st.textContent="Cliquez sur Étape suivante pour dérouler la boucle ReAct.";const btn=$("#react-next");if(btn){btn.disabled=false;btn.textContent="Étape suivante →"}}
    function nextReactStep(){const log=$("#react-log");if(!log||reactIndex>=REACT_STEPS.length)return;const s=REACT_STEPS[reactIndex];const div=document.createElement("div");div.className="react-msg "+s.cls;div.innerHTML=`<span class="who">${s.who}</span>${s.text}`;log.appendChild(div);requestAnimationFrame(()=>div.classList.add("visible"));reactIndex++;const st=$("#react-status");if(st)st.textContent="Étape "+reactIndex+"/"+REACT_STEPS.length+" — raisonner, agir, observer, puis continuer ou répondre.";if(reactIndex>=REACT_STEPS.length&&$("#react-next"))$("#react-next").disabled=true}

    const MATRIX_TASKS={invoice:"Tâche : extraire des champs d une facture et les sauver en base.\nComplexité : faible à moyenne.\nPrécision : élevée.\nVerdict : bon candidat agentique si le processus est clair et répétable. Commencez par un pipeline simple, validations déterministes et evals exacts.",email:"Tâche : répondre à un email client après lookup commande et fiche client.\nComplexité : moyenne.\nPrécision : moyenne à élevée.\nVerdict : agent semi-autonome avec human-in-the-loop. L agent prépare, un humain valide.",returns:"Tâche : gérer un retour produit : vérifier achat, politique, éligibilité, étapes.\nComplexité : élevée.\nPrécision : élevée.\nVerdict : agent utile mais risqué. Nécessite guardrails, validation d état, journalisation et escalade humaine.",tax:"Tâche : remplir des formulaires fiscaux.\nComplexité : élevée.\nPrécision : très élevée.\nVerdict : ne pas automatiser sans contrôles lourds. L agent peut assister, mais la responsabilité humaine reste critique.",lecture:"Tâche : écrire et vérifier des résumés de notes de cours.\nComplexité : moyenne/élevée.\nPrécision : tolérante.\nVerdict : excellent point de départ. Valeur élevée, coût d erreur faible, itération facile.",research:"Tâche : recherche juridique ou médicale avec citations.\nComplexité : élevée.\nPrécision : élevée.\nVerdict : agent pertinent mais seulement avec sourcing strict, evals, vérification des citations et garde-fous."};
    function resetMatrix(){const out=$("#matrix-out");if(out)out.textContent="Sélectionnez une tâche pour voir le diagnostic complexité / précision."}
    function chooseMatrix(key){$$("[data-matrix]").forEach(b=>b.classList.toggle("active",b.dataset.matrix===key));const out=$("#matrix-out");if(out)out.textContent=MATRIX_TASKS[key]||""}

    const TOOL_SCENARIOS={time:["Utilisateur : Quelle heure est-il ?","LLM : je ne connais pas l heure courante. Je demande get_current_time avec timezone Pacific/Auckland.","Votre code : exécute la fonction et récupère 15:20.","LLM : reçoit le résultat comme nouveau contexte et répond 15:20."],calendar:["Utilisateur : Planifie une réunion avec Alice cette semaine.","LLM : plan dynamique — check_calendar, trouver un créneau, make_appointment, confirmer.","Outils : chaque résultat est renvoyé au modèle avant l étape suivante.","LLM : choose next tool based on previous output, pas un pipeline fixe."],restaurant:["Utilisateur : Trouve des restaurants locaux bien notés.","LLM : web_search ou database_query selon les tools exposés.","Outil : renvoie une liste structurée.","LLM : synthétise, filtre, répond avec recommandation."]};
    function initToolSim(){const out=$("#tool-out");if(out)out.textContent="Sélectionnez un scénario pour voir la boucle : le LLM requeste un outil, votre code l exécute, le résultat repart dans le contexte."}
    function chooseToolScenario(key){$$("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===key));const out=$("#tool-out");if(out)out.textContent=(TOOL_SCENARIOS[key]||[]).join("\n\n")}

    const PATTERNS={sequential:"Pattern séquentiel : chercheur → designer → writer.\nAvantages : simple, prévisible, facile à debugger, timing et coût clairs.\nQuand : point de départ recommandé. Suffisant pour beaucoup de cas d usage.",parallel:"Pattern parallèle : chercheur et designer travaillent en simultané sur des parties indépendantes, writer combine.\nAvantages : réduit la latence.\nCoûts : complexité de coordination. Ajouter un manager peut aider.",manager:"Manager + spécialistes : le manager planifie, délègue, collecte, reorder, skip, redo.\nAvantages : contrôle serré avec flexibilité.\nStatut : probablement le pattern le plus courant en production aujourd hui.",hierarchy:"Hiérarchie profonde : des agents gèrent leurs propres sous-agents. Exemple : web researcher + fact checker sous researcher, style writer + citation checker sous writer.\nAvantages : tâches très complexes.\nCoûts : plus de chaos, plus de coordination.",all:"All-to-all : n importe quel agent peut message n importe quel autre à tout moment.\nAvantages : brainstorming, créativité, tâches à faible enjeu.\nCoûts : imprévisible, difficile à contrôler, rare en production."};
    function resetPattern(){const out=$("#pattern-out");if(out)out.textContent="Sélectionnez un pattern de communication multi-agents."}
    function choosePattern(key){$$("[data-pattern]").forEach(b=>b.classList.toggle("active",b.dataset.pattern===key));const out=$("#pattern-out");if(out)out.textContent=PATTERNS[key]||""}

    function updateCost(){const runs=Number($("#cost-runs")?.value||1000),steps=Number($("#cost-steps")?.value||12),tools=Number($("#cost-tools")?.value||8),tier=$("#cost-tier")?.value||"cheap",cache=Number($("#cost-cache")?.value||30),output=Number($("#cost-output")?.value||40),parallel=!!$("#cost-parallel")?.checked;$("#cv-runs").textContent=runs.toLocaleString("fr-FR");$("#cv-steps").textContent=steps;$("#cv-tools").textContent=tools;$("#cv-cache").textContent=cache+"%";$("#cv-output").textContent=output+"%";const llmCent=tier==="cheap"?0.6:2.8,toolCent=2.0,cacheFactor=1-(cache/100)*0.45,outputFactor=1-(output/100)*0.25,perRunCents=(steps*llmCent*cacheFactor+tools*toolCent)*outputFactor,monthlyUsd=perRunCents*runs*30/100,llmSec=tier==="cheap"?0.9:2.3,sec=steps*llmSec+tools*0.7*(parallel?0.6:1);const fill=$("#cost-fill");if(fill)fill.style.width=Math.min(100,monthlyUsd/50*100)+"%";const out=$("#cost-out");if(out)out.textContent="Coût estimé par run : "+perRunCents.toFixed(2)+" cents\nCoût mensuel estimé : "+monthlyUsd.toFixed(2)+" USD\nLatence séquentielle estimée : "+sec.toFixed(1)+" s par run\n\nLecture : les gros buckets viennent souvent des tool calls répétés et des LLM steps. Réduisez les appels, cachez les résultats déterministes, contraignez les outputs, utilisez un modèle cheap pour les tâches simples et réservez le frontier model au raisonnement difficile. La parallélisation réduit la latence mais pas forcément le coût total."}

    function updateSecurity(){const items=["sec-external","sec-code","sec-pii","sec-loop","sec-tools","sec-injection"];const count=items.filter(id=>document.getElementById(id)?.checked).length;const fill=$("#sec-fill");if(fill)fill.style.width=(count/items.length*100)+"%";const label=$("#sec-label"),advice=$("#sec-advice");if(label){if(count===0)label.textContent="Risque faible : agent lecture seule ou très contraint.";else if(count<=2)label.textContent="Risque modéré : journalisation, limites et validation nécessaires.";else if(count<=4)label.textContent="Risque élevé : guardrails, sandbox, approvals et observabilité indispensables.";else label.textContent="Risque critique : ne pas déployer sans contrôles robustes, moindre privilège et revue humaine."}if(advice){const m=[];if(document.getElementById("sec-external")?.checked)m.push("Contenu externe : traitez web, PDF, emails comme non fiables. Injection indirecte possible.");if(document.getElementById("sec-code")?.checked)m.push("Code exécution : sandbox Docker, timeouts, memory caps, block imports dangereux, whitelist libraries, deterministic output.");if(document.getElementById("sec-pii")?.checked)m.push("PII : scan des outputs, masquage logs, moindre privilège, validation input/output.");if(document.getElementById("sec-loop")?.checked)m.push("Boucle autonome : max steps, budget tokens, circuit breaker, rollback, escalade humaine.");if(document.getElementById("sec-tools")?.checked)m.push("Beaucoup d outils : scope par agent, least privilege, registry, docs, tests, tool masking ou retrieval d outils.");if(document.getElementById("sec-injection")?.checked)m.push("Prompt injection : séparer instructions système et données, sanitizer, ne pas laisser contenu externe modifier les règles.");advice.innerHTML=m.length?"<strong>Mitigations :</strong><ul>"+m.map(x=>"<li>"+x+"</li>").join("")+"</ul>":"Cochez les capacités à risque pour voir les mitigations."}}

    function chooseScenario(key){const texts={prototype_stuck:"Cas : votre agent fait une démo impressionnante mais échoue dès qu on change un prompt.\nDiagnostic : pas d evals, pas de trace, pas de composants mesurés.\nRemède : 20-50 tâches réelles, grader code quand vérifiable, LLM judge pour sorties floues, log trace, évaluer composants et end-to-end.",handoff_fails:"Cas : multi-agents échoue parce qu un agent renvoie un blob non structuré.\nDiagnostic : interfaces floues, vibes au lieu de schémas.\nRemède : define interfaces not vibes. Champs, types, IDs, references, validation JSON, tests de handoff.",too_slow:"Cas : l agent met 40 secondes à répondre.\nDiagnostic : étapes séquentielles inutiles, modèle surdimensionné, contexte trop long.\nRemède : baseline par étape, paralléliser fetch/search/parse, rightsize model, faster provider, trim context.",too_expensive:"Cas : la facture API explose sur les workflows agentiques.\nDiagnostic : tool calls redondants, outputs verbeux, aucun cache, frontier model partout.\nRemède : attaquer gros buckets, cache déterministe, cheap model pour tâches simples, contraindre outputs, batch processing.",hallucination:"Cas : l agent invente des faits ou cite mal.\nDiagnostic : pas de grounding, pas de guardrail, pas de vérification des sources.\nRemède : retrieval pertinent, citations obligatoires, LLM judge, validation déterministe, reflection avec feedback externe, human approval si risque.",security_code:"Cas : l agent peut exécuter du code généré.\nDiagnostic : puissance élevée, surface d attaque large.\nRemède : sandbox, resource limits, whitelist libraries, block network sauf besoin, input/output sanitation, validation + reflection, circuit breaker.",local_privacy:"Cas : vous voulez prototyper sans envoyer de données sensibles à une API cloud.\nRemède : Ollama local, modèles open weight, RAG local avec embeddings, tests gratuits et privés avant production. Utile pour apprendre les fondations sans coût API.",portfolio:"Cas : vous voulez un portfolio AI engineer crédible.\nParcours : API LLM → RAG → evals → agent → multi-agent avec trace et coûts mesurés.\nExemples publics : repos GitHub de Sean Chen — DeepResearch backend, Supabase tips, Kimi K2/Claude Code, MVP Next.js/Stripe/Supabase. Montrez un système, pas quatre notebooks déconnectés."};const out=$("#scenario-out");if(out){out.style.display="block";out.textContent=texts[key]||""}}

    const FLASHCARDS=[
      {front:"Agent IA",back:"Un système qui travaille itérativement comme un humain : plan, recherche, brouillon, réflexion, révision, plutôt qu un seul prompt linéaire.",tip:"1:16"},
      {front:"Boucle ReAct",back:"Reason, Act, Observe. Le modèle raisonne, agit souvent via un outil, observe le résultat, puis répond ou reboucle.",tip:"2:22"},
      {front:"Pourquoi itérer",back:"Chaque pass ajoute de la profondeur : meilleur raisonnement, moins d hallucinations, meilleure organisation.",tip:"2:29"},
      {front:"Tâches simples",back:"Extraire des champs de factures et sauver en base. Processus clairs et répétables.",tip:"3:08"},
      {front:"Tâches moyennes",back:"Répondre à un email client après lookup commande et fiche client, avec revue humaine.",tip:"3:14"},
      {front:"Tâches complexes",back:"Service client complet : retour produit, vérification politique, étapes multiples, décisions.",tip:"3:25"},
      {front:"Matrice complexité/précision",back:"Beaucoup de valeur vient de la haute complexité. Les gains rapides sont souvent en basse précision.",tip:"3:43"},
      {front:"Spectrum of autonomy",back:"Scripté déterministe, semi-autonome avec guardrails, hautement autonome où le LLM décide tout.",tip:"5:51"},
      {front:"Context engineering",back:"Décider quelles informations l agent voit : background, rôle, mémoire, outils. Ce n est pas seulement le prompt.",tip:"6:44"},
      {front:"Task decomposition",back:"Partir de comment vous faites la tâche, puis demander si un LLM peut faire chaque étape. Sinon, split plus petit.",tip:"7:15"},
      {front:"No-code demo",back:"CrewAI weekly learning assistant : research topic, curate resources, write plan, format output.",tip:"8:02"},
      {front:"Evals simples",back:"Mesurer si la sortie est correcte : oui/non, test passé, réservation existe en base.",tip:"9:35"},
      {front:"LLM judge",back:"Un second modèle note la sortie contre une rubrique, utile pour qualité, ton, pertinence.",tip:"9:46"},
      {front:"Trace",back:"Historique intermédiaire : requêtes, drafts, thinking steps, tool calls. Sert à diagnostiquer.",tip:"10:09"},
      {front:"Memory",back:"Mémoire court terme pour notes pendant la tâche, long terme pour leçons après réflexion.",tip:"10:37"},
      {front:"Knowledge",back:"Référentiel statique chargé upfront : PDF, CSV, docs, database. L agent peut y puiser.",tip:"11:21"},
      {front:"Guardrails",back:"Quality gate entre ce que l agent dit être fini et ce qui est réellement finalisé.",tip:"11:45"},
      {front:"Trois guardrails",back:"Code déterministe, LLM judge, human approval. Les systèmes production utilisent souvent au moins deux.",tip:"11:57"},
      {front:"Reflection",back:"Produire, critiquer, réécrire. Deuxième pass guidé par prompt de correction.",tip:"12:48"},
      {front:"Reflection + code",back:"Ajouter feedback externe : erreurs, tests, outputs, schéma JSON invalide.",tip:"13:12"},
      {front:"Tool use",back:"Donner au LLM un menu de fonctions : web search, DB, code, calendar. Le modèle décide quand et laquelle.",tip:"13:59"},
      {front:"LLM ne exécute pas",back:"Le LLM requeste un function call. Votre code exécute réellement la fonction et renvoie le résultat.",tip:"15:20"},
      {front:"Tool interface",back:"Nom, description en anglais clair, schema typed. L agent ne voit pas l implémentation.",tip:"15:57"},
      {front:"Tool implementation",back:"SQL, retries, throttling, parsing, caching, async, tests, docs, versioning, registry.",tip:"16:16"},
      {front:"Planning",back:"Au lieu de hardcoder chaque scénario, laisser le LLM décider quoi faire et dans quel ordre avec ses tools.",tip:"16:57"},
      {front:"Plan structuré",back:"Demander un plan JSON ou du code Python encodant le plan. Augmente autonomie et imprévisibilité.",tip:"18:32"},
      {front:"Multi-agent",back:"Une équipe de spécialistes plutôt qu un généraliste. Meilleure sortie via spécialisation, parallélisation, mix de modèles.",tip:"19:08"},
      {front:"Skip multi-agent",back:"Si tâche simple, multi-agent peut ralentir et compliquer debugging.",tip:"20:01"},
      {front:"Roles",back:"Chaque agent a job description claire et seulement les tools nécessaires.",tip:"20:44"},
      {front:"Sequential pattern",back:"Assembly line : chercheur → designer → writer. Simple, prévisible, bon départ.",tip:"21:25"},
      {front:"Parallel pattern",back:"Agents indépendants en même temps, puis combinaison. Réduit latence, ajoute coordination.",tip:"21:48"},
      {front:"Manager pattern",back:"Manager planifie et coordonne, spécialistes rapportent au manager. Courant en production.",tip:"22:05"},
      {front:"Hierarchy",back:"Agents gèrent sous-agents. Puissant pour tâches complexes, plus chaotique.",tip:"22:28"},
      {front:"All-to-all",back:"Tout le monde peut parler à tout le monde. Rare en production, utile brainstorming/faible enjeu.",tip:"22:47"},
      {front:"Pitfall redundant work",back:"Plusieurs agents refont mêmes searches/tools. Fix : scopes serrés, division claire.",tip:"23:15"},
      {front:"Pitfall serialization",back:"Chaîner des étapes qui pourraient être concurrentes. Fix : async, router seulement contexte nécessaire.",tip:"23:28"},
      {front:"Best practice interfaces",back:"Define interfaces, not vibes. Schémas inputs/outputs clairs.",tip:"23:51"},
      {front:"Best practice tools",back:"Scope tools per agent, least privilege, audit, debug.",tip:"24:14"},
      {front:"Best practice trace",back:"Logguer plan, prompts, tool calls, résultats pour error analysis rapide.",tip:"24:27"},
      {front:"Best practice evals",back:"Composant et end-to-end. Si composants OK mais système KO, problème handoff/integration.",tip:"24:39"},
      {front:"Demo Python",back:"Upload PDF notes, Chroma semantic search, agents idea/script/brand check, human loop, agent 4 met à jour living brand guidelines.",tip:"25:08"},
      {front:"Functional decomposition",back:"Split par domaine technique : frontend, backend, database, API.",tip:"26:39"},
      {front:"Spatial decomposition",back:"Split par fichiers/dossiers, utile pour gros codebases, mais dépendances complexes cassent le parallélisme.",tip:"27:04"},
      {front:"Sequential decomposition",back:"Phases dépendantes : research → planning → assets → launch/monitor.",tip:"27:37"},
      {front:"Data-driven decomposition",back:"Partition de données : logs par semaine/service, traitement indépendant puis agrégation.",tip:"28:19"},
      {front:"Non-LLM improvement",back:"Tuner knobs : top K, chunk size, thresholds, providers. Swapper OCR/search/vision.",tip:"29:13"},
      {front:"LLM improvement",back:"Better prompts, constraints, schemas, few-shot, autre modèle, décomposer, fine-tune last resort.",tip:"29:55"},
      {front:"Latency baseline",back:"Timer chaque étape avant optimiser.",tip:"30:26"},
      {front:"Latency tactics",back:"Paralléliser, rightsize model, faster provider, trim context.",tip:"30:43"},
      {front:"Cost sources",back:"LLM input/output tokens, API calls tools, infrastructure compute/vector DB.",tip:"31:25"},
      {front:"Cost tactics",back:"Attaquer gros buckets, tier models, cache, contraindre outputs, batch.",tip:"31:56"},
      {front:"Observability zoom in",back:"Trace complète d un run : prompts, tool calls, tokens, retries, décisions.",tip:"33:32"},
      {front:"Observability zoom out",back:"Qualité globale, hallucination rates, success, ROI, tendances.",tip:"33:45"},
      {front:"Log why",back:"Pas seulement ce que l agent a fait, mais pourquoi : choix tool, issues trouvés.",tip:"34:02"},
      {front:"Quality sampling",back:"Échantillonner un % de runs pour score qualité/hallucination à grande échelle.",tip:"34:20"},
      {front:"User behavior",back:"Rephrasing, retries, revisions, session length donnent roadmap produit.",tip:"34:36"},
      {front:"Security agents",back:"Protéger contre attaques externes et contre le système lui-même prenant de mauvaises décisions.",tip:"35:11"},
      {front:"Prompt injection",back:"Contenu malveillant dans input ou données externes qui hijack les instructions.",tip:"35:26"},
      {front:"Code execution safe",back:"Sandbox, limits, whitelist, validation/reflection, deterministic IO, sanitation.",tip:"36:08"},
      {front:"Bonus blog",back:"Pour comprendre Claude Code/Cursor : terminal UI, LLM intelligence layer, tool layer, reactive command loop, async generators, parallel execution.",tip:"37:17"},
      {front:"Ollama local",back:"Prototyper gratuitement et privéablement : modèles locaux, RAG, embeddings, agents, sans envoyer données à API cloud.",tip:"KB"},
      {front:"Kimi K2",back:"Agentic LLM entraîné pour planifier, appeler tools, lire fichiers, chercher web, itérer sur hundreds steps, ultra-long context, open weight.",tip:"4:34"}
    ];
    function renderFlashcard(){const card=$("#flashcard");if(!card)return;const i=STATE.flash.index,c=FLASHCARDS[i];card.classList.remove("flipped");card.innerHTML=`<div class="flash-inner" onclick="flipFlash()"><div class="flash-face flash-front"><h3>${c.front}</h3><p class="muted">Cliquez pour retourner.</p><div><span class="pill">Carte ${i+1}/${FLASHCARDS.length}</span><span class="pill">⏱ ${c.tip}</span></div></div><div class="flash-face flash-back"><p><strong>${c.back}</strong></p><p class="muted">${STATE.flash.known.has(i)?"Déjà marquée connue.":"Marquez connue si maîtrisée."}</p></div></div>`;const kb=$("#flash-known");if(kb)kb.textContent=STATE.flash.known.has(i)?"✅ Connue":"Marquer connue"}
    function flipFlash(){$("#flashcard")?.classList.toggle("flipped")}
    function nextFlash(){STATE.flash.index=(STATE.flash.index+1)%FLASHCARDS.length;saveState();renderFlashcard()}
    function prevFlash(){STATE.flash.index=(STATE.flash.index-1+FLASHCARDS.length)%FLASHCARDS.length;saveState();renderFlashcard()}
    function markFlash(){const i=STATE.flash.index;if(STATE.flash.known.has(i))STATE.flash.known.delete(i);else STATE.flash.known.add(i);saveState();renderFlashcard()}

      {q:"Selon la matrice complexité/précision, par où commencer souvent ?",o:["Haute complexité, plus basse précision","Basse complexité, haute précision","Faible complexité, faible précision"],a:0,e:"On obtient du levier sans être bloqué par la nécessité d une sortie parfaite."},
      {q:"Qu est-ce qu un agent semi-autonome ?",o:["Il choisit parmi des tools définis et décide dans des guardrails","Il est entièrement scripté","Il écrit son propre code sans limites"],a:0,e:"La plupart des agents réels sont quelque part au milieu."},

    function finalQuizHTML(){return `<div class="quiz" data-module="final" id="final-quiz"><h3>Examen final chronométré</h3>${FINAL_QUESTIONS.map((it,i)=>`<div class="q" data-answer="${it.a}"><p class="q-text">${i+1}. ${it.q}</p>${it.o.map((opt,j)=>`<label class="q-option"><input type="radio" name="final-q${i}" value="${j}">${opt}</label>`).join("")}<div class="explain">${it.e}</div></div>`).join("")}</div>`}
    function startExam(){if(STATE.exam.finished)return;STATE.exam.remaining=480;updateExamTimer();clearInterval(STATE.exam.interval);STATE.exam.interval=setInterval(()=>{STATE.exam.remaining--;updateExamTimer();if(STATE.exam.remaining<=0)submitExam()},1000);const b=$("#exam-start");if(b)b.style.display="none"}
    function updateExamTimer(){const el=$("#exam-timer");if(!el)return;const m=Math.floor(Math.max(0,STATE.exam.remaining)/60),s=String(Math.max(0,STATE.exam.remaining)%60).padStart(2,"0");el.textContent="⏱ "+m+":"+s}
    function submitExam(){clearInterval(STATE.exam.interval);const box=$("#final-quiz");if(!box)return;const qs=$$(".q",box);let correct=0;qs.forEach(q=>{const sel=q.querySelector("input:checked"),ex=q.querySelector(".explain"),opts=$$(".q-option",q);q.classList.remove("correct","incorrect");opts.forEach(o=>o.classList.remove("correct","incorrect"));if(ex)ex.style.display="block";if(!sel){q.classList.add("incorrect");return}const ans=Number(q.dataset.answer),val=Number(sel.value),chosen=sel.closest(".q-option");if(val===ans){q.classList.add("correct");if(chosen)chosen.classList.add("correct");correct++}else{q.classList.add("incorrect");if(chosen)chosen.classList.add("incorrect");if(opts[ans])opts[ans].classList.add("correct")}});STATE.exam.finished=true;STATE.exam.score=correct;STATE.exam.total=qs.length;STATE.exam.passed=correct>=7;saveState();updateScore();const res=$("#exam-result");if(res){let adv=STATE.exam.passed?"Vous comprenez les agents comme systèmes itératifs, outillés, évalués, sécurisés et orchestrables. Vous pouvez passer de démo à production.":"Bases à consolider. Revoyez ReAct, evals, tools, multi-agent design, observabilité et sécurité.";}
      if(res)res.innerHTML=`<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed?"✅ Réussite":"⚠️ À consolider"}<br><span class="muted">${STATE.exam.passed?"Vous comprenez les agents comme systèmes itératifs, outillés, évalués, sécurisés et orchestrables.":"Revoyez ReAct, evals, tools, multi-agent design, observabilité et sécurité."}</span>`;const cb=$("#go-cert");if(cb)cb.style.display="inline-flex"}
    function restoreExam(){updateExamTimer();if(STATE.exam.finished){const b=$("#exam-start");if(b)b.style.display="none";const r=$("#exam-result");if(r&&!r.innerHTML)r.innerHTML=`Examen terminé : ${STATE.exam.score}/${STATE.exam.total}. ${STATE.exam.passed?"Certificat disponible.":"Revoyez les modules puis réessayez."}`;const cb=$("#go-cert");if(cb)cb.style.display="inline-flex"}}
    function generateCert(){if(!STATE.exam.finished){alert("Terminez d abord l examen final.");return}const name=($("#cert-name")?.value||"Apprenant").trim();STATE.certName=name;saveState();const block=$("#certificate");if(!block)return;block.classList.add("show");$("#cert-name-out").textContent=name;$("#cert-date").textContent=new Date().toLocaleDateString("fr-FR");$("#cert-score").textContent=STATE.exam.score+"/"+STATE.exam.total;$("#cert-level").textContent=STATE.exam.passed?"Maîtrise validée":"Fin de parcours";block.scrollIntoView({behavior:"smooth",block:"center"})}
    function restoreAction(){const ni=$("#cert-name");if(ni&&STATE.certName)ni.value=STATE.certName;Object.entries(STATE.checklist).forEach(([id,checked])=>{const el=document.getElementById(id);if(el)el.checked=checked});updateChecklistProgress();if(STATE.exam.finished)generateCert()}

    const MODULES=[
      {id:"home",title:"🏠 Accueil",express:true,content:`

      {id:"diagnostic",title:"🎯 Diagnostic",express:true,content:`
        <h1>Diagnostic initial</h1><p class="lead">Trois questions pour adapter le parcours.</p><div class="quiz"><div class="q"><p class="q-text">1. Votre niveau ?</p><label class="q-option"><input type="radio" name="diag-level" value="novice"> Novice : je découvre les agents.</label><label class="q-option"><input type="radio" name="diag-level" value="builder"> Builder : je veux construire un agent utile.</label><label class="q-option"><input type="radio" name="diag-level" value="prod"> Prod : je veux fiabilité, coût, sécurité, scale.</label></div><div class="q"><p class="q-text">2. Objectif ?</p><label class="q-option"><input type="radio" name="diag-goal" value="automate"> Automatiser mon workflow.</label><label class="q-option"><input type="radio" name="diag-goal" value="product"> Construire un produit agentique.</label><label class="q-option"><input type="radio" name="diag-goal" value="research"> Comprendre les systèmes sous le capot.</label></div><div class="q"><p class="q-text">3. Temps ?</p><label class="q-option"><input type="radio" name="diag-time" value="express"> Express 15-20 min.</label><label class="q-option"><input type="radio" name="diag-time" value="masterclass"> Masterclass 45-60 min.</label></div><button class="btn" onclick="validateDiagnostic()">Valider</button><div class="result" id="diag-rec" style="display:none"></div><div class="toolbar"><button class="btn secondary" id="diag-next" style="display:none" onclick="nextFrom('diagnostic')">Continuer →</button></div></div>`},
      {id:"basics",title:"1. Qu est-ce qu un agent ?",express:true,content:`
        <h1>Basics : l agent travaille itérativement</h1><p class="lead">Imaginez écrire un essai. Un prompt traditionnel demande tout en one-shot. Un agent, lui, planifie, outline, recherche, rédige un brouillon, relit, révise. C est un processus. <span class="source">⏱ 1:16</span></p><div class="grid"><div class="card info"><h3>Essay example</h3><ul><li>Outline avant rédaction.</li><li>Identifier l information nécessaire.</li><li>Chercher web/API/sources.</li><li>Rédiger brouillon.</li><li>Réfléchir et réviser.</li></ul></div><div class="card good"><h3>Pourquoi ça marche</h3><p>Chaque pass ajoute de la profondeur : meilleur raisonnement, moins d hallucinations, meilleure organisation. <span class="source">⏱ 2:29</span></p></div><div class="card warn"><h3>Domaines</h3><p>Recherche juridique, documentation santé, support client nécessitant lookup account avant réponse. <span class="source">⏱ 2:40</span></p></div></div><h2>Simulateur ReAct</h2><div class="simulator"><p class="muted small" id="react-status"></p><div id="react-log"></div><div class="toolbar no-print"><button class="btn" id="react-next" onclick="nextReactStep()">Étape suivante →</button><button class="btn secondary" onclick="initReactSim()">Réinitialiser</button></div></div>${quizHTML([{q:"La boucle ReAct combine...",o:["Reason, Act, Observe","Train, Tune, Deploy","Read, Write, Delete"],a:0,e:"Le modèle raisonne, agit via tool, observe, puis continue ou répond."},{q:"Pourquoi l itération aide ?",o:["Elle ajoute profondeur, réduit hallucinations et améliore organisation","Elle rend le modèle plus petit","Elle supprime les tools"],a:0,e:"One-shot perd souvent ces bénéfices."}], "basics")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('basics')">← Précédent</button><button class="btn" onclick="nextFrom('basics')">Tâches →</button></div>`},
      {id:"tasks",title:"2. Tâches & Kimi",express:true,content:`
        <h1>Quelles tâches justifient un agent ?</h1><p class="lead">Certaines tâches ont du sens pour agents, d autres non. Le transcript va du simple au complexe : extraction facture, email client, retour produit. <span class="source">⏱ 3:03</span></p><div class="simulator"><div class="matcher-grid"><button class="matcher-btn" data-matrix="invoice" onclick="chooseMatrix('invoice')">Facture</button><button class="matcher-btn" data-matrix="email" onclick="chooseMatrix('email')">Email client</button><button class="matcher-btn" data-matrix="returns" onclick="chooseMatrix('returns')">Retour produit</button><button class="matcher-btn" data-matrix="tax" onclick="chooseMatrix('tax')">Formulaire fiscal</button><button class="matcher-btn" data-matrix="lecture" onclick="chooseMatrix('lecture')">Résumé notes</button><button class="matcher-btn" data-matrix="research" onclick="chooseMatrix('research')">Recherche sourcée</button></div><pre id="matrix-out" class="prompt"></pre></div><div class="card purple"><h3>Sponsor / agentic LLM : Kimi K2</h3><p>Le transcript présente Kimi K2 et K2 Thinking comme agentic LLM entraînés non seulement à répondre une fois, mais à planifier, appeler tools, lire fichiers, chercher web et itérer sur hundreds of steps. L app consumer est conçue autour d ultra-long context, de l ordre de millions de caractères, utile pour uploader 20-50 PDFs et faire cross-reference/synthèse en un run. Pour développeurs, K2 est présenté comme beaucoup moins cher que GPT5, environ 5-8x discount, et open weight. <span class="source">⏱ 4:29</span></p></div>${quizHTML([{q:"Par où commencer souvent ?",o:["Haute complexité, plus basse précision","Basse complexité, haute précision","Aucune complexité"],a:0,e:"Les early wins sont souvent dans le quadrant haute complexité / basse précision."},{q:"Pourquoi Kimi K2 est cité ?",o:["Comme modèle agentic pour planifier, tools, lecture, recherche et itération longue","Comme outil de design graphique","Comme base de données"],a:0,e:"Le segment sponsor met en avant les workflows agentiques et le long contexte."}], "tasks")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('tasks')">← Précédent</button><button class="btn" onclick="nextFrom('tasks')">Fondations design →</button></div>`},
      {id:"design",title:"3. Autonomie, contexte, decomposition",express:true,content:`
        <h1>Fondations de conception</h1><div class="tabs"><div class="tab-list"><button class="tab-btn active" onclick="switchTab(this,'tab-autonomy')">Autonomie</button><button class="tab-btn" onclick="switchTab(this,'tab-context')">Context</button><button class="tab-btn" onclick="switchTab(this,'tab-decomp')">Decomposition</button></div><div id="tab-autonomy" class="tab-panel active"><div class="grid"><div class="card info"><h3>Scripted</h3><p>Chaque étape est hardcodée. Déterministe, prévisible, facile à contrôler. Le modèle génère seulement le texte. <span class="source">⏱ 5:56</span></p></div><div class="card warn"><h3>Semi-autonome</h3><p>La plupart des agents réels : l agent choisit parmi tools définis et décide dans guardrails. <span class="source">⏱ 6:31</span></p></div><div class="card bad"><h3>Highly autonomous</h3><p>Le LLM décide search, read, fetch, convert, reflect, revise, voire écrire et run fonctions. Puissant mais imprévisible. <span class="source">⏱ 6:16</span></p></div></div></div><div id="tab-context" class="tab-panel"><div class="card purple"><h3>Context engineering</h3><p>Décider quelles informations l agent a : background de tâche, rôle, mémoire d actions passées, tools disponibles. Ce contexte steer des modèles non-déterministes vers outputs cohérents et de qualité. <span class="source">⏱ 6:44</span></p></div><div class="card good"><h3>Pas seulement le modèle</h3><p>« It is not the model alone. It is how you engineer the context around it. » <span class="source">⏱ 7:03</span></p></div></div><div id="tab-decomp" class="tab-panel"><div class="card info"><h3>Méthode</h3><p>Commencer par comment vous faites la tâche. Pour chaque step, demander : un LLM peut-il faire ça ? Sinon, split plus petit jusqu à ce que oui. <span class="source">⏱ 7:15</span></p></div><div class="code">Outline via LLM
    Generate search terms via LLM
    Call search API
    Fetch pages via tool
    Write draft with sources via LLM
    Self-critique via LLM
    Revise via LLM</div><p class="muted small">Chaque step est small, checkable, clear. Quand output n est pas assez bon, vous savez exactement quel step améliorer. <span class="source">⏱ 7:56</span></p></div></div>${quizHTML([{q:"Un agent semi-autonome...",o:["choisit parmi tools définis dans des guardrails","n a aucun outil","est toujours scripté"],a:0,e:"C est le compromis pratique."},{q:"Task decomposition commence par...",o:["comment vous faites la tâche réellement","demander au modèle de deviner","hardcoder tous les cas"],a:0,e:"Puis split jusqu à étapes checkables."}], "design")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('design')">← Précédent</button><button class="btn" onclick="nextFrom('design')">No-code demo →</button></div>`},
      {id:"nocode",title:"4. Démo no-code",express:true,content:`
        <h1>Démo : weekly learning assistant</h1><p class="lead">Le transcript construit un agent no-code avec CrewAI : donner un topic, rechercher, trouver meilleures ressources, créer study plan personnalisé. <span class="source">⏱ 8:02</span></p><div class="grid"><div class="card info"><h3>Agents créés</h3><ul><li>Topic research specialist</li><li>Educational resource curator</li><li>Personalized study plan designer</li><li>Study plan formatter ajouté ensuite</li></ul></div><div class="card good"><h3>Éditable</h3><p>Prompts, output format, hyperparameters, reasoning mode, LLM exact.</p></div><div class="card warn"><h3>Flow observable</h3><p>LLM calls, web search tools, lecture de contenu website, markdown final. On peut itérer vers UI ou autre output.</p></div></div><div class="card purple"><h3>Leçon</h3><p>Les principes s appliquent à la plupart des tools : décrire l objectif, laisser le système proposer des agents, éditer prompts/tasks, observer trace, itérer.</p></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('nocode')">← Précédent</button><button class="btn" onclick="nextFrom('nocode')">Evals →</button></div>`},
      {id:"evals",title:"5. Mesurer performance",express:true,content:`
        <h1>Evals : ce qui sépare hobbyists et professionnels</h1><p class="lead">Parfois une eval est simple : la sortie est-elle correcte ? Oui ou non. Mais pour un essai, il faut une mesure plus nuancée. <span class="source">⏱ 9:35</span></p><div class="grid"><div class="card good"><h3>LLM judge</h3><p>Un second LLM note chaque essai sur une échelle 1-5 avec grading rubric consistante. <span class="source">⏱ 9:46</span></p></div><div class="card info"><h3>Composant + end-to-end</h3><p>Évaluer chaque step individuel et la qualité finale du système entier. <span class="source">⏱ 9:58</span></p></div><div class="card warn"><h3>Trace</h3><p>Examiner requêtes de search, drafts, thinking steps. Patterns : queries trop génériques, revision non passée correctement au critique. <span class="source">⏱ 10:09</span></p></div></div><div class="card purple"><h3>Conseil</h3><p>Commencez à évaluer tout de suite, mais ne cherchez pas un système parfait dès le départ. Faites quelque chose qui marche, itérez. <span class="source">⏱ 10:26</span></p></div>${quizHTML([{q:"Pourquoi évaluer les composants ?",o:["Pour savoir quel step casse, pas seulement si le résultat final est mauvais","Pour supprimer les tools","Pour réduire le contexte"],a:0,e:"Component + end-to-end distingue agent failure et handoff failure."},{q:"Qu est-ce qu une trace ?",o:["Les étapes intermédiaires : queries, drafts, thinking, tool calls","Le prompt final uniquement","La base vectorielle"],a:0,e:"La trace alimente les prochaines evals et fixes."}], "evals")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('evals')">← Précédent</button><button class="btn" onclick="nextFrom('evals')">Memory →</button></div>`},
      {id:"memory",title:"6. Memory & knowledge",express:true,content:`
        <h1>Mémoire dynamique, knowledge statique</h1><p class="lead">Memory permet à l agent de se souvenir de ce qui a marché, échoué, et ce qu il doit faire différemment, pour s améliorer à chaque run. <span class="source">⏱ 10:37</span></p><div class="grid"><div class="card info"><h3>Short-term memory</h3><p>Notes écrites pendant le travail. Dans multi-agent, d autres agents peuvent lire ces notes.</p></div><div class="card good"><h3>Long-term memory</h3><p>Après tâche, réfléchir, comparer résultat attendu, stocker leçons. Next run charge les leçons.</p></div><div class="card warn"><h3>Feedback training</h3><p>Donner feedback sur le travail pour que chaque run améliore la qualité, similaire à supervised learning.</p></div><div class="card purple"><h3>Knowledge</h3><p>Statique : PDFs, CSVs, docs, database. Chargé upfront, l agent y puise pour citer précisément. <span class="source">⏱ 11:21</span></p></div></div>${quizHTML([{q:"Memory est...",o:["dynamique et mise à jour à chaque run","toujours un PDF statique","identique à knowledge"],a:0,e:"Memory retient leçons ; knowledge est référentiel."}], "memory")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('memory')">← Précédent</button><button class="btn" onclick="nextFrom('memory')">Guardrails →</button></div>`},
      {id:"guardrails",title:"7. Guardrails",express:true,content:`
        <h1>Guardrails : quality gate</h1><p class="lead">Parce que les LLM sont non-déterministes, ils peuvent se tromper : factuellement faux, mauvais format. Guardrails empêchent les issues. <span class="source">⏱ 11:39</span></p><div class="grid"><div class="card good"><h3>1. Code déterministe</h3><p>Pour format et longueur. Rapide, cheap, à préférer quand possible. <span class="source">⏱ 12:02</span></p></div><div class="card warn"><h3>2. LLM judge</h3><p>Pour nuances : cohérence factuelle avec sources, ton professionnel. Si fail, feedback envoyé à l agent qui révise. <span class="source">⏱ 12:08</span></p></div><div class="card bad"><h3>3. Human approval</h3><p>Stop avant ship. Humain donne feedback, agent retry. <span class="source">⏱ 12:25</span></p></div></div><div class="card purple"><h3>Production</h3><p>La plupart des systèmes production utilisent au moins deux approches. <span class="source">⏱ 11:57</span></p></div>${quizHTML([{q:"Un guardrail code est idéal pour...",o:["format et longueur déterministes","juger le ton émotionnel","remplacer l utilisateur"],a:0,e:"Fast and cheap, preferred when possible."},{q:"Si LLM judge dit fail...",o:["le feedback est renvoyé à l agent pour réviser","on ignore","on supprime le tool"],a:0,e:"Judge + retry loop."}], "guardrails")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('guardrails')">← Précédent</button><button class="btn" onclick="nextFrom('guardrails')">Reflection →</button></div>`},
      {id:"reflection",title:"8. Reflection",express:true,content:`
        <h1>Reflection : ne pas s arrêter au premier draft</h1><p class="lead">Le modèle produit, critique, puis réécrit si nécessaire. Ce second pass, guidé par un prompt de correction, améliore presque toujours. <span class="source">⏱ 12:48</span></p><div class="grid"><div class="card good"><h3>Email example</h3><p>Même contenu, mais plus clean, plus spécifique, plus professionnel. <span class="source">⏱ 13:06</span></p></div><div class="card info"><h3>Code + external feedback</h3><p>Écrire code, critic agent review, run, capturer erreurs/tests/outputs, feed back pour V2 bien meilleur. <span class="source">⏱ 13:12</span></p></div><div class="card warn"><h3>Quand ça marche</h3><p>Structured outputs JSON, procédures, creative work, long-form writing, quand external feedback disponible. <span class="source">⏱ 13:29</span></p></div><div class="card bad"><h3>Drawback</h3><p>Ajoute latence et coût. Testez avec et sans pour vérifier que ça aide réellement. <span class="source">⏱ 13:46</span></p></div></div>${quizHTML([{q:"Reflection signifie...",o:["produire, critiquer, réécrire","supprimer le brouillon","utiliser un seul prompt"],a:0,e:"Second pass guided by critique prompt."}], "reflection")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('reflection')">← Précédent</button><button class="btn" onclick="nextFrom('reflection')">Tools →</button></div>`},
      {id:"tools",title:"9. Tool use",express:true,content:`
        <h1>Tool use : donner au modèle un menu de fonctions</h1><p class="lead">Un LLM seul est juste un text generator. Il ne connaît pas l heure, vos ventes, ne peut pas exécuter code ou calculer exact. Avec tools, il peut web search, query DB, write CRM, run code. <span class="source">⏱ 13:59</span></p><div class="simulator"><div class="matcher-grid"><button class="matcher-btn" data-tool="time" onclick="chooseToolScenario('time')">Heure</button><button class="matcher-btn" data-tool="calendar" onclick="chooseToolScenario('calendar')">Calendrier</button><button class="matcher-btn" data-tool="restaurant" onclick="chooseToolScenario('restaurant')">Restaurant</button></div><pre id="tool-out" class="prompt"></pre></div><div class="card bad"><h3>Point crucial</h3><p>Les LLM ne exécutent pas de code. Ils requestent un function call. Votre code voit la request, exécute la fonction, récupère results, les feed back au LLM comme nouveau contexte. <span class="source">⏱ 15:20</span></p></div><div class="grid"><div class="card info"><h3>Interface</h3><p>Tool name, description plain English quand utiliser, typed input schema. L agent ne voit que ça. <span class="source">⏱ 15:57</span></p></div><div class="card good"><h3>Implementation</h3><p>SQL, retries, throttling, parsing, error handling, self-recovery, rate limiting, caching, async. <span class="source">⏱ 16:16</span></p></div><div class="card warn"><h3>Tools as products</h3><p>Versioning, docs, tests, internal registry with ownership. <span class="source">⏱ 16:38</span></p></div></div>${quizHTML([{q:"Qui exécute réellement la fonction ?",o:["Votre code, pas le LLM","Le LLM directement","Le vector database"],a:0,e:"LLM requeste, code exécute, résultat repart en contexte."},{q:"Une bonne tool definition inclut...",o:["nom, description, typed input schema","seulement du code SQL","aucune documentation"],a:0,e:"L agent voit l interface, pas l implémentation."}], "tools")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('tools')">← Précédent</button><button class="btn" onclick="nextFrom('tools')">Planning →</button></div>`},
      {id:"planning",title:"10. Planning",express:true,content:`
        <h1>Planning : laisser le LLM décider l ordre</h1><p class="lead">Au lieu de hardcoder chaque scénario, donnez un toolkit et laissez l agent figure out which tools to use and when. <span class="source">⏱ 16:57</span></p><div class="grid"><div class="card info"><h3>Retail example</h3><p>Round sunglasses under $100 : get item descriptions, check inventory, get item price, filter, compose answer. <span class="source">⏱ 17:52</span></p></div><div class="card warn"><h3>Return example</h3><p>Gold frame return, not metal : identify purchase, match product, process return, confirm. Plan changes completely. <span class="source">⏱ 18:16</span></p></div><div class="card bad"><h3>Trade-off</h3><p>Planning increases autonomy, donc unpredictability. Guardrails sur permissions, validation tool calls, passing outputs entre steps. <span class="source">⏱ 18:38</span></p></div></div><div class="card purple"><h3>Output structuré</h3><p>Demander un plan JSON ou laisser écrire du code Python encodant le plan. Aujourd hui, use case le plus fort : coding agentiques. <span class="source">⏱ 18:32</span></p></div>${quizHTML([{q:"Planning remplace...",o:["un pipeline fixe hardcodé par une décision dynamique d étapes","les tools","les evals"],a:0,e:"Le LLM choisit le plan depuis les tools disponibles."}], "planning")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('planning')">← Précédent</button><button class="btn" onclick="nextFrom('planning')">Multi-agent →</button></div>`},
      {id:"multi",title:"11. Multi-agent basics",express:true,content:`
        <h1>Multi-agent collaboration</h1><p class="lead">Pour un projet complexe, vous n embauchez pas un super généraliste. Vous build a team. Multi-agent systems borrow that mindset. <span class="source">⏱ 19:08</span></p><div class="grid"><div class="card good"><h3>Avantages</h3><ul><li>Spécialisation à chaque step.</li><li>Évite un énorme context window pour un seul agent.</li><li>Mix cheaper/faster models et larger models.</li><li>Parallelize work.</li><li>Visibility sur qui fait quoi.</li></ul></div><div class="card bad"><h3>Coûts</h3><ul><li>Resource conflicts.</li><li>Communication overhead.</li><li>Task dependencies.</li><li>API rate limits.</li><li>Failure rollback.</li><li>Combining outputs cohérents.</li></ul></div><div class="card warn"><h3>Quand skip</h3><p>Si tâche simple, multi-agent peut ralentir et rendre debugging plus difficile. <span class="source">⏱ 20:01</span></p></div></div>${quizHTML([{q:"Multi-agent n est pas toujours utile car...",o:["il ajoute coordination, dépendances, overhead et debugging complexity","il supprime les tools","il rend les modèles gratuits"],a:0,e:"Commencez simple, ajoutez complexité seulement si nécessaire."}], "multi")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('multi')">← Précédent</button><button class="btn" onclick="nextFrom('multi')">Design multi-agent →</button></div>`},
      {id:"multi-design",title:"12. Design multi-agent",express:true,content:`
        <h1>Design : rôles, patterns, pitfalls, best practices</h1><p class="lead">Exemple marketing brochure : researcher, graphic designer, writer. Chaque agent a clear job description et seulement les tools nécessaires. <span class="source">⏱ 20:38</span></p><div class="simulator"><div class="matcher-grid"><button class="matcher-btn" data-pattern="sequential" onclick="choosePattern('sequential')">Sequential</button><button class="matcher-btn" data-pattern="parallel" onclick="choosePattern('parallel')">Parallel</button><button class="matcher-btn" data-pattern="manager" onclick="choosePattern('manager')">Manager</button><button class="matcher-btn" data-pattern="hierarchy" onclick="choosePattern('hierarchy')">Hierarchy</button><button class="matcher-btn" data-pattern="all" onclick="choosePattern('all')">All-to-all</button></div><pre id="pattern-out" class="prompt"></pre></div><div class="grid"><div class="card bad"><h3>Pitfall 1 : redundant work</h3><p>Plusieurs agents redo same searches/tools. Fix : tighter task scopes, clear division of labor. <span class="source">⏱ 23:15</span></p></div><div class="card bad"><h3>Pitfall 2 : unnecessary serialization</h3><p>Chaîner steps qui pourraient run concurrently. Fix : async, router seulement contexte nécessaire. <span class="source">⏱ 23:28</span></p></div></div><div class="grid"><div class="card good"><h3>Interfaces, not vibes</h3><p>Clear schema inputs/outputs : fields, types, IDs, references. Handoffs break more often than models. <span class="source">⏱ 23:51</span></p></div><div class="card good"><h3>Scope tools per agent</h3><p>Least privilege, security, easier reasoning, audit, debug. <span class="source">⏱ 24:14</span></p></div><div class="card good"><h3>Log the trace</h3><p>Per-step artifacts : plan, prompts, tool calls, results. <span class="source">⏱ 24:27</span></p></div><div class="card good"><h3>Evaluate components + end-to-end</h3><p>Composant OK mais système KO = handoff/integration issue. <span class="source">⏱ 24:39</span></p></div></div>${quizHTML([{q:"Le pattern le plus courant en production aujourd hui est probablement...",o:["manager + spécialistes","all-to-all","sequential seulement"],a:0,e:"Manager garde contrôle tout en donnant flexibilité."},{q:"Define interfaces, not vibes signifie...",o:["schémas clairs pour handoffs","prompts vagues","plus d agents"],a:0,e:"Les handoffs cassent souvent."}], "multi-design")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('multi-design')">← Précédent</button><button class="btn" onclick="nextFrom('multi-design')">Démo Python →</button></div>`},
      {id:"demo",title:"13. Démo Python",express:false,content:`
        <h1>Démo : système multi-agent personnel</h1><p class="lead">Le transcript montre un système pour écrire scripts YouTube shorts / Instagram reels à partir de notes PDF. <span class="source">⏱ 25:08</span></p><div class="grid"><div class="card info"><h3>Pipeline</h3><ul><li>Upload PDFs de notes, idées, brand docs.</li><li>Semantic search avec Chroma DB.</li><li>Agent 1 : cherche notes et génère video ideas.</li><li>Agent 2 : écrit script 30-60s avec hook, value, CTA.</li><li>Agent 3 : check contre brand voice via living brand guidelines.</li></ul></div><div class="card good"><h3>Human in the loop</h3><p>Edit, approve, reject chaque script via Streamlit interface.</p></div><div class="card purple"><h3>Agent 4</h3><p>Analyse le feedback humain et met automatiquement à jour les living brand guidelines. Le système évolue pour apprendre la voix. <span class="source">⏱ 25:54</span></p></div></div><div class="card warn"><h3>Statut</h3><p>Codé avec AI coding assistant en un après-midi, pas production-ready, mais déjà gagnant plusieurs heures par semaine. <span class="source">⏱ 26:04</span></p></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('demo')">← Précédent</button><button class="btn" onclick="nextFrom('demo')">Advanced decomposition →</button></div>`},
      {id:"advanced-decomp",title:"14. Decomposition avancée",express:true,content:`
        <h1>Quatre patterns de decomposition</h1><div class="grid"><div class="card info"><h3>Functional</h3><p>Split par domaine technique : frontend, backend, database, API. <span class="source">⏱ 26:39</span></p></div><div class="card info"><h3>Spatial</h3><p>Split par file/directory/structure. Puissant pour gros codebases, mais dépendances complexes cassent le parallélisme. <span class="source">⏱ 27:04</span></p></div><div class="card info"><h3>Sequential stages</h3><p>Phases dépendantes : market research → launch planning → assets → launch/monitor. <span class="source">⏱ 27:37</span></p></div><div class="card info"><h3>Data-driven</h3><p>Partition data : logs par semaine/service, analyse indépendante, agrégation finale. <span class="source">⏱ 28:19</span></p></div></div><div class="card purple"><h3>Mixer</h3><p>Un full-stack feature peut utiliser functional decomposition principale, puis temporal/spatial interne pour backend. <span class="source">⏱ 28:51</span></p></div>${quizHTML([{q:"Spatial decomposition est particulièrement utile pour...",o:["gros codebases avec fichiers traitables indépendamment","petites tâches séquentielles","remplacer les evals"],a:0,e:"Mais dépendances complexes réduisent l intérêt."}], "advanced-decomp")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('advanced-decomp')">← Précédent</button><button class="btn" onclick="nextFrom('advanced-decomp')">Performance →</button></div>`},
      {id:"performance",title:"15. Améliorer performance",express:true,content:`
        <h1>Composants non-LLM vs LLM</h1><p class="lead">Les techniques qui vous ont amené de zero à prototype ne vous amèneront pas de prototype à production. <span class="source">⏱ 26:16</span></p><div class="grid"><div class="card info"><h3>Non-LLM</h3><p>Web search, RAG retrieval, code execution, speech recognition, vision models, PDF parsers. Améliorer en tunant knobs : date ranges, top K, chunk size, similarity thresholds. Ou swapper providers. <span class="source">⏱ 29:13</span></p></div><div class="card good"><h3>LLM</h3><p>Better prompts, explicit instructions, constraints, schemas, few-shot input/output pairs. Essayer autre modèle. Décomposer tâches dures. Fine-tune last resort. <span class="source">⏱ 29:55</span></p></div></div><div class="card warn"><h3>Fine-tuning</h3><p>Puissant mais costly. Réservez-le aux systèmes matures où vous avez besoin des derniers points de qualité et avez épuisé le reste. <span class="source">⏱ 30:14</span></p></div>${quizHTML([{q:"Fine-tuning est...",o:["un last resort après prompts, modèles, decomposition","toujours la première étape","gratuit"],a:0,e:"Coûteux, réserver aux systèmes matures."}], "performance")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('performance')">← Précédent</button><button class="btn" onclick="nextFrom('performance')">Latence & coût →</button></div>`},
      {id:"latency-cost",title:"16. Latence & coût",express:true,content:`
        <h1>Simulateur latence et coût</h1><p class="lead">Obtenez d abord un baseline : time each step. Ensuite parallelisez, rightsize model, faster providers, trim context. Pour coût : measure each step, attack big buckets, tier models, cache, constrain outputs, batch. <span class="source">⏱ 30:26</span></p><div class="simulator"><div class="slider-row"><label for="cost-runs">Runs / jour</label><input type="range" id="cost-runs" min="1" max="5000" step="1" value="1000" oninput="updateCost()"><span class="slider-val" id="cv-runs">1 000</span></div><div class="slider-row"><label for="cost-steps">LLM steps / run</label><input type="range" id="cost-steps" min="1" max="50" step="1" value="12" oninput="updateCost()"><span class="slider-val" id="cv-steps">12</span></div><div class="slider-row"><label for="cost-tools">Tool calls / run</label><input type="range" id="cost-tools" min="0" max="50" step="1" value="8" oninput="updateCost()"><span class="slider-val" id="cv-tools">8</span></div><div class="slider-row"><label for="cost-tier">Modèle</label><select id="cost-tier" onchange="updateCost()"><option value="cheap">Cheap / small</option><option value="frontier">Frontier / large</option></select><span class="slider-val"></span></div><div class="slider-row"><label for="cost-cache">Cache hit</label><input type="range" id="cost-cache" min="0" max="100" step="5" value="30" oninput="updateCost()"><span class="slider-val" id="cv-cache">30%</span></div><div class="slider-row"><label for="cost-output">Output constraint</label><input type="range" id="cost-output" min="0" max="100" step="5" value="40" oninput="updateCost()"><span class="slider-val" id="cv-output">40%</span></div><label class="check-item" style="margin-top:.6rem"><input type="checkbox" id="cost-parallel" onchange="updateCost()"><span><span class="label">Paralléliser tool calls</span><span class="hint">réduit latence, pas toujours coût</span></span></label><div class="meter"><div class="meter-fill" id="cost-fill"></div></div><pre id="cost-out" class="prompt"></pre></div><div class="card purple"><h3>Exemple transcript</h3><p>Research agent écrivant essays : si running 1 000 times a day, environ 80 USD/day ou 2 400 USD/month. Web search 2 cents/call x 10 calls = 20 cents. Cache aggressively deterministic results. <span class="source">⏱ 31:49</span></p></div>${quizHTML([{q:"Première étape pour réduire latence ?",o:["Obtenir un baseline en timant chaque step","Changer de navigateur","Supprimer les logs"],a:0,e:"Sans baseline, vous optimisez à l aveugle."},{q:"Batch processing peut réduire coût car...",o:["il bundle operations similaires au lieu de payer on-demand","il supprime les tools","il rend les modèles plus gros"],a:0,e:"Exemple AWS : batch 50% du coût on-demand."}], "latency-cost")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('latency-cost')">← Précédent</button><button class="btn" onclick="nextFrom('latency-cost')">Observabilité & sécurité →</button></div>`},
      {id:"obs-security",title:"17. Observabilité & sécurité",express:true,content:`
        <h1>Observer et sécuriser un système non-déterministe</h1><p class="lead">Observability for AI systems is fundamentally different from traditional software. Same input can produce different output. Distributed execution, tools parallel, sub-agents, external dependencies. <span class="source">⏱ 32:44</span></p><div class="grid"><div class="card info"><h3>Zoom in</h3><p>Full trace single run : prompts, tool calls, token usage, retries, decision points. Reproduire une erreur. <span class="source">⏱ 33:32</span></p></div><div class="card info"><h3>Zoom out</h3><p>Automated quality checks, hallucination rates, success, ROI, trend lines. <span class="source">⏱ 33:45</span></p></div><div class="card good"><h3>Log why</h3><p>Pas seulement what : why agent chose web search over RAG, what reflection found. <span class="source">⏱ 34:02</span></p></div><div class="card warn"><h3>Quality sampling</h3><p>Échantillonner un % de runs pour score qualité/hallucination quand vous ne pouvez pas tout inspecter. <span class="source">⏱ 34:20</span></p></div></div><h2>Simulateur de risque sécurité</h2><div class="simulator"><div class="check-grid"><label class="check-item"><input type="checkbox" id="sec-external" onchange="updateSecurity()"><span><span class="label">Contenu externe</span><span class="hint">web, PDF, emails</span></span></label><label class="check-item"><input type="checkbox" id="sec-code" onchange="updateSecurity()"><span><span class="label">Code execution</span><span class="hint">génération et run</span></span></label><label class="check-item"><input type="checkbox" id="sec-pii" onchange="updateSecurity()"><span><span class="label">PII / données sensibles</span><span class="hint">outputs, logs, tools</span></span></label><label class="check-item"><input type="checkbox" id="sec-loop" onchange="updateSecurity()"><span><span class="label">Boucle autonome</span><span class="hint">sans validation humaine</span></span></label><label class="check-item"><input type="checkbox" id="sec-tools" onchange="updateSecurity()"><span><span class="label">Beaucoup d outils</span><span class="hint">large surface</span></span></label><label class="check-item"><input type="checkbox" id="sec-injection" onchange="updateSecurity()"><span><span class="label">Prompt injection</span><span class="hint">input ou data externe</span></span></label></div><div class="meter"><div class="meter-fill" id="sec-fill"></div></div><p id="sec-label" class="status-line"></p><div id="sec-advice" class="card"></div></div><div class="card bad"><h3>Code execution safeguards</h3><ul><li>Sandbox Docker / restricted runner.</li><li>Timeouts, memory caps, CPU limits.</li><li>Block dangerous imports/network/filesystem outside temp dir.</li><li>Whitelist libraries only.</li><li>Validation + reflection loop with circuit breaker.</li><li>Deterministic structured output, no direct user/file writes.</li><li>Input/output sanitation, scan API keys/PII. <span class="source">⏱ 36:08</span></li></ul></div>${quizHTML([{q:"Observabilité IA diffère du logiciel traditionnel car...",o:["non-déterminisme, exécution distribuée, tools parallèles, dépendances externes","elle n a pas besoin de logs","elle est toujours séquentielle"],a:0,e:"Same input can produce different output."},{q:"Prompt injection, c est...",o:["contenu malveillant qui hijack les instructions de l agent","un bug de CSS","une eval trop stricte"],a:0,e:"Peut venir de user input ou données externes."}], "obs-security")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('obs-security')">← Précédent</button><button class="btn" onclick="nextFrom('obs-security')">Bonus →</button></div>`},
      {id:"bonus",title:"18. Bonus & ressources",express:false,content:`
        <h1>Bonus : sous le capot, local, portfolio</h1><div class="grid"><div class="card purple"><h3>Blog agentic system design</h3><p>Pour devs voulant comprendre Claude Code/Cursor : three core layers — terminal UI, LLM intelligence layer, tool layer. Reactive command loop with async generators, streaming/tool calling patterns, parallel execution engine, smart tool scheduling read vs write. <span class="source">⏱ 37:17</span></p></div><div class="card good"><h3>Ollama local</h3><p>D après la base de connaissances fournie, Ollama permet de faire tourner LLM localement, gratuitement et privéement : pull models, Modelfile, REST API, Python library, RAG avec embeddings, agents. Excellent pour prototyper sans envoyer de données sensibles à une API cloud.</p></div><div class="card info"><h3>Sean Chen / GitHub</h3><p>Repos épinglés utiles comme référence de progression portfolio : launch-mvp-stripe-nextjs-supabase, yt-react-nextjs-tips, yt-DeepResearch-Backend, yt-supabase-tips-kanban, yt-kimi-k2-claude. Ils montrent des systèmes réels allant du MVP au backend DeepResearch et à l intégration Kimi/Claude Code.</p></div></div><div class="card warn"><h3>Conseil final du transcript</h3><p>Ce domaine change vite. La meilleure façon de devenir bon est d essayer, expérimenter, construire, et voir ce qui marche. Les sources sont citées en description de la vidéo originale. <span class="source">⏱ 38:03</span></p></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('bonus')">← Précédent</button><button class="btn" onclick="nextFrom('bonus')">Scénarios →</button></div>`},
      {id:"scenarios",title:"🎬 Scénarios",express:false,content:`
        <h1>Scénarios de diagnostic</h1><div class="simulator"><div class="tab-list no-print"><button class="tab-btn" onclick="chooseScenario('prototype_stuck')">Démo fragile</button><button class="tab-btn" onclick="chooseScenario('handoff_fails')">Handoff casse</button><button class="tab-btn" onclick="chooseScenario('too_slow')">Trop lent</button><button class="tab-btn" onclick="chooseScenario('too_expensive')">Trop cher</button><button class="tab-btn" onclick="chooseScenario('hallucination')">Hallucination</button><button class="tab-btn" onclick="chooseScenario('security_code')">Code exécution</button><button class="tab-btn" onclick="chooseScenario('local_privacy')">Local / privacy</button><button class="tab-btn" onclick="chooseScenario('portfolio')">Portfolio</button></div><pre id="scenario-out" class="prompt" style="display:none"></pre></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('scenarios')">← Précédent</button><button class="btn" onclick="nextFrom('scenarios')">Flashcards →</button></div>`},
      {id:"flashcards",title:"🃏 Flashcards",express:false,content:`
        <h1>Flashcards</h1><p class="lead">58 cartes couvrant tout le transcript et les ressources fournies.</p><div class="flashcards"><div id="flashcard" class="flashcard"></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFlash()">← Précédente</button><button class="btn" onclick="flipFlash()">Retourner</button><button class="btn secondary" onclick="nextFlash()">Suivante →</button><button class="btn secondary" id="flash-known" onclick="markFlash()">Marquer connue</button></div></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('flashcards')">← Précédent</button><button class="btn" onclick="nextFrom('flashcards')">Anti-patterns →</button></div>`},
      {id:"antipatterns",title:"🚫 Anti-patterns",express:true,content:`
        <h1>Anti-patterns agents IA</h1><div class="grid"><div class="card bad"><h3>1. One-shot thinking</h3><p>Tout demander en un prompt alors que la tâche nécessite plan, recherche, révision.</p></div><div class="card bad"><h3>2. Multi-agent trop tôt</h3><p>Ajouter des agents avant d avoir un workflow simple mesurable.</p></div><div class="card bad"><h3>3. Interfaces floues</h3><p>Handoffs en blobs non structurés. Define interfaces, not vibes.</p></div><div class="card bad"><h3>4. Tools trop larges</h3><p>Donner tous les tools à tous les agents. Least privilege, scope per agent.</p></div><div class="card bad"><h3>5. Pas de trace</h3><p>Impossible de debugger pourquoi l agent a choisi un tool ou échoué.</p></div><div class="card bad"><h3>6. Eval by vibes</h3><p>Ça a l air bon, on déploie. Sans evals, aucun signal fiable.</p></div><div class="card bad"><h3>7. Ignorer coût/latence</h3><p>Tool calls redondants, modèles surdimensionnés, outputs verbeux.</p></div><div class="card bad"><h3>8. Code execution sans sandbox</h3><p>Risque critique : imports, réseau, filesystem, boucles infinies.</p></div></div>${quizHTML([{q:"Ajouter des agents avant d avoir evals et trace simples est...",o:["un anti-pattern courant","toujours recommandé","gratuit"],a:0,e:"Complexité sans mesure = dette technique."},{q:"Least privilege sur tools signifie...",o:["chaque agent reçoit seulement les tools nécessaires à son rôle","tous les agents ont tous les tools","supprimer tools"],a:0,e:"Sécurité, audit, debug."}], "antipatterns")}<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('antipatterns')">← Précédent</button><button class="btn" onclick="nextFrom('antipatterns')">Examen final →</button></div>`},
      {id:"final",title:"✅ Examen final",express:true,content:`
        <h1>Examen final chronométré</h1><p class="lead">10 questions. 8 minutes. Seuil 7/10.</p><div class="toolbar no-print"><button class="btn" id="exam-start" onclick="startExam()">Démarrer le minuteur</button><div id="exam-timer" class="pill">⏱ 8:00</div></div>${finalQuizHTML()}<div class="toolbar no-print"><button class="btn" onclick="submitExam()">Soumettre l examen</button><button class="btn secondary" id="go-cert" style="display:none" onclick="showSection('action')">Voir certificat →</button></div><div class="result" id="exam-result" aria-live="polite"></div>`},
      {id:"action",title:"🏆 Certificat",express:true,content:`
        <h1>Certificat et checklist production</h1><div class="card info no-print"><h3>Nom pour certificat</h3><input id="cert-name" placeholder="Prénom / pseudo"/><div class="toolbar"><button class="btn" onclick="generateCert()">Générer certificat</button><button class="btn secondary" onclick="exportJSON()">Exporter JSON</button><button class="btn secondary" onclick="window.print()">Imprimer / PDF</button><button class="btn secondary" onclick="resetCourse()">Réinitialiser</button></div></div><div id="certificate" class="certificate"><span class="badge">🤖</span><h2>Certificat de maîtrise</h2><p>Décerné à</p><h3 id="cert-name-out">Apprenant</h3><p>pour avoir complété la masterclass</p><p class="highlight">AI Agents Complets : ReAct, Tools, Planning, Multi-Agents, Evals, Production, Sécurité</p><p class="muted">Date : <span id="cert-date"></span> • Score : <span id="cert-score"></span> • Niveau : <span id="cert-level"></span></p></div><h2>Checklist 18 points</h2><div class="card checklist"><label><input type="checkbox" id="c1" onchange="toggleCheck('c1')"> Définir le problème et choisir une tâche itérative/multi-step pertinente.</label><label><input type="checkbox" id="c2" onchange="toggleCheck('c2')"> Commencer par complexité haute / précision tolérable si possible.</label><label><input type="checkbox" id="c3" onchange="toggleCheck('c3')"> Choisir le bon niveau d autonomie : scripté, semi, autonome.</label><label><input type="checkbox" id="c4" onchange="toggleCheck('c4')"> Engineer le contexte : rôle, background, tools, mémoire, état.</label><label><input type="checkbox" id="c5" onchange="toggleCheck('c5')"> Décomposer la tâche en steps small, checkable, clairs.</label><label><input type="checkbox" id="c6" onchange="toggleCheck('c6')"> Ajouter evals simples dès le début, puis LLM judge si nécessaire.</label><label><input type="checkbox" id="c7" onchange="toggleCheck('c7')"> Logger la trace : prompts, tool calls, résultats, décisions.</label><label><input type="checkbox" id="c8" onchange="toggleCheck('c8')"> Distinguer memory dynamique et knowledge statique.</label><label><input type="checkbox" id="c9" onchange="toggleCheck('c9')"> Mettre guardrails : code, LLM judge, human approval.</label><label><input type="checkbox" id="c10" onchange="toggleCheck('c10')"> Utiliser reflection seulement si elle améliore qualité/coût.</label><label><input type="checkbox" id="c11" onchange="toggleCheck('c11')"> Concevoir tools comme produits : interface, implémentation, tests, docs, versioning.</label><label><input type="checkbox" id="c12" onchange="toggleCheck('c12')"> Rappel : le LLM requeste un tool, votre code l exécute.</label><label><input type="checkbox" id="c13" onchange="toggleCheck('c13')"> Planning dynamique avec validation des outputs et permissions.</label><label><input type="checkbox" id="c14" onchange="toggleCheck('c14')"> Multi-agent seulement si spécialisation/parallélisation justifie la complexité.</label><label><input type="checkbox" id="c15" onchange="toggleCheck('c15')"> Définir interfaces schématiques entre agents.</label><label><input type="checkbox" id="c16" onchange="toggleCheck('c16')"> Mesurer latence et coût par étape, cacher, batcher, tier models.</label><label><input type="checkbox" id="c17" onchange="toggleCheck('c17')"> Observabilité zoom in/out et quality sampling.</label><label><input type="checkbox" id="c18" onchange="toggleCheck('c18')"> Sécuriser code execution, PII, prompt injection, resource exhaustion.</label></div><p class="muted small">Checklist : <span id="check-progress">0/18</span></p><h2>Ressources</h2><div class="resources"><ul><li>Transcript source : AI agents course par Marina, senior applied scientist.</li><li>Sujets clés : ReAct, task selection, autonomy, context engineering, decomposition, CrewAI, evals, memory, guardrails, reflection, tools, planning, multi-agent patterns, production, security.</li><li>Base de connaissances fournie : Ollama pour prototypage local gratuit/privé ; Sean Chen / GitHub pour exemples de projets réels ; Kimi K2 comme agentic LLM open weight cité dans le transcript.</li></ul></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom('action')">← Revenir à l examen</button><button class="btn" onclick="showSection('home')">Retour accueil</button></div>`}
    ];
