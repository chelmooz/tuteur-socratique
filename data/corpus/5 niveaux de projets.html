<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Les 5 Niveaux de l’AI Engineering | API, RAG, Agents, Enterprise, Self-Improving</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">📈 <span>AI Engineering</span> Masterclass</div>
        <div class="muted small">5 niveaux • API • RAG • Agents • Enterprise • Self-improving • Evals</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "ai-eng-five-levels-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express") {
      return `
        <div class="quiz" data-module="${moduleId}">
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "locator") estimateLevel();
      if (id === "risk") updateRisk();
      if (id === "metrics") showMetric();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    // ============ DIAGNOSTIC ============
    const DIAG_TEXT = {
      debutant: "Commencez par le niveau 1 avec un projet utile en une semaine, puis ajoutez tracking et évaluations avant de toucher au RAG. Ne sautez pas les fondations.",
      builder: "Vous êtes probablement entre niveau 1 et 2. Concentrez-vous sur RAG évalué, chunking, retrieval metrics, puis agents read-only avec observabilité.",
      senior: "Passez directement aux niveaux 4 et 5 : scaffolding, tracing, guardrails, coût/latence, évaluation anti-triche et boucles d’auto-amélioration supervisées."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.builder}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ LEVEL LOCATOR ============
    const CAP_LABELS = {
      "cap-api": "utiliser une API LLM avec une interface simple",
      "cap-track": "tracker et tester prompts/sorties",
      "cap-rag": "ajouter du RAG sur documents internes ou privés",
      "cap-evals": "évaluer chaque composant et le système complet",
      "cap-agent": "faire tourner une boucle agent avec outils",
      "cap-observability": "avoir observabilité, sécurité et outils read-only d’abord",
      "cap-multi": "coordonner plusieurs agents spécialisés avec un checker",
      "cap-scaffold": "mettre tracing, guardrails, contrôle coût/latence",
      "cap-self": "laisser un agent proposer/tester/garder des changements",
      "cap-anticheat": "concevoir une évaluation que l’agent ne peut pas tricher"
    };

    const LEVEL_STEPS = [
      { level: 1, label: "Niveau 1 — API + interface", req: ["cap-api"] },
      { level: 2, label: "Niveau 2 — RAG + évaluations", req: ["cap-api", "cap-track", "cap-rag", "cap-evals"] },
      { level: 3, label: "Niveau 3 — Agent outillé et observable", req: ["cap-api", "cap-track", "cap-rag", "cap-evals", "cap-agent", "cap-observability"] },
      { level: 4, label: "Niveau 4 — Multi-agents enterprise", req: ["cap-api", "cap-track", "cap-rag", "cap-evals", "cap-agent", "cap-observability", "cap-multi", "cap-scaffold"] },
      { level: 5, label: "Niveau 5 — Self-improving", req: ["cap-api", "cap-track", "cap-rag", "cap-evals", "cap-agent", "cap-observability", "cap-multi", "cap-scaffold", "cap-self", "cap-anticheat"] }
    ];

    function estimateLevel() {
      const checked = id => !!document.getElementById(id)?.checked;
      let achieved = 0;

      for (const step of LEVEL_STEPS) {
        if (step.req.every(checked)) achieved = step.level;
        else break;
      }

      const out = $("#level-out");
      if (!out) return;

      if (!checked("cap-api")) {
        out.textContent = "Niveau estimé : 0 — Vous n’avez pas encore coché l’usage d’une API LLM avec une interface. Commencez par un petit projet niveau 1 : un chatbot ou un summarizer utile dans votre vie réelle.";
        return;
      }

      const current = LEVEL_STEPS[achieved - 1] || LEVEL_STEPS[0];
      let text = "Niveau estimé : " + current.level + " — " + current.label + "\n\n";

      if (achieved < 5) {
        const next = LEVEL_STEPS[achieved];
        const missing = next.req.filter(id => !checked(id)).map(id => CAP_LABELS[id]);
        text += "Pour atteindre " + next.label + ", il manque :\n- " + missing.join("\n- ") + "\n\n";
      } else {
        text += "Vous avez coché toutes les capacités du niveau 5. Attention : le transcript rappelle que ce niveau s’apprend surtout en运行ant des systèmes en production pendant des années, pas en quelques semaines d’auto-formation.\n\n";
      }

      const warnings = [];
      if (checked("cap-agent") && !checked("cap-evals")) warnings.push("Un agent sans évaluations robustes n’est pas un niveau 3 fiable : c’est une dette technique qui se paie en production.");
      if (checked("cap-multi") && !checked("cap-observability")) warnings.push("Plusieurs agents sans observabilité = cascade d’erreurs invisible jusqu’au jour où un client la voit.");
      if (checked("cap-self") && !checked("cap-anticheat")) warnings.push("Auto-amélioration sans évaluation anti-triche = reward hacking : l’agent optimise le score, pas le produit.");
      if (checked("cap-rag") && !checked("cap-evals")) warnings.push("RAG sans métriques de retrieval et de fidélité, c’est une boîte noire qui invente des réponses avec confiance.");

      if (warnings.length) {
        text += "Alertes :\n- " + warnings.join("\n- ");
      } else {
        text += "Aucune alerte majeure sur les cases cochées. Prochaine étape : rendre le système mesurable, observable et sûr avant d’ajouter de la puissance.";
      }

      out.textContent = text;
    }

    // ============ RISK SIMULATOR ============
    function updateRisk() {
      const items = [
        { id: "risk-ext", label: "Lit du contenu externe (web, docs, emails)" },
        { id: "risk-write", label: "Peut écrire / modifier des données" },
        { id: "risk-pay", label: "Peut dépenser de l’argent ou déclencher des paiements" },
        { id: "risk-pii", label: "Accède à des données personnelles ou sensibles" },
        { id: "risk-loop", label: "Tourne en boucle autonome sans validation humaine" },
        { id: "risk-tools", label: "Beaucoup d’outils / large surface d’action" }
      ];

      const count = items.filter(i => document.getElementById(i.id)?.checked).length;
      const fill = $("#risk-fill");
      const label = $("#risk-label");
      const advice = $("#risk-advice");

      if (fill) fill.style.width = (count / items.length * 100) + "%";
      if (label) {
        if (count === 0) label.textContent = "Risque faible — agent lecture seule ou quasi inoffensif.";
        else if (count <= 2) label.textContent = "Risque modéré — nécessite journalisation et limites claires.";
        else if (count <= 4) label.textContent = "Risque élevé — observabilité, guardrails et validations humaines indispensables.";
        else label.textContent = "Risque critique — agent trop puissant pour être déployé sans contrôles robustes.";
      }

      if (advice) {
        const mitigations = [];
        if (document.getElementById("risk-ext")?.checked) mitigations.push("Traitez le contenu externe comme non fiable : injection indirecte, données empoisonnées, instructions cachées.");
        if (document.getElementById("risk-write")?.checked) mitigations.push("Commencez read-only. N’accordez l’écriture qu’après avoir prouvé la fiabilité de la boucle.");
        if (document.getElementById("risk-pay")?.checked) mitigations.push("Paiements/actions irréversibles : validation humaine, plafonds, dry-run, logs immuables.");
        if (document.getElementById("risk-pii")?.checked) mitigations.push("Données sensibles : moindre privilège, chiffrement, masquage dans les logs, contrôle d’accès avant retrieval.");
        if (document.getElementById("risk-loop")?.checked) mitigations.push("Boucle autonome : max steps, timeout, budget tokens, interruption humaine, rollback.");
        if (document.getElementById("risk-tools")?.checked) mitigations.push("Trop d’outils : sélection par étape, descriptions minimales, allowlist, tests d’attaque.");

        advice.innerHTML = mitigations.length
          ? "<strong>Mitigations recommandées :</strong><ul>" + mitigations.map(m => "<li>" + m + "</li>").join("") + "</ul>"
          : "Cochez les capacités de votre agent pour voir les mitigations adaptées.";
      }
    }

    // ============ METRICS MATCHER ============
    const METRIC_TEXT = {
      retrieval: "Niveau 2 — Qualité du retrieval\nMétriques utiles : recall@k, précision des chunks, MRR, similarité cosine, taux de chunks hors sujet.\nLe transcript insiste : avant de blâmer le LLM, vérifiez que le bon morceau de document est bien récupéré.",
      faithfulness: "Niveau 2 — Fidélité de la réponse\nMétriques utiles : faithfulness / groundedness, answer relevancy, taux d’hallucination, citation des sources.\nIl ne suffit pas d’avoir une réponse fluide : il faut savoir si elle est réellement ancrée dans les documents récupérés.",
      agent: "Niveau 3 — Fiabilité de l’agent\nMétriques utiles : task success rate, tool error rate, nombre moyen d’étapes, coût par tâche, décisions incorrectes, boucles infinies.\nAu niveau 3, on n’évalue plus une seule réponse : on évalue une séquence de décisions.",
      enterprise: "Niveau 4 — Système en production\nMétriques utiles : succès end-to-end, P95/P99 latency, coût par requête, taux de contournement des guardrails, escalade humaine, incidents par million de requêtes.\nLe vrai travail est souvent dans le scaffolding autour des agents.",
      self: "Niveau 5 — Auto-amélioration sûre\nMétriques utiles : amélioration mesurée du produit, divergence entre score et qualité réelle, reward hacking, taux de rollback, approbation humaine, couverture d’instrumentation.\nSi le scoring est faux, l’agent n’améliore pas le produit : il exploite la faille du scoring."
    };

    function showMetric() {
      const key = $("#metric-select")?.value || "retrieval";
      const out = $("#metric-out");
      if (out) out.textContent = METRIC_TEXT[key] || "";
    }

    // ============ SCENARIOS ============
    function chooseScenario(key) {
      const texts = {
        stuck_l1: "Cas : votre chatbot impressionne en démo mais casse dès qu’on change un prompt.\nDiagnostic : niveau 1 sans tracking ni évaluations.\nRemède : journalisez prompts/sorties, ajoutez des tests de parsing, des fallbacks, puis une petite suite d’eval avec 20 à 50 cas réels.",
        rag_no_eval: "Cas : vous avez branché un RAG, mais le système répond à côté.\nDiagnostic : retrieval non évalué.\nRemède : mesurez recall@k et fidélité. Testez chunking, embedding, retriever séparément avant de toucher au prompt final.",
        agent_danger: "Cas : un agent peut lire vos emails, appeler des API et acheter des choses.\nDiagnostic : pouvoir donné trop tôt.\nRemède : commencez read-only, instrumentez chaque tool call, imposez max steps/budget, validation humaine pour actions irréversibles.",
        multi_break: "Cas : un agent se trompe, le suivant amplifie l’erreur, le client voit une réponse publique.\nDiagnostic : multi-agents sans checker ni tracing.\nRemède : routeur + spécialistes + agent de vérification. Tracez chaque décision. Cassez volontairement le système avec de faux inputs.",
        self_cheat: "Cas : le tableau de bord affiche un score parfait, mais les utilisateurs se plaignent.\nDiagnostic : évaluation hackable.\nRemède : liez le score à la qualité produit réelle, multipliez les métriques, gardez un humain pour approuver les changements en production.",
        portfolio: "Cas : vous voulez un portfolio qui montre une vraie progression d’AI engineer.\nParcours recommandé :\n- Niveau 1 : summarizer ou chatbot utile en Streamlit.\n- Niveau 2 : RAG sur vos notes/docs avec evals.\n- Niveau 3 : agent read-only avec tools et traces.\n- Niveau 4 : multi-agent avec checker, guardrails, coût/latence.\n- Niveau 5 : expérimentation d’auto-amélioration avec approbation humaine.\nExemples publics fournis : repos GitHub orientés DeepResearch agent, Supabase, Kimi K2/Claude Code, MVP Next.js/Stripe/Supabase."
      };
      const out = $("#scenario-out");
      if (out) { out.style.display = "block"; out.textContent = texts[key] || ""; }
    }

    // ============ FLASHCARDS ============
    const FLASHCARDS = [
      { front: "Niveau 1", back: "Projet utilisant une API de modèle avec une interface simple : chatbot, summarizer, Streamlit. Prompt engineering, sorties structurées, fallbacks, mais souvent pas de tracking ni d’evals.", tip: "0:35" },
      { front: "Limite du niveau 1", back: "Le projet « marche seulement quand il marche ». Sans tracking des prompts ni métriques, on ne sait pas si les changements aident. Le modèle manque aussi de contexte interne à l’entreprise.", tip: "1:18" },
      { front: "Niveau 2", back: "On ajoute du RAG pour donner au modèle accès à des connaissances internes. Mais la partie difficile n’est pas de brancher RAG : c’est de savoir si les réponses sont correctes et pourquoi elles échouent.", tip: "1:36" },
      { front: "Compétences niveau 2", back: "Chunking, embeddings, vector database, stratégies de retrieval, évaluations par composant et pour le système entier, savoir ce que « bon » veut dire pour le client.", tip: "2:02" },
      { front: "Passer de 1 à 2", back: "Prendre le chatbot existant et le brancher sur des données que le modèle n’a jamais vues : logs nutrition, recettes familiales, docs internes. Puis évaluer sérieusement.", tip: "2:26" },
      { front: "Niveau 3", back: "Agents IA : un modèle qui peut utiliser des outils et prendre des décisions en boucle jusqu’à完成 une tâche. Recherche web, APIs, code, base de données.", tip: "4:17" },

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous comprenez la progression des 5 niveaux : API, RAG évalué, agents observables, multi-agents enterprise, self-improving sûr. Vous pouvez positionner vos projets et choisir la prochaine compétence à travailler."
          : (correct >= 5 ? "Bases correctes. Revoyez la différence entre brancher RAG et l’évaluer, les dangers des agents, et le reward hacking au niveau 5." : "Reprenez les modules 1 à 3, puis le simulateur de niveau et les flashcards avant de réessayer.");
        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

      updateExamTimer();
      if (STATE.exam.finished) {
        const btn = $("#exam-start");
        if (btn) btn.style.display = "none";
        const res = $("#exam-result");
        if (res && !res.innerHTML) res.innerHTML = `Examen terminé : ${STATE.exam.score}/${STATE.exam.total}. ${STATE.exam.passed ? "Certificat disponible." : "Revoyez les modules puis réessayez."}`;
        const certBtn = $("#go-cert");
        if (certBtn) certBtn.style.display = "inline-flex";
      }
    }

      const block = $("#certificate");

      block.scrollIntoView({ behavior: "smooth", block: "center" });
    }

            <p>Cela va bien au-delà du simple fait d’utiliser des coding agents pour écrire le code, ce que vous ferez à tous les niveaux. C’est même au-delà du spec-driven development où vous dites à l’agent ce que vous voulez qu’il construise puis le laissez l’implémenter. <span class="source">⏱ 8:33</span></p>

            <div class="card purple">

              <p>Andrej Karpathy a mené un projet où un seul agent a fait environ 700 expériences en deux jours complètement seul, et est revenu avec 20 façons différentes de rendre l’entraînement de modèle plus rapide. <span class="source">⏱ 9:05</span></p>
            </div>

            </div>
          </div>

            <p>Tout ce cycle ne fonctionne que si l’agent peut correctement juger son propre travail encore et encore sans que personne vérifie. Et ça s’avère plutôt difficile à bien faire, parce que si votre scoring est même un petit peu faux, l’agent ne réparera pas le produit. Il trouvera juste la faille dans votre scoring et l’exploitera, accumulant un super score pendant que le produit réel empire de façons que vous n’auriez peut-être même jamais pensé à mesurer. <span class="source">⏱ 9:20</span></p>
          </div>

          <div class="card warn">

        `
      }
    ];

    function init() {
      loadState();
      document.body.setAttribute("data-theme", STATE.theme);
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      showSection(visibleModules()[0]?.id || "home");
      updateScore();
      updateChecklistProgress();
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.estimateLevel = estimateLevel;
    window.updateRisk = updateRisk;
    window.showMetric = showMetric;
    window.chooseScenario = chooseScenario;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;
    window.$ = $;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
