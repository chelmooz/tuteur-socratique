var KEY="finetuning-unsloth-v2";

function $(s,r){return (r||document).querySelector(s)}

function quizHTML(items,moduleId,title){
var h='<div class="quiz" data-module="'+moduleId+'"><h3>'+(title||"Quiz express")+'</h3>';
for(var i=0;i<items.length;i++){var it=items[i];
h+='<div class="q" data-answer="'+it.a+'"><p class="q-text">'+(i+1)+'. '+it.q+'</p>';

function switchTab(btn,panelId){var root=btn.closest(".tabs");$$(".tab-btn",root).forEach(function(b){b.classList.remove("active")});btn.classList.add("active");$$(".tab-panel",root).forEach(function(p){p.classList.toggle("active",p.id===panelId)})}
function checkQuiz(btn){var box=btn.closest(".quiz");var moduleId=box.getAttribute("data-module");var qs=$$(".q",box);var correct=0;

function visibleModules(){return MODULES.filter(function(m){return STATE.path==="masterclass"||m.express!==false})}

function restoreExam(){updateExamTimer();if(STATE.exam.finished){var b=$("#exam-start");if(b)b.style.display="none";var r=$("#exam-result");if(r&&!r.innerHTML)r.innerHTML="Examen termine : "+STATE.exam.score+"/"+STATE.exam.total+".";var cb=$("#go-cert");if(cb)cb.style.display="inline-flex"}}
function generateCert(){if(!STATE.exam.finished){alert("Terminez d abord l examen final.");return}var name=($("#cert-name")?$("#cert-name").value:"")||"Apprenant";STATE.certName=name;saveState();var block=$("#certificate");if(!block)return;block.classList.add("show");$("#cert-name-out").textContent=name;$("#cert-date").textContent=new Date().toLocaleDateString("fr-FR");$("#cert-score").textContent=STATE.exam.score+"/"+STATE.exam.total;$("#cert-level").textContent=STATE.exam.passed?"Maitrise validee":"Fin de parcours";block.scrollIntoView({behavior:"smooth",block:"center"})}
function restoreAction(){var ni=$("#cert-name");if(ni&&STATE.certName)ni.value=STATE.certName;var keys=Object.keys(STATE.checklist);for(var i=0;i<keys.length;i++){var el=document.getElementById(keys[i]);if(el)el.checked=STATE.checklist[keys[i]]}updateChecklistProgress();if(STATE.exam.finished)generateCert()}
function toggleCheck(id){var el=document.getElementById(id);if(!el)return;STATE.checklist[id]=el.checked;saveState();updateChecklistProgress()}
function updateChecklistProgress(){var boxes=$$(".checklist input[type=checkbox]");var done=0;for(var i=0;i<boxes.length;i++){if(boxes[i].checked)done++}var el=$("#check-progress");if(el)el.textContent=done+"/"+boxes.length}
function exportJSON(){var data={cours:"Fine-Tuning LLM Masterclass",date:new Date().toISOString(),profil:STATE.diagnostic,parcours:STATE.path,progression:STATE.visited,quiz:STATE.quizScores,examen:{termine:STATE.exam.finished,score:STATE.exam.score,total:STATE.exam.total,reussi:STATE.exam.passed},flashcards_connues:STATE.flash.known,checklist:STATE.checklist};var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rapport-finetuning.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
function resetCourse(){if(!confirm("Reinitialiser toute la progression ?"))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
var MODULES=[
{id:"home",title:"Accueil",express:true,content:'<h1>Fine-Tuning LLM : Guide complet sur votre hardware</h1><p class="lead">Ce cours vous montre comment choisir le bon LLM, le fine-tuner avec vos propres donnees, et le comparer au modele de base. Tout est fait localement avec Unsloth Studio, gratuitement. <span class="source">&#9201; 0:00</span></p><div class="schema-wrap"><svg class="schema" viewBox="0 0 960 260" role="img" aria-label="Flux complet fine-tuning"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><rect x="20" y="80" width="130" height="70" class="node"/><text x="85" y="108" text-anchor="middle">Base Model</text><text x="85" y="130" text-anchor="middle" class="sub">Llama 8B</text><path class="dash" d="M150 115 L200 115" marker-end="url(#arr)"/><rect x="200" y="80" width="140" height="70" class="node green"/><text x="270" y="108" text-anchor="middle">+ Dataset</text><text x="270" y="130" text-anchor="middle" class="sub">instruction/input/output</text><path class="dash green" d="M340 115 L390 115" marker-end="url(#arr)"/><rect x="390" y="80" width="140" height="70" class="node purple pulse"/><text x="460" y="108" text-anchor="middle">LoRA Training</text><text x="460" y="130" text-anchor="middle" class="sub">QLoRA 4-bit</text><path class="dash purple" d="M530 115 L580 115" marker-end="url(#arr)"/><rect x="580" y="80" width="140" height="70" class="node yellow"/><text x="650" y="108" text-anchor="middle">Fine-Tuned</text><text x="650" y="130" text-anchor="middle" class="sub">adapter layers</text><path class="dash yellow" d="M720 115 L770 115" marker-end="url(#arr)"/><rect x="770" y="80" width="140" height="70" class="node"/><text x="840" y="108" text-anchor="middle">Export</text><text x="840" y="130" text-anchor="middle" class="sub">GGUF / 16-bit</text></svg></div><div class="grid"><div class="card info"><h3>Objectif</h3><p>Savoir choisir un modele, preparer un dataset, entrainer avec QLoRA, comparer base vs fine-tuned, et exporter.</p></div><div class="card warn"><h3>Methode</h3><p>Diagnostic, simulateurs, 10 modules progressifs, flashcards, examen, certificat.</p></div><div class="card good"><h3>Livrable</h3><p>Un modele fine-tuned fonctionnel, exporte en GGUF pour Ollama, avec dataset reproductible.</p></div></div><div class="toolbar no-print"><button class="btn" onclick="showSection(\'diagnostic\')">Commencer par le diagnostic</button><button class="btn secondary" onclick="showSection(\'basics\')">Aller au cours</button></div>'},
{id:"diagnostic",title:"Diagnostic",express:true,content:'<h1>Diagnostic initial</h1><p class="lead">Trois questions pour adapter le parcours.</p><div class="quiz"><div class="q"><p class="q-text">1. Votre niveau ?</p><label class="q-option"><input type="radio" name="diag-level" value="novice"> Novice : je decouvre le fine-tuning.</label><label class="q-option"><input type="radio" name="diag-level" value="builder"> Builder : j ai deja utilise des LLMs.</label><label class="q-option"><input type="radio" name="diag-level" value="prod"> Prod : je veux optimiser pour production.</label></div><div class="q"><p class="q-text">2. Objectif ?</p><label class="q-option"><input type="radio" name="diag-goal" value="learn"> Apprendre le processus.</label><label class="q-option"><input type="radio" name="diag-goal" value="build"> Fine-tuner un modele pour mon use case.</label><label class="q-option"><input type="radio" name="diag-goal" value="ship"> Deployer en production.</label></div><div class="q"><p class="q-text">3. Temps ?</p><label class="q-option"><input type="radio" name="diag-time" value="express"> Express 15-20 min.</label><label class="q-option"><input type="radio" name="diag-time" value="masterclass"> Masterclass 45-60 min.</label></div><button class="btn" onclick="validateDiagnostic()">Valider</button><div class="result" id="diag-rec" style="display:none"></div><div class="toolbar"><button class="btn secondary" id="diag-next" style="display:none" onclick="nextFrom(\'diagnostic\')">Continuer</button></div></div>'},
{id:"basics",title:"1. Basics LoRA/QLoRA",express:true,content:'<h1>Fine-tuning : le concept</h1><p class="lead">Plutot que construire un LLM from scratch, on prend un modele existant deja bon et on ajoute nos donnees dessus. <span class="source">&#9201; 0:32</span></p><div class="schema-wrap"><svg class="schema" viewBox="0 0 960 300" role="img" aria-label="Architecture LoRA"><defs><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><rect x="100" y="120" width="200" height="100" class="node" stroke-dasharray="6 4"/><text x="200" y="155" text-anchor="middle">Base Model</text><text x="200" y="175" text-anchor="middle" class="sub">Poids intacts</text><rect x="380" y="120" width="180" height="100" class="node green pulse"/><text x="470" y="155" text-anchor="middle">LoRA Adapters</text><text x="470" y="175" text-anchor="middle" class="sub">&lt;1% taille base</text><path class="dash green" d="M300 170 L380 170" marker-end="url(#arr2)"/><rect x="640" y="120" width="200" height="100" class="node purple"/><text x="740" y="155" text-anchor="middle">Modele Specialise</text><text x="740" y="175" text-anchor="middle" class="sub">Base + Adapters</text><path class="dash purple" d="M560 170 L640 170" marker-end="url(#arr2)"/></svg></div><div class="grid"><div class="card info"><h3>LoRA</h3><p>Adapter layers ajoutes sur le base model. Moins de 1% de la taille. Permet de steer l output sans toucher aux poids de base. <span class="source">&#9201; 2:41</span></p></div><div class="card good"><h3>QLoRA</h3><p>LoRA + base model quantise en 4-bit. Reduit ~16GB a ~5-6GB. Legere perte de precision mais plus d espace pour les adapters. <span class="source">&#9201; 4:11</span></p></div><div class="card warn"><h3>Pourquoi QLoRA ?</h3><p>On n a pas 100 GPUs. QLoRA permet de fine-tuner sur hardware consumer. <span class="source">&#9201; 5:34</span></p></div></div>'+quizHTML([{q:"Que fait le LoRA adapter layer ?",o:["Il remplace le base model","Il ajoute des couches entrainees sans toucher aux poids de base","Il supprime les poids inutiles"],a:1,e:"Moins de 1% de la taille, steer/ajuste l output."},{q:"Pourquoi utiliser QLoRA ?",o:["Le base model est quantise 4-bit, reduisant la taille memoire","C est plus precis","Ca ne marche que sur Mac"],a:0,e:"16GB vers 5-6GB, plus d espace pour les adapters."}],"basics")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'basics\')">Precedent</button><button class="btn" onclick="nextFrom(\'basics\')">Fine-tuning vs RAG</button></div>'},
{id:"ft-vs-rag",title:"2. Fine-tuning vs RAG",express:true,content:'<h1>Fine-tuning vs RAG : la misconception courante</h1><p class="lead">Beaucoup pensent que fine-tuning ne peut pas teach de nouvelles infos et que RAG est toujours la solution. C est faux. <span class="source">&#9201; 7:05</span></p><div class="compare-box"><div class="compare-card"><h4>RAG</h4><p>Injecte des faits / data fraiche dans le prompt. Le modele raisonne sur ces infos.</p><p class="muted small">Retrieving real, up to date data and feeding that into the prompt. <span class="source">&#9201; 7:25</span></p></div><div class="compare-card good"><h4>Fine-tuning</h4><p>Ajuste les poids via adapter layers. Le modele repond differemment sans changer le prompt.</p><p class="muted small">The model itself will reply differently without you needing to do anything to the prompt. <span class="source">&#9201; 7:42</span></p></div></div><div class="card purple"><h3>Quand utiliser quoi ?</h3><ul><li><strong>RAG</strong> : donnees dynamiques, faits a jour, domaine specifique avec documents.</li><li><strong>Fine-tuning</strong> : ton, style, format, competences, comportement.</li><li><strong>Les deux</strong> : souvent complementaires.</li></ul></div>'+quizHTML([{q:"Quelle est la difference principale ?",o:["Fine-tuning ajuste les poids, RAG injecte des faits dans le prompt","RAG ajuste les poids, fine-tuning injecte des faits","Aucune difference"],a:0,e:"Fine-tuning change le modele, RAG change le contexte."}],"ft-vs-rag")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'ft-vs-rag\')">Precedent</button><button class="btn" onclick="nextFrom(\'ft-vs-rag\')">Hardware</button></div>'},
{id:"hardware",title:"3. Hardware",express:true,content:'<h1>Hardware requirements</h1><p class="lead">Techniquement, n importe quel ordinateur peut suivre. Mais la VRAM (Windows) ou unified memory (Mac) determine la taille du modele fine-tunable. <span class="source">&#9201; 7:55</span></p><div class="grid"><div class="card info"><h3>Windows</h3><p>GPU Nvidia moderne, idealement 12GB+ VRAM. <span class="source">&#9201; 8:01</span></p></div><div class="card info"><h3>Mac</h3><p>M-series avec max unified memory. M3/M4/M5 Pro/Max. <span class="source">&#9201; 8:09</span></p></div><div class="card warn"><h3>Hardware faible ?</h3><p>Google Colab gratuit via Unsloth documentation. <span class="source">&#9201; 8:49</span></p></div></div><div class="card purple"><h3>Sweet spot</h3><p>8B parametres avec ~10GB VRAM. I found you can get really good performance out of 8 billion parameter models. <span class="source">&#9201; 12:24</span></p></div>'+quizHTML([{q:"Quel est le sweet spot recommande ?",o:["6GB vers 3-4B","10GB vers 7-8B","32GB vers 70B"],a:1,e:"8B avec QLoRA 4-bit est le meilleur ratio."},{q:"Que faire avec hardware tres faible ?",o:["Abandonner","Utiliser Google Colab gratuit via Unsloth","Acheter 100 GPUs"],a:1,e:"Unsloth fournit un notebook Colab gratuit."}],"hardware")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'hardware\')">Precedent</button><button class="btn" onclick="nextFrom(\'hardware\')">Setup Unsloth</button></div>'},
{id:"setup",title:"4. Setup Unsloth",express:true,content:'<h1>Installation Unsloth Studio</h1><p class="lead">Unsloth Studio est une GUI gratuite, open source, offline. Fine-tune, build datasets, export modeles. <span class="source">&#9201; 1:28</span></p><div class="grid"><div class="card good"><h3>Caracteristiques</h3><ul><li>Gratuit, open source</li><li>Pas besoin de compte</li><li>Fonctionne offline</li><li>Utilise GPU, CPU, RAM</li></ul></div><div class="card info"><h3>Installation</h3><p>Mac/Linux : une commande dans le terminal. Windows : autre commande. Lancer sur localhost:8888. <span class="source">&#9201; 9:17</span></p></div><div class="card warn"><h3>Features Studio</h3><ul><li>Fine-tune models</li><li>Build datasets (Recipes)</li><li>Chat interface</li><li>Compare base vs fine-tuned</li><li>Export models</li></ul></div></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'setup\')">Precedent</button><button class="btn" onclick="nextFrom(\'setup\')">Model Selection</button></div>'},
{id:"model-selection",title:"5. Model Selection",express:true,content:'<h1>Choisir le bon modele</h1><p class="lead">Dans Unsloth Hub, filtrer par Fine-tune ready. Choisir la bonne taille, le bon variant, le bon format. <span class="source">&#9201; 11:46</span></p><div class="grid"><div class="card good"><h3>Regles de selection</h3><ul><li><strong>Taille</strong> : selon VRAM</li><li><strong>Variant</strong> : Instruct, jamais Base</li><li><strong>Quantization</strong> : BNB 4-bit si disponible</li><li><strong>Format</strong> : Safe Tensors, jamais GGUF</li></ul></div><div class="card info"><h3>Modele recommande</h3><p>Llama 3.1 8B Instruct Unsloth BNB 4-bit (~6GB). Deja quantise pour QLoRA. <span class="source">&#9201; 13:04</span></p></div><div class="card bad"><h3>A eviter</h3><ul><li>GGUF : pour inference seulement</li><li>Base model : pas entraine a suivre instructions</li><li>Modeles &gt;27B : peu de benefice fine-tuning</li></ul></div></div>'+quizHTML([{q:"Quel format ne peut PAS etre fine-tuned ?",o:["Safe Tensors","GGUF","MLX"],a:1,e:"GGUF est pour inference seulement."},{q:"Quel variant choisir ?",o:["Base","Instruct","Peu importe"],a:1,e:"Instruct est deja entraine a suivre les instructions."}],"model-selection")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'model-selection\')">Precedent</button><button class="btn" onclick="nextFrom(\'model-selection\')">Dataset</button></div>'},
{id:"dataset",title:"6. Training Data",express:true,content:'<h1>Le dataset : instruction, input, output</h1><p class="lead">Le dataset est plus important que le modele. Format : 3 colonnes. Instruction constante, input/output variables. <span class="source">&#9201; 15:06</span></p><div class="card info"><h3>Taille du dataset</h3><ul><li><strong>300-1000 lignes</strong> : shift ton et format</li><li><strong>5000-15000 lignes</strong> : teach une vraie competence</li><li>Pas besoin de dizaines de milliers d exemples</li></ul><span class="source">&#9201; 16:11</span></div><div class="card purple"><h3>Exemple du transcript</h3><p>Tim apprend l indonesien. Dataset : 3000 lignes generees par Claude a partir de sa liste de 300 mots. Instruction constante : You are Tim s personal Indonesian tutor. <span class="source">&#9201; 17:39</span></p></div>'+quizHTML([{q:"Combien d exemples pour teach une vraie competence ?",o:["50-100","5000-15000","1 million+"],a:1,e:"300-1000 pour shift ton, 5000-15000 pour vraie competence."},{q:"Quelles sont les 3 colonnes du dataset ?",o:["instruction, input, output","question, answer, score","prompt, response, metadata"],a:0,e:"Input est optionnel mais recommande."}],"dataset")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'dataset\')">Precedent</button><button class="btn" onclick="nextFrom(\'dataset\')">Training</button></div>'},
{id:"training",title:"7. Training",express:true,content:'<h1>Training : QLoRA, epochs, loss curve</h1><p class="lead">Train tab, select model, QLoRA, dataset, parameters, start training. Surveiller la loss curve. <span class="source">&#9201; 32:11</span></p><div class="grid"><div class="card info"><h3>Parametres cles</h3><ul><li><strong>Method</strong> : QLoRA (4-bit recommande)</li><li><strong>Dataset</strong> : local ou Hugging Face</li><li><strong>Epochs</strong> : 1 pour simple, 3 standard</li><li><strong>Rank/Alpha/Dropout</strong> : laisser defaults si debutant</li></ul><span class="source">&#9201; 34:47</span></div><div class="card good"><h3>Loss curve</h3><p>Graph principal a surveiller. Loss doit diminuer. Sous 1.0 = bon signe. <span class="source">&#9201; 36:30</span></p></div><div class="card warn"><h3>Learning rate</h3><p>Diminue graduellement. Moins on traine, moins le modele apprend de nouvelles infos. <span class="source">&#9201; 36:30</span></p></div></div><h2>Simulateur : loss curve</h2><div class="simulator"><div class="loss-bar"><div class="loss-fill" id="loss-fill"></div><span class="loss-label" id="loss-label">loss: -</span></div><pre id="training-log" class="prompt"></pre><div class="toolbar no-print"><button class="btn" id="training-next" onclick="nextTrainingStep()">Etape d entrainement</button><button class="btn secondary" onclick="resetTraining()">Reinitialiser</button></div></div>'+quizHTML([{q:"Que signifie une loss qui passe sous 1.0 ?",o:["Le modele a echoue","Le modele a bien capte le pattern","Il faut recommencer"],a:1,e:"Loss &lt; 1 = bon signe, training efficace."},{q:"Combien d epochs pour donnees simples ?",o:["1","3","10"],a:0,e:"1 epoch suffit pour donnees simples. 3 standard."}],"training")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'training\')">Precedent</button><button class="btn" onclick="nextFrom(\'training\')">Comparison</button></div>'},
{id:"comparison",title:"8. Base vs Fine-Tuned",express:true,content:'<h1>Comparer base vs fine-tuned</h1><p class="lead">Compare chat dans Unsloth Studio : meme prompt, deux modeles cote a cote. Verifier que le fine-tuning fonctionne. <span class="source">&#9201; 38:34</span></p><div class="simulator"><div class="matcher-grid"><button class="matcher-btn" data-compare="hello" onclick="showComparison(\'hello\')">Hello, apa kabar ?</button><button class="matcher-btn" data-compare="word" onclick="showComparison(\'word\')">What does alone mean ?</button><button class="matcher-btn" data-compare="translate" onclick="showComparison(\'translate\')">How to say I want to workout ?</button></div><div class="compare-box"><div class="compare-card bad"><h4>Base Model</h4><pre id="compare-base" class="prompt"></pre></div><div class="compare-card good"><h4>Fine-Tuned</h4><pre id="compare-ft" class="prompt"></pre></div></div><p id="compare-note" class="muted"></p></div><div class="card purple"><h3>Lecon</h3><p>Le modele fine-tuned utilise uniquement des mots que Tim connait. Le base model utilise un vocabulaire trop avance. Le fine-tuning a change le comportement sans changer le prompt. <span class="source">&#9201; 39:08</span></p></div>'+quizHTML([{q:"Que montre la comparaison base vs fine-tuned ?",o:["Le fine-tuned utilise un vocabulaire adapte au niveau cible","Le base model est toujours meilleur","Aucune difference"],a:0,e:"Le fine-tuning change le comportement sans changer le prompt."}],"comparison")+'<div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'comparison\')">Precedent</button><button class="btn" onclick="nextFrom(\'comparison\')">Export</button></div>'},
{id:"export",title:"9. Export",express:true,content:'<h1>Exporter le modele fine-tuned</h1><p class="lead">Trois formats d export selon l usage. Upload Hugging Face pour partager. <span class="source">&#9201; 40:22</span></p><div class="grid"><div class="card good"><h3>GGUF</h3><p>Pour Ollama et inference locale. Format compresse, facile a run. <span class="source">&#9201; 40:22</span></p></div><div class="card info"><h3>16-bit</h3><p>Modele complet pour production / API serving. Qualite maximale. <span class="source">&#9201; 40:33</span></p></div><div class="card warn"><h3>LoRA adapter</h3><p>Adapter seul. Leger a partager. Applique sur base model. <span class="source">&#9201; 40:33</span></p></div></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'export\')">Precedent</button><button class="btn" onclick="nextFrom(\'export\')">Scenarios</button></div>'},
{id:"scenarios",title:"Scenarios",express:false,content:'<h1>Scenarios : diagnostiquer et choisir</h1><div class="simulator"><div class="tab-list no-print"><button class="tab-btn" onclick="chooseScenario(\'lora_vs_qlora\')">LoRA vs QLoRA</button><button class="tab-btn" onclick="chooseScenario(\'dataset_size\')">Dataset size</button><button class="tab-btn" onclick="chooseScenario(\'base_vs_instruct\')">Base vs Instruct</button><button class="tab-btn" onclick="chooseScenario(\'gguf_vs_safetensors\')">GGUF vs Safe Tensors</button><button class="tab-btn" onclick="chooseScenario(\'fine_tuning_vs_rag\')">Fine-tuning vs RAG</button><button class="tab-btn" onclick="chooseScenario(\'export_format\')">Export format</button></div><pre id="scenario-out" class="prompt" style="display:none"></pre></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'scenarios\')">Precedent</button><button class="btn" onclick="nextFrom(\'scenarios\')">Flashcards</button></div>'},
{id:"flashcards",title:"Flashcards",express:false,content:'<h1>Flashcards</h1><p class="lead">25 cartes couvrant tout le transcript.</p><div class="flashcards"><div id="flashcard" class="flashcard"></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFlash()">Precedente</button><button class="btn" onclick="flipFlash()">Retourner</button><button class="btn secondary" onclick="nextFlash()">Suivante</button><button class="btn secondary" id="flash-known" onclick="markFlash()">Marquer connue</button></div></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'flashcards\')">Precedent</button><button class="btn" onclick="nextFrom(\'flashcards\')">Examen final</button></div>'},
{id:"final",title:"Examen final",express:true,content:'<h1>Examen final chronometre</h1><p class="lead">10 questions. 8 minutes. Seuil 7/10.</p><div class="toolbar no-print"><button class="btn" id="exam-start" onclick="startExam()">Demarrer le minuteur</button><div id="exam-timer" class="pill">&#9201; 8:00</div></div>'+finalQuizHTML()+'<div class="toolbar no-print"><button class="btn" onclick="submitExam()">Soumettre l examen</button><button class="btn secondary" id="go-cert" style="display:none" onclick="showSection(\'action\')">Voir certificat</button></div><div class="result" id="exam-result" aria-live="polite"></div>'},
{id:"action",title:"Certificat",express:true,content:'<h1>Certificat et checklist</h1><div class="card info no-print"><h3>Nom pour certificat</h3><input id="cert-name" placeholder="Prenom / pseudo"/><div class="toolbar"><button class="btn" onclick="generateCert()">Generer certificat</button><button class="btn secondary" onclick="exportJSON()">Exporter JSON</button><button class="btn secondary" onclick="window.print()">Imprimer / PDF</button><button class="btn secondary" onclick="resetCourse()">Reinitialiser</button></div></div><div id="certificate" class="certificate"><span class="badge">&#127912;</span><h2>Certificat de maitrise</h2><p>Decerne a</p><h3 id="cert-name-out">Apprenant</h3><p>pour avoir complete la masterclass</p><p class="highlight">Fine-Tuning LLM Local : Unsloth Studio, QLoRA, Dataset, Training, Export</p><p class="muted">Date : <span id="cert-date"></span> &#8226; Score : <span id="cert-score"></span> &#8226; Niveau : <span id="cert-level"></span></p></div><h2>Checklist 14 points</h2><div class="card checklist"><label><input type="checkbox" id="c1" onchange="toggleCheck(\'c1\')"> Installer Unsloth Studio et lancer sur localhost:8888.</label><label><input type="checkbox" id="c2" onchange="toggleCheck(\'c2\')"> Verifier hardware : VRAM (Windows) ou unified memory (Mac).</label><label><input type="checkbox" id="c3" onchange="toggleCheck(\'c3\')"> Choisir modele Instruct, BNB 4-bit, Safe Tensors.</label><label><input type="checkbox" id="c4" onchange="toggleCheck(\'c4\')"> Tester le modele en chat avant fine-tuning.</label><label><input type="checkbox" id="c5" onchange="toggleCheck(\'c5\')"> Preparer dataset : instruction + input + output.</label><label><input type="checkbox" id="c6" onchange="toggleCheck(\'c6\')"> 300-1000 lignes minimum pour shift ton/format.</label><label><input type="checkbox" id="c7" onchange="toggleCheck(\'c7\')"> Generer dataset via Claude ou Recipes Unsloth.</label><label><input type="checkbox" id="c8" onchange="toggleCheck(\'c8\')"> Test run 2 records avant full run.</label><label><input type="checkbox" id="c9" onchange="toggleCheck(\'c9\')"> Train avec QLoRA, 1 epoch pour commencer.</label><label><input type="checkbox" id="c10" onchange="toggleCheck(\'c10\')"> Surveiller loss curve : doit diminuer sous 1.0.</label><label><input type="checkbox" id="c11" onchange="toggleCheck(\'c11\')"> Comparer base vs fine-tuned en compare chat.</label><label><input type="checkbox" id="c12" onchange="toggleCheck(\'c12\')"> Verifier que le fine-tuning change le comportement.</label><label><input type="checkbox" id="c13" onchange="toggleCheck(\'c13\')"> Exporter en GGUF pour Ollama.</label><label><input type="checkbox" id="c14" onchange="toggleCheck(\'c14\')"> Tester le modele exporte dans Ollama.</label></div><p class="muted small">Checklist : <span id="check-progress">0/14</span></p><h2>Ressources</h2><div class="resources"><ul><li>Transcript source : guide complet fine-tuning LLM avec Unsloth Studio.</li><li>Sean Chen / seanchen.io : Builder bilingue, fondateur AutoManus, MIT analytics, Google, Walmart.</li><li>GitHub ShenSeanChen : launch-mvp-stripe-nextjs-supabase, yt-DeepResearch-Backend, yt-kimi-k2-claude.</li></ul></div><div class="toolbar no-print"><button class="btn secondary" onclick="prevFrom(\'action\')">Revenir a l examen</button><button class="btn" onclick="showSection(\'home\')">Retour accueil</button></div>'}
];
