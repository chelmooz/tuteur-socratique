<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Apprendre Python pour l’IA | Fondations, Projets, IA Collaborative, Jugement</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🐍 <span>Python pour l’IA</span> Masterclass</div>
        <div class="muted small">Fondations ciblées • Projets en couches • IA collaborative • Jugement • Ownership</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "python-ai-learning-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express") {
      return `
        <div class="quiz" data-module="${moduleId}">
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "method") updatePractice();
      if (id === "foundations") updateVenv();
      if (id === "projects") updateProjectStack();
      if (id === "ai-rule") evaluateAiGate();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    // ============ DIAGNOSTIC ============
    const DIAG_TEXT = {
      debutant: "Commencez par les 4 groupes de fondations, puis un premier projet API LLM. Ne regardez pas seulement : écrivez, cassez, réparez.",
      intermediaire: "Vous connaissez peut-être les bases, mais il faut les orienter IA : APIs, JSON, erreurs, fichiers, environnements, puis projets en couches.",
      experimente: " Concentrez-vous sur la méthode : ne laissez pas l’IA écrire à votre place pendant les fondations, puis maîtrisez specs, tests, evals, code review et trade-offs."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.intermediaire}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ PRACTICE BALANCE ============
    function updatePractice() {
      const watch = Number($("#pb-watch")?.value ?? 70);
      const code = 100 - watch;
      $("#pbv-watch").textContent = watch + "%";
      $("#pbv-code").textContent = code + "%";

      const fill = $("#pb-fill");
      if (fill) {
        fill.style.width = watch + "%";
        fill.style.background = watch > 50 ? "linear-gradient(90deg, var(--yellow), var(--red))" : "linear-gradient(90deg, var(--green), var(--accent))";
      }

      const out = $("#pb-out");
      if (!out) return;
      if (watch >= 70) {
        out.textContent = "Piège du tutoriel : vous consommez beaucoup plus que vous ne produisez. Le transcript est clair : regarder 40 heures de code écrit par quelqu’un d’autre peut ne rien ancrer. Baissez la part de visionnage, augmentez la part d’écriture, d’exécution, de cassure et de réparation.";
      } else if (watch >= 40) {
        out.textContent = "Équilibre perfectible. Un peu de théorie est utile, mais la compétence se construit surtout quand vous prenez le clavier : éditer le code, le lancer, le casser, le corriger, puis recommencer.";
      } else {
        out.textContent = "Bon signal : vous êtes dans l’apprentissage actif. La théorie doit servir la pratique, pas la remplacer. Enchaînez petits projets, erreurs, débogage et répétition.";
      }
    }

    // ============ VENV SIMULATOR ============
    function updateVenv() {
      const a = $("#venv-a")?.value || "v2";
      const b = $("#venv-b")?.value || "v1";
      const iso = !!$("#venv-iso")?.checked;
      const out = $("#venv-out");
      if (!out) return;

      if (a === b) {
        out.textContent = "Résultat : pas de conflit de version détecté. Les deux projets utilisent la même version de la bibliothèque. C’est plus simple, mais l’isolation reste une bonne habitude.";
        return;
      }

      if (!iso) {
        out.textContent = "Résultat : conflit probable. Vous installez la version du Projet A, puis le Projet B casse parce qu’il attend une autre version. Sans environnement virtuel, les paquets partagent le même espace global. C’est exactement le problème que pip/UV + virtual environments résolvent.";
        return;
      }

      out.textContent = "Résultat : isolation réussie. Chaque projet a son propre environnement virtuel. Le Projet A garde sa version, le Projet B garde la sienne. Installer une dépendance pour l’un ne casse plus l’autre. C’est une fondation non négociable en ingénierie IA.";
    }

    // ============ PROJECT STACK ============
    const PROJECT_STAGES = [
      { id: "proj-api", name: "Script API LLM", skills: "HTTP requests, JSON, gestion d’erreurs, variables d’environnement, appels de modèle" },
      { id: "proj-rag", name: "RAG sur vos données", skills: "vector databases, embeddings, chunking documentaire, retrieval, contexte" },
      { id: "proj-judge", name: "LLM judge / evals", skills: "évaluation de sortie, rubriques, grading logic, mesure de qualité" },
      { id: "proj-agent", name: "Couche agentique", skills: "outils, décisions, workflows multi-étapes, observabilité, boucle" }
    ];

    function updateProjectStack() {
      const selected = PROJECT_STAGES.filter(s => document.getElementById(s.id)?.checked);
      const out = $("#project-out");
      if (!out) return;

      if (!selected.length) {
        out.textContent = "Sélectionnez au moins une étape. L’idée n’est pas de faire quatre projets séparés, mais une seule échelle de complexité : API → RAG → evals → agent.";
        return;
      }

      const allSkills = [...new Set(selected.flatMap(s => s.skills.split(", ").flatMap(x => x.split("/"))))];
      let text = "Votre échelle de projet :\n";
      selected.forEach((s, i) => {
        text += (i + 1) + ". " + s.name + " — " + s.skills + "\n";
      });

      text += "\nCompétences cumulées : " + allSkills.join(" ; ") + ".\n";

      if (selected.length === PROJECT_STAGES.length) {
        text += "\nExcellent : vous n’avez pas quatre petits projets random. Vous avez un système de plus en plus sophistiqué, qui mappe directement ce que font les AI engineers en poste : appeler des modèles, brancher des données, évaluer les sorties, puis ajouter des outils et des décisions.";
      } else if (selected.length === 1) {
        text += "\nBon début. Le transcript insiste : commencez petit, mais layerisez. Un simple appel d’API LLM bien fait couvre déjà JSON, requests, erreurs et environnement.";
      } else {
        text += "\nVous êtes sur la bonne voie. Ajoutez les étapes manquantes dans l’ordre : d’abord fiabiliser les données et le retrieval, puis mesurer la qualité, puis seulement donner des outils et une boucle à l’agent.";
      }

      out.textContent = text;
    }

    // ============ AI GATE ============
    function evaluateAiGate() {
      const phase = document.querySelector("input[name='ai-phase']:checked")?.value;
      const usage = document.querySelector("input[name='ai-usage']:checked")?.value;
      const readyRead = !!document.getElementById("ready-read")?.checked;
      const readyDebug = !!document.getElementById("ready-debug")?.checked;
      const readyFlow = !!document.getElementById("ready-flow")?.checked;
      const readiness = readyRead && readyDebug && readyFlow;

      const out = $("#ai-gate-out");
      if (!out) return;

      if (!phase || !usage) {
        out.textContent = "Sélectionnez une phase et un usage de l’IA.";
        return;
      }

      if (phase === "foundations") {
        if (usage === "write") {
          out.textContent = "❌ Sabotage. Pendant la phase fondations, laisser l’IA écrire tout le projet vous prive de la construction de l’intuition. Le transcript est direct : si vous faites ça avant d’être prêt, vous ne serez pas qualifié pour un vrai rôle d’AI engineering.";
        } else if (usage === "review") {
          out.textContent = "⚠️ Limite acceptable seulement si vous comprenez déjà le code. En phase fondations, l’IA doit surtout expliquer des concepts et tester votre compréhension. La revue de code suppose que vous savez déjà lire et raisonner sur le code.";
        } else {
          out.textContent = "✅ Bonne utilisation. En phase fondations, l’IA est autorisée pour expliquer des concepts et tester votre compréhension. Vous écrivez le code vous-même, même si c’est lent et frustrant : c’est ainsi que se construisent les vraies compétences.";
        }
        return;
      }

      if (phase === "transition") {
        if (!readiness) {
          out.textContent = "🔒 Pas encore prêt. Les trois critères du transcript sont : lire du code inconnu et expliquer ce qu’il fait ; déboguer un test qui échoue seul ; raisonner sur le data flow et les points de rupture probables. Cochez-les seulement si c’est réellement vrai.";
        } else if (usage === "write") {
          out.textContent = "⚠️ Vous pouvez commencer à utiliser l’IA comme collaboratrice, mais pas comme auteur unique. Le rôle devient : spécifier, contraindre, tester, évaluer, relire. Si l’IA écrit tout sans que vous poussiez de retour, vous reproduisez le piège des fondations à un niveau supérieur.";
        } else {
          out.textContent = "✅ Vous avez gagné l’accès à l’étape suivante. L’IA peut devenir un accélérateur : prompts structurés, contraintes claires, tests, evals, revue de code. Écrivez encore des parties critiques vous-même pour garder la main.";
        }
        return;
      }

      if (phase === "production") {
        if (usage === "write") {
          out.textContent = "⚠️ En production, l’IA peut générer beaucoup de code, mais votre travail devient surtout revue, garde-fous, tests, evals et arbitrages. Laissons l’IA produire, mais ne validez jamais sans comprendre le mode de défaillance.";
        } else {
          out.textContent = "✅ Usage professionnel. La compétence n’est plus seulement écrire du code à la main : c’est diriger l’IA avec des specs, vérifier les tests, mesurer les sorties, relire le code, documenter les trade-offs et communiquer les choix.";
        }
      }
    }

    // ============ TRADEOFF GENERATOR ============
    function generateTradeoff() {
      const db = $("#tr-db")?.value || "une base locale simple";
      const model = $("#tr-model")?.value || "un modèle API généraliste";
      const users = $("#tr-users")?.value || "1000";
      const constraint = $("#tr-constraint")?.value || "le coût";
      const out = $("#tradeoff-out");
      if (!out) return;

      out.textContent =
"Défense du choix technique\n\n" +
"J’ai choisi " + db + " parce qu’elle correspond au stade actuel du produit et à la contrainte principale : " + constraint + ". " +
"Pour environ " + users + " utilisateurs, le point sensible n’est pas seulement la fonctionnalité, mais le coût récurrent, la latence, la fiabilité du retrieval et la facilité de débogage.\n\n" +
"Le modèle retenu, " + model + ", est justifié tant qu’il respecte les exigences de qualité et de confidentialité. Si le volume augmente, il faudra recalculer le coût par requête, mesurer la qualité des réponses, prévoir un fallback, et peut-être déplacer une partie du workload vers un modèle local ou plus petit pour les tâches simples.\n\n" +
"Ce que je surveillerai : coût par utilisateur actif, taux d’échec du retrieval, latence P95, erreurs d’API, qualité évaluée par judge, et incidents de sécurité. Si ces métriques se dégradent, la décision sera réexaminée — pas défendue par ego, mais par données.";
    }

    // ============ SCENARIOS ============
    function chooseScenario(key) {
      const texts = {
        tutorial_loop: "Cas : vous avez suivi 40 heures de tutoriels Python, mais vous galérez à écrire un script simple.\nDiagnostic : apprentissage passif. Le transcript dit clairement que regarder n’est pas apprendre.\nRemède : passez en mode actif. Éditez le code, exécutez-le, cassez-le, corrigez-le. Un petit projet réel vaut mieux qu’une longue playlist visionnée.",
        tf_pytorch: "Cas : vous préparez un rôle d’AI engineer en entraînant des modèles avec TensorFlow ou PyTorch from scratch.\nDiagnostic : mauvais ciblage. Ce sont des bibliothèques pour entraîner des modèles, pas forcément ce que fait un AI engineer en pratique.\nRemède : concentrez-vous sur APIs, JSON, erreurs, fichiers, environnements, RAG, evals et agents.",
        claude_writes_rag: "Cas : Claude vous a écrit un RAG qui tourne en une heure, mais vous ne savez pas pourquoi il échoue quand un document change.\nDiagnostic : vous avez sauté la phase fondations.\nRemède : réécrivez les briques vous-même, comprenez le flux de données, ajoutez des tests, puis seulement réutilisez l’IA comme collaboratrice.",
        ai_tests_pass_wrong: "Cas : l’IA a généré des tests qui passent, mais le système échoue en production.\nDiagnostic : tests superficiels. L’IA peut écrire des tests qui passent pour les mauvaises raisons.\nRemède : relisez chaque test, demandez-vous s’il attrape vraiment le mode de défaillance visé, ajoutez des evals sur les sorties.",
        cost_tradeoff: "Cas : vous avez choisi un modèle cher et une base vectorielle complexe sans justifier le coût.\nDiagnostic : absence de jugement produit et business.\nRemède : documentez les trade-offs : pourquoi ce modèle, pourquoi cette DB, coût par requête, impact si 10x plus d’utilisateurs, alternative plus simple.",
        portfolio_generic: "Cas : votre portfolio contient un classificateur MNIST, un modèle de prédiction et un notebook Kaggle.\nDiagnostic : c’est du machine learning générique, pas de l’AI engineering.\nRemède : construisez une échelle : API LLM → RAG → LLM judge → agent, avec code, tests, logs et décisions documentées."
      };
      const out = $("#scenario-out");
      if (out) { out.style.display = "block"; out.textContent = texts[key] || ""; }
    }

    // ============ FLASHCARDS ============
    const FLASHCARDS = [

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous comprenez la méthode : ignorer le superflu, bâtir les 4 fondations, apprendre en pratiquant, construire une échelle de projets, utiliser l’IA d’abord comme explicateur puis comme collaboratrice, et développer jugement + communication."
          : (correct >= 5 ? "Bases correctes. Revoyez la règle IA pendant les fondations, les 4 groupes de compétences et la différence entre ML générique et AI engineering." : "Reprenez les modules 1 à 5, puis les simulateurs pratique, venv et projet, avant de réessayer.");
        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }
