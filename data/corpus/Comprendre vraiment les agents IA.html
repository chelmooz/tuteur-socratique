<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Agents IA | Boucle ReAct, Skills, Context Engineering, Evals</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🤖 <span>AI Agents</span> Masterclass</div>
        <div class="muted small">Boucle ReAct • Skills • Constrained Decoding • Context Engineering • Evals</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "ai-agents-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express") {
      return `
        <div class="quiz" data-module="${moduleId}">
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "react-loop") initReactSim();
      if (id === "consistent-output") runConstrainedDemo();
      if (id === "errors-evals") updateErrorCalc();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    // ============ DIAGNOSTIC ============
    const DIAG_TEXT = {
      debutant: "Commencez par la boucle ReAct et le simulateur interactif. L'analogie « texte en entrée, texte en sortie » est votre ancre avant d'aborder les skills et le context engineering.",
      praticien: "Passez vite sur les bases, concentrez-vous sur le constrained decoding, les 4 stratégies de context engineering et la multiplication des erreurs — c'est là que se joue la fiabilité en production.",
      expert: "Allez directement aux subtilités : evals avec LLM judge, budgets de tokens, isolation multi-agents — puis validez avec l'examen et la checklist de mise en production."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.praticien}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ SIMULATEUR BOUCLE REACT ============
    const REACT_STEPS = [
      { who: "USER", cls: "react-user", text: "Trouve le vol le moins cher pour Seattle vendredi prochain et ajoute-le à mon calendrier." },
      { who: "MODÈLE (génère du texte)", cls: "react-model", text: "Lecture de la question + menu d'outils → décide qu'une recherche aiderait.<br><code>call search_flights(destination=\"Seattle\", date=\"vendredi\", sort=\"prix\")</code>" },
      { who: "VOTRE CODE", cls: "react-code", text: "Parse la réponse du LLM, identifie l'outil demandé, exécute search_flights HORS du LLM." },
      { who: "RÉSULTAT OUTIL", cls: "react-result", text: "[Vol AS 1042 — 189 $, 08:15] [Vol DL 88 — 214 $, 10:30] ...<br>→ ajouté à la conversation, puis toute la conversation est renvoyée au modèle." },
      { who: "MODÈLE (génère du texte)", cls: "react-model", text: "Lit l'historique complet, voit les options de vol, génère la prochaine requête :<br><code>call add_calendar_event(title=\"Vol AS 1042 → Seattle\", heure=\"08:15\")</code>" },
      { who: "VOTRE CODE", cls: "react-code", text: "Exécute add_calendar_event avec les détails trouvés → ajoute le résultat à la conversation → renvoie tout au modèle." },
      { who: "MODÈLE (décide : terminé)", cls: "react-done", text: "Voit que la tâche est complète → répond en texte simple au lieu de demander un outil :<br>« C'est fait ! Vol AS 1042 à 189 $ ajouté à votre calendrier vendredi 08:15. »<br><strong>→ Pas de requête d'outil = la boucle s'arrête.</strong>" }
    ];

    let reactStep = 0;

    function initReactSim() {
      reactStep = 0;
      const container = $("#react-history");
      if (!container) return;
      container.innerHTML = REACT_STEPS.map((s, i) => `
        <div class="react-msg ${s.cls}" id="react-step-${i}">
          <span class="who">${s.who}</span>
          <span>${s.text}</span>
        </div>
      `).join("");
      const status = $("#react-status");
      if (status) status.textContent = "Cliquez sur « Étape suivante » pour démarrer la boucle.";
      const nextBtn = $("#react-next");
      if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = "Étape suivante →"; }
      const resetBtn = $("#react-reset");
      if (resetBtn) resetBtn.style.display = "inline-flex";
    }

    function nextReactStep() {
      if (reactStep >= REACT_STEPS.length) return;
      const el = $("#react-step-" + reactStep);
      if (el) el.classList.add("visible");

      const status = $("#react-status");
      const memNote = $("#react-memory");
      if (status) {
        if (reactStep < REACT_STEPS.length - 1) {
          status.textContent = `Étape ${reactStep + 1}/${REACT_STEPS.length} — la conversation s'allonge, c'est la mémoire de l'agent.`;
        } else {
          status.textContent = "✅ Boucle terminée : le modèle a répondu en texte simple, pas de requête d'outil.";
        }
      }
      if (memNote) {
        memNote.textContent = "Messages dans l'historique : " + (reactStep + 1) + " — tout est renvoyé au modèle à chaque cycle.";
      }

      reactStep++;
      if (reactStep >= REACT_STEPS.length) {
        const nextBtn = $("#react-next");
        if (nextBtn) nextBtn.disabled = true;
      }
    }

    // ============ CONSTRAINED DECODING DEMO ============
    function runConstrainedDemo() {
      const wrap = $("#constrained-demo");
      if (!wrap) return;

      const tokens = [
        { tok: "{", prob: 0.42, valid: true },
        { tok: "\"query\"", prob: 0.31, valid: true },
        { tok: "Sure,", prob: 0.18, valid: false },
        { tok: ":", prob: 0.06, valid: true },
        { tok: "]", prob: 0.03, valid: false }
      ];

      wrap.innerHTML = `
        <p class="muted small">À chaque token, le système vérifie lesquels gardent le JSON valide et bloque les autres (probabilité → 0).</p>
        ${tokens.map((t, i) => `
          <div class="tok-row ${t.valid ? "" : "tok-blocked"}">
            <span class="tok-label">${t.tok}</span>
            <div class="tok-bar-wrap"><div class="tok-bar" style="width:${t.valid ? t.prob * 100 : 0}%; background:${t.valid ? "var(--green)" : "var(--red)"}"></div></div>
            <span class="tok-prob">${t.valid ? (t.prob * 100).toFixed(0) + "%" : "0%"}</span>
          </div>
        `).join("")}
        <p class="muted small" style="margin-top:0.6rem">Le modèle choisit toujours par probabilité, mais uniquement parmi les options qui ne cassent pas le format.</p>
      `;
    }

    // ============ CALCULATEUR MULTIPLICATION ERREURS ============
    function updateErrorCalc() {
      const acc = Number($("#ec-acc")?.value ?? 95);
      const steps = Number($("#ec-steps")?.value ?? 10);

      $("#ecv-acc").textContent = acc + "%";
      $("#ecv-steps").textContent = steps;

      const overall = Math.pow(acc / 100, steps) * 100;
      const fill = $("#ec-fill");
      if (fill) {
        fill.style.width = overall + "%";
        fill.style.background = overall > 70 ? "var(--green)" : (overall > 40 ? "var(--yellow)" : "var(--red)");
      }
      const out = $("#ec-out");
      if (out) {
        out.innerHTML = `<span class="big-number" style="color:${overall > 70 ? "var(--green)" : (overall > 40 ? "var(--yellow)" : "var(--red)")}">${overall.toFixed(1)}%</span> de chance de réussir la tâche complète`;
      }
    }

    // ============ SCENARIOS ============
    function chooseScenario(key) {
      const texts = {
        json_parse: "Cas : votre agent oublie une virgule dans une requête d'outil tous les ~300 cycles.\nConcept : SORTIE STRUCTURÉE FIABLE.\nDemander gentiment ne marche que « la plupart du temps ». La retry logic coûte des appels supplémentaires.\nDéfense : CONSTRAINED DECODING — pendant la génération, bloquer les tokens qui cassent le JSON en mettant leur probabilité à zéro.",
        context_bloat: "Cas : 20 étapes dans une tâche, les instructions originales sont enfouies sous 50 000 tokens de sorties d'outils.\nConcept : CONTEXT ENGINEERING.\nLes modèles retiennent bien le début et la fin, mais ratent le milieu (lost in the middle).\nDéfense : COMPRESS — résumer ou supprimer les vieilles sorties d'outils déjà exploitées.",
        too_many_tools: "Cas : un petit modèle échoue avec 46 outils disponibles mais réussit avec 19.\nConcept : SÉLECTION DES OUTILS.\nLe contexte avait techniquement la place, mais le modèle ne raisonne pas clairement avec trop d'options.\nDéfense : SELECT — cherchez sur les descriptions d'outils elles-mêmes et ne présentez que la poignée qui compte maintenant.",
        long_task: "Cas : une tâche de recherche + planification + code dans une seule longue conversation.\nConcept : ISOLATION MULTI-AGENTS.\nDéfense : ISOLATE — un agent parent confie le sous-tâche sale à un sous-agent avec sa propre fenêtre propre. Le sous-agent rapporte un court résumé, tout le bruit reste dans son contexte.",
        forget_rules: "Cas : l agent oublie les règles fondamentales après plusieurs sessions.\nConcept : MÉMOIRE EXTERNE.\nDéfense : WRITE — donnez à l agent un moyen de sauvegarder hors de la fenêtre : fichiers de notes mis à jour en travaillant, fichiers de règles chargés au début de chaque session.",
        unreliable: "Cas : votre agent réussit chaque étape 95% du temps, mais la tâche fait 20 étapes.\nConcept : MULTIPLICATION DES ERREURS.\n95%^20 ≈ 36%. Chaque étape a l'air correcte seule, mais multipliées, la tâche échoue.\nDéfense : EVALS — testez sur des tâches réelles, lancez plusieurs fois, suivez les taux de succès."
      };
      const out = $("#scenario-out");
      if (out) { out.style.display = "block"; out.textContent = texts[key] || ""; }
    }

    // ============ FLASHCARDS ============
    const FLASHCARDS = [
      { front: "Comment un LLM « cherche sur le web » ?", back: "Il ne le fait pas. Il génère du texte demandant d'appeler un outil. Votre code parse la requête, exécute la fonction hors du LLM, et renvoie le résultat. Texte en entrée, texte en sortie, à chaque étape.", tip: "1:14" },
      { front: "Tool / outil", back: "Une action qu'on dit au modèle qu'il peut prendre. Le modèle signale qu'il veut l'utiliser en écrivant une requête structurée. Le code exécute réellement la fonction.", tip: "1:18" },
      { front: "Boucle ReAct", back: "Le cycle : requête → outil → lire le résultat → renvoyer toute la conversation au modèle → répéter. Le modèle continue d'appeler des outils jusqu'à ce qu'il décide que la tâche est finie.", tip: "3:18" },
      { front: "Mémoire de l'agent", back: "L'historique de messages qui grandit. La question originale, tous les appels d'outils, chaque résultat — tout est renvoyé à l'agent à chaque cycle. C'est toute sa mémoire.", tip: "3:22" },
      { front: "Fin de la boucle", back: "Quand le modèle regarde la conversation et décide que la tâche est complète, il répond en texte simple au lieu de demander un outil. Le code voit qu'il n'y a pas de requête d'outil → la boucle s'arrête.", tip: "3:38" },
      { front: "Skill", back: "Un dossier d'instructions écrites en markdown simple qui apprend à l'agent à bien faire un travail spécifique. Chargé dans le contexte quand une tâche pertinente est détectée.", tip: "3:59" },
      { front: "Valeur des skills", back: "Tout ce que vous savez sur bien faire une tâche — conventions d'équipe, bizarreries actuelles d'un outil, vérifications systématiques — peut être documenté UNE fois, et chaque run d'agent charge votre expertise au bon moment.", tip: "5:18" },
      { front: "Exemple Supabase skills", back: "Un fichier markdown qui encode les exigences de sécurité, les commandes CLI actuelles, et une règle clé : vérifier la doc en direct avant d'écrire du code Supabase, plutôt que de faire confiance au snapshot des données d'entraînement.", tip: "4:38" },
      { front: "Problème des virgules manquantes", back: "Les requêtes d'outils sont du texte structuré que votre code doit parser. Si le modèle oublie une virgule ou une accolade, le parse échoue, l'outil ne tourne jamais, la boucle casse.", tip: "5:49" },
      { front: "Pourquoi « demander gentiment » ne suffit pas", back: "« Ça marche la plupart du temps » = tous les quelques centaines de requêtes, le modèle ajoute un petit « Bien sûr, voici votre JSON » avant le JSON, et votre parser échoue quand même.", tip: "6:24" },
      { front: "Constrained decoding", back: "Pendant la génération, le système vérifie quels tokens garderaient le JSON valide et bloque tous les autres en mettant leur probabilité à zéro. Le modèle choisit toujours par probabilité, mais parmi une liste où les options cassantes sont déjà indisponibles.", tip: "7:08" },
      { front: "Lost in the middle", back: "Les modèles retiennent bien le début et la fin de leur contexte, mais ce qui est au milieu tend à être raté. Des instructions enfouies sous 50 000 tokens de sorties d'outils disparaissent.", tip: "7:50" },
      { front: "MCP (Model Context Protocol)", back: "Une prise standard pour connecter les agents à des systèmes externes. Un serveur MCP pour GitHub, un pour la base de données, un pour Jira. Pratique, mais aussi un piège : trop facile de connecter une tonne d'outils.", tip: "8:18" },
      { front: "Trop d'outils", back: "Un benchmark : un petit modèle llama a échoué avec les 46 outils disponibles, mais a réussi avec seulement 19. Le contexte avait la place, mais le modèle ne raisonnait pas clairement avec autant d'options.", tip: "8:42" },

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous maîtrisez la boucle ReAct, les skills, le constrained decoding, le context engineering et les evals. Vous pouvez construire des agents fiables en production."
          : (correct >= 5 ? "Bases correctes. Revoyez le constrained decoding, les 4 stratégies de context engineering et la multiplication des erreurs." : "Reprenez depuis la boucle ReAct et le simulateur, puis les skills, avant de réessayer.");
        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

      updateExamTimer();

        const certBtn = $("#go-cert");

      }
    }

          <h1>Garantir des sorties fiables : le constrained decoding</h1>
          <p class="lead">
            Même avec les meilleures connaissances, on travaille avec un modèle non-déterministe qui peut faire des erreurs.
            Comment faire confiance à l'agent sur des centaines de cycles ? En commençant par un problème si basique qu'il

          </p>

          <div class="card bad">
            <h3>Le problème</h3>
            <p>Chaque requête d'outil est du texte structuré que votre code doit parser. Imaginez le modèle des centaines de cycles dans une tâche, écrivant une requête de plus — et il oublie une virgule ou une accolade. Votre code bute, le parse échoue, l'outil ne tourne jamais, et la boucle casse juste là. <span class="source">⏱ 5:49</span></p>
            <p>Le modèle génère du texte un token à la fois en suivant une distribution de probabilité. Rien dans ce processus ne sait ce qu'est un JSON valide, à part les patterns appris à l'entraînement.</p>
          </div>

          <div class="grid">
            <div class="card warn">
              <h3>Tentative 1 : demander gentiment</h3>
              <p>De plus en plus fermement, parfois en MAJUSCULES. Ça marche « la plupart du temps » — ce qui est exactement le problème. Tous les quelques centaines de requêtes, le modèle ajoute un petit « Bien sûr, voici votre JSON » avant le JSON, et votre parser échoue quand même. <span class="source">⏱ 6:19</span></p>
            </div>
            <div class="card warn">
              <h3>Tentative 2 : retry logic</h3>
              <p>Attraper l'échec de parse, renvoyer la sortie cassée au modèle, lui demander de corriger. Ça marche aussi. Mais vous payez des appels de modèle supplémentaires juste pour réparer le formatage, et vous n'avez toujours aucune garantie que la retry revienne correcte. <span class="source">⏱ 6:39</span></p>
            </div>
          </div>

          <div class="card good">
            <h3>La vraie solution : constrained decoding</h3>
            <p>Ça se passe <strong>pendant</strong> que le texte est généré. À chaque étape, le modèle a une liste de tous les tokens qu'il pourrait écrire ensuite, chacun avec une probabilité. Le constrained decoding réduit cette liste : avant que le modèle choisisse, le système vérifie quels tokens garderaient le JSON valide, et bloque tous les autres en mettant leur probabilité à zéro. Le modèle choisit toujours par probabilité, mais parmi une liste où les options cassantes sont déjà indisponibles. <span class="source">⏱ 7:08</span></p>

          <h1>Context engineering : la bonne info, au bon format, au bon moment</h1>
          <p class="lead">
            La sortie est plus ou moins réglée. Mais qu'en est-il de ce qui <strong>entre</strong> ? À chaque cycle de la boucle,

          <div class="card warn">
            <h3>Lost in the middle</h3>
            <p>Une équipe de recherche a trouvé que les modèles retiennent bien le début et la fin de leur contexte, mais ce qui est au milieu tend à être raté. Imaginez un agent 20 étapes dans une tâche : les instructions originales sont en haut, enfouies sous 50 000 tokens de sorties d'outils. Ces instructions disparaissent essentiellement. <span class="source">⏱ 7:50</span></p>

          <div class="card warn">
            <h3>Le piège des trop nombreux outils (MCP)</h3>
            <p>Chaque outil que l'agent peut appeler a besoin d'une définition dans le contexte avant même que le travail commence. MCP (Model Context Protocol) est une prise standard pour connecter les agents à des systèmes externes — un serveur pour GitHub, un pour la base de données, un pour Jira. Pratique, mais aussi un piège : ça rend trop facile de connecter une tonne d'outils. Un benchmark : un petit modèle llama a échoué avec les 46 outils disponibles, mais a réussi avec seulement 19. Le contexte avait techniquement la place — le modèle ne raisonnait juste pas clairement avec autant d'options. <span class="source">⏱ 8:42</span></p>
          </div>

          <h2>Les 4 stratégies de LangChain</h2>
          <div class="grid">
            <div class="card info">
              <h3>1. Write (écrire)</h3>
              <p>Donner à l'agent un moyen de sauvegarder des choses hors de la fenêtre : fichiers de notes qu'il met à jour en travaillant, fichiers de règles chargés au début de chaque session pour ne jamais oublier les fondamentaux. <span class="source">⏱ 9:22</span></p>
            </div>
            <div class="card info">
              <h3>2. Select (sélectionner)</h3>
              <p>Donner au modèle ce dont il a besoin pour cette étape, pas tout ce que vous avez. Récupérer seulement les documents pertinents ; pour les outils, chercher sur les descriptions elles-mêmes et ne présenter que la poignée qui compte maintenant. <span class="source">⏱ 9:34</span></p>
            </div>
            <div class="card info">
              <h3>3. Compress (compresser)</h3>

            </div>
            <div class="card info">
              <h3>4. Isolate (isoler)</h3>
              <p>Ce qui fait marcher les systèmes multi-agents. Au lieu d'un agent faisant recherche + planification + code dans une longue conversation, un agent parent confie le sous-tâche sale à un sous-agent avec sa propre fenêtre propre. Le sous-agent creuse et rapporte un court résumé ; tout le bruit reste dans son contexte, sans jamais atteindre le parent. <span class="source">⏱ 10:03</span></p>
            </div>
          </div>

          <div class="card purple">
            <h3>Le point clé</h3>
            <p>À travers tout ça, la boucle centrale reste exactement la même : un modèle qui demande des outils jusqu'à décider qu'il a fini. Le context engineering, c'est juste contrôler ce que le modèle voit à chaque passage. C'est une grande partie de la différence entre un agent démo et un agent qui tourne fiablement très longtemps. <span class="source">⏱ 10:24</span></p>

            <div class="card bad">
              <h3>6. Sauter au multi-agents trop tôt</h3>
              <p>Résistez à l'envie de sauter dans le multi-agents sophistiqué avant d'avoir les fondations : boucle propre, skills, evals.</p>
            </div>
            <div class="card bad">
              <h3>7. Ne lancer qu'une seule fois</h3>
              <p>L'agent est non-déterministe. Un seul run ne dit presque rien. Lancez plusieurs fois, suivez des taux de succès.</p>
            </div>
            <div class="card bad">
              <h3>8. Tracker seulement pass/fail</h3>
              <p>Un tweak qui passe toujours mais double la facture de tokens est une régression. Loggez tokens, coûts, étapes.</p>
            </div>
          </div>

          ${quizHTML([
            { q: "Pourquoi éviter de connecter une tonne d'outils via MCP ?", o: ["Un petit modèle échoue avec 46 outils mais réussit avec 19 — trop d'options nuisent au raisonnement", "C'est trop cher", "C'est interdit"], a: 0, e: "Le contexte avait la place, mais le modèle ne raisonnait pas clairement." },
            { q: "Pourquoi ne pas sauter directement au multi-agents ?", o: ["Il faut d'abord les fondations : boucle propre, skills, evals", "C'est trop difficile", "C'est obsolète"], a: 0, e: "La discipline des fondations avant la sophistication." }
          ], "errors-antipatterns")}

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('errors-antipatterns')">← Précédent</button>
            <button class="btn" onclick="nextFrom('errors-antipatterns')">Examen final →</button>
          </div>
        `
      },
      {
        id: "final", title: "✅ Examen final", express: true,
        content: `
          <h1>Examen final chronométré</h1>
          <p class="lead">10 questions. 8 minutes. Seuil de réussite : 7/10. Objectif : valider que vous pouvez construire et fiabiliser des agents en production.</p>

          <div class="toolbar no-print">
            <button class="btn" id="exam-start" onclick="startExam()">Démarrer le minuteur</button>
            <div id="exam-timer" class="pill">⏱ 8:00</div>
          </div>

          ${finalQuizHTML()}

          <div class="toolbar no-print">
            <button class="btn" onclick="submitExam()">Soumettre l examen</button>
            <button class="btn secondary" id="go-cert" style="display:none" onclick="showSection('action')">Voir certificat →</button>
          </div>
          <div class="result" id="exam-result" aria-live="polite"></div>
        `
      },
      {
        id: "action", title: "🏆 Certificat", express: true,
        content: `
          <h1>Certificat et checklist de production</h1>
          <p class="lead">Générez votre certificat, exportez votre rapport et appliquez la checklist de fiabilité à votre prochain agent.</p>

          <div class="card info no-print">
            <h3>Votre nom pour le certificat</h3>
            <input id="cert-name" placeholder="Prénom / pseudo" />
            <div class="toolbar">
              <button class="btn" onclick="generateCert()">Générer le certificat</button>
              <button class="btn secondary" onclick="exportJSON()">Exporter JSON</button>
              <button class="btn secondary" onclick="window.print()">Imprimer / PDF</button>
              <button class="btn secondary" onclick="resetCourse()">Réinitialiser</button>
            </div>
          </div>

          <div id="certificate" class="certificate">
            <span class="badge">🤖</span>
            <h2>Certificat de maîtrise</h2>
            <p>Décerné à</p>
            <h3 id="cert-name-out">Apprenant</h3>
            <p>pour avoir complété la masterclass</p>
            <p class="highlight">Agents IA : Boucle ReAct, Skills, Constrained Decoding, Context Engineering, Evals</p>
            <p class="muted">Date : <span id="cert-date"></span> • Score : <span id="cert-score"></span> • Niveau : <span id="cert-level"></span></p>
          </div>

          <h2>Checklist de fiabilité en production</h2>
          <div class="card checklist">
            <label><input type="checkbox" id="c1" onchange="toggleCheck('c1')"> La boucle ReAct est implémentée : le modèle continue jusqu'à décider qu'il a fini.</label>
            <label><input type="checkbox" id="c2" onchange="toggleCheck('c2')"> Les outils sont exécutés hors du LLM ; le modèle ne voit que les descriptions et les résultats.</label>
            <label><input type="checkbox" id="c3" onchange="toggleCheck('c3')"> Un skill markdown encode votre expertise pour la tâche principale.</label>
            <label><input type="checkbox" id="c4" onchange="toggleCheck('c4')"> Le constrained decoding garantit les sorties structurées (JSON valide).</label>
            <label><input type="checkbox" id="c5" onchange="toggleCheck('c5')"> Le contexte est géré : Write, Select, Compress, Isolate selon le besoin.</label>
            <label><input type="checkbox" id="c6" onchange="toggleCheck('c6')"> Le nombre d'outils présentés par étape est limité (pas 46).</label>
            <label><input type="checkbox" id="c7" onchange="toggleCheck('c7')"> Les instructions critiques ne sont pas enfouies sous les sorties d'outils.</label>
            <label><input type="checkbox" id="c8" onchange="toggleCheck('c8')"> 20-50 tâches d'eval réelles tirées des échecs passés, avec critères clairs.</label>
            <label><input type="checkbox" id="c9" onchange="toggleCheck('c9')"> Graders en code pour les résultats vérifiables ; LLM judge pour les sorties floues.</label>
            <label><input type="checkbox" id="c10" onchange="toggleCheck('c10')"> Le LLM judge est vérifié contre votre propre notation sur un échantillon.</label>
            <label><input type="checkbox" id="c11" onchange="toggleCheck('c11')"> Chaque tâche est lancée plusieurs fois ; vous suivez des taux de succès.</label>
            <label><input type="checkbox" id="c12" onchange="toggleCheck('c12')"> Tokens, coûts, étapes et appels d'outils sont loggés par tâche.</label>
            <label><input type="checkbox" id="c13" onchange="toggleCheck('c13')"> La suite d'evals tourne sur chaque changement.</label>
          </div>
          <p class="muted small">Checklist : <span id="check-progress">0/13</span></p>

          <h2>Ressources ancrées au transcript</h2>
          <div class="resources">
            <ul>
              <li><strong>Formateur</strong> : senior applied scientist chez Twitch, a coaché des centaines de personnes dans le domaine.</li>
              <li><strong>Concepts clés</strong> : boucle ReAct, tools, skills, constrained decoding, context engineering, evals.</li>
              <li><strong>Exemples du cours</strong> : météo à Seattle (62 et nuageux), vol + calendrier, Supabase agent skills, Claude Code qui compresse à 95%.</li>
              <li><strong>Chiffres à retenir</strong> : 95% par étape × 10 = ~60%, × 20 = ~un tiers ; llama échoue avec 46 outils, réussit avec 19 ; 20-50 tâches d'eval.</li>
              <li><strong>Les 4 stratégies LangChain</strong> : Write, Select, Compress, Isolate.</li>
            </ul>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('action')">← Revenir à l examen</button>
            <button class="btn" onclick="showSection('home')">Retour à l accueil</button>
          </div>
        `
      }
    ];

    function init() {
      loadState();
      document.body.setAttribute("data-theme", STATE.theme);
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      showSection(visibleModules()[0]?.id || "home");
      updateScore();
      updateChecklistProgress();
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.nextReactStep = nextReactStep;
    window.initReactSim = initReactSim;
    window.updateErrorCalc = updateErrorCalc;
    window.chooseScenario = chooseScenario;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;
    window.$ = $;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
</html>
