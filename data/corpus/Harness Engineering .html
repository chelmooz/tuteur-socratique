<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Harness Engineering | Prompt, Context, Loops, Agents</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);

  --transition-fast: 150ms ease;

  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🧰 <span>Harness Engineering</span> Masterclass</div>
        <div class="muted small">Prompt • Context • Loops • Orchestration • Exécution • Agents autonomes</div>
      </div>

      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>

      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "harness-engineering-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { started: false, finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        STATE.theme = data.theme || "dark";
        STATE.visited = new Set(data.visited || []);
        STATE.quizScores = data.quizScores || {};
        STATE.diagnostic = data.diagnostic || null;
        STATE.path = data.path || "masterclass";
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        STATE.certName = data.certName || "";
        STATE.sourcesHidden = !!data.sourcesHidden;
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express", boxId = "") {
      const idAttr = boxId ? ' id="' + boxId + '"' : "";
      return `
        <div class="quiz" data-module="${moduleId}"${idAttr}>
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function codeHTML(label, id, code) {
      return `
        <div class="card">
          <h3>${label}</h3>
          <pre class="code" id="${id}">${code}</pre>
          <button class="btn secondary small" onclick="copyText('${id}', this)">Copier</button>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const total = qs.length;
      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + total;
      STATE.quizScores[moduleId] = { correct, total };
      saveState();
      updateScore();
    }

    function copyText(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.innerText.trim();
      const done = () => {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "✅ Copié";
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      const mods = visibleModules();
      $("#nav").innerHTML = mods.map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">
          ${m.title}
        </button>
      `).join("");

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `
        <section id="${m.id}" class="section">
          ${m.content}
        </section>
      `).join("");
    }

    function showSection(id) {
      const mod = MODULES.find(m => m.id === id);
      if (!mod) return;

      if (STATE.path === "express" && mod.express === false) {
        STATE.path = "masterclass";
        saveState();
        renderNav();
      }

      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));

      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "loops") showLoopStep(0);
      if (id === "autonomy") chooseAutonomy("local");
      if (id === "simulator") simReset();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0;
      let total = 0;
      Object.values(STATE.quizScores).forEach(s => {
        correct += s.correct || 0;
        total += s.total || 0;
      });
      if (STATE.exam.finished) {
        correct += STATE.exam.score;
        total += STATE.exam.total;
      }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() {
      STATE.theme = STATE.theme === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", STATE.theme);
      saveState();
    }

    function toggleSources() {
      STATE.sourcesHidden = !STATE.sourcesHidden;
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      saveState();
    }

    function toggleMobileNav() {
      $("#sidebar").classList.toggle("mobile-open");
    }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }

    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    const DIAG_TEXT = {
      debutant: "Commencez par distinguer prompt, contexte et harness. Ne cherchez pas à construire un système autonome complexe avant de comprendre la boucle.",
      praticien: "Focus sur les loops, le requirement file, la sélection de tâche unique, les tests par itération et l escalade d autonomie.",
      expert: "Analysez les trade-offs : orchestration, coût, latence, vérification, rollback, observabilité, garde-fous d autonomie."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) {
        alert("Répondez aux trois questions du diagnostic.");
        return;
      }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.praticien}</p>
          <p class="muted">Le mode express masque les modules avancés. Vous pouvez basculer en masterclass à tout moment depuis le diagnostic.</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function showLoopStep(step) {
      const steps = [
        {
          title: "1. Requirement file",
          text: "Le harness commence par transformer une intention large en document de exigences. Ce document devient la source de vérité des tâches à accomplir."
        },
        {
          title: "2. Task selection",
          text: "À chaque itération, l agent ne tente pas tout le projet. Il sélectionne une seule tâche claire à compléter."
        },
        {
          title: "3. Fresh context",
          text: "L agent reçoit un contexte propre et ciblé pour la tâche courante, au lieu de traîner un historique résumé et dégradé."
        },
        {
          title: "4. Strict rules",
          text: "Le prompt et l environnement définissent comment démarrer, quoi faire, comment finir, et quand s arrêter."
        },
        {
          title: "5. Execute",
          text: "L agent exécute la tâche avec les outils nécessaires : fichiers, tests, commandes, API, contexte pertinent."
        },
        {
          title: "6. Test and document",
          text: "Chaque étape est vérifiée et documentée. On ne suppose pas qu une feature est finie sans preuve."
        },
        {
          title: "7. Iterate",
          text: "Le loop recommence jusqu à ce que toutes les tâches soient terminées. La progression devient incrémentale et auditable."
        }
      ];

      const title = $("#loop-title");
      const text = $("#loop-text");
      if (!title || !text) return;
      title.textContent = steps[step].title;
      text.textContent = steps[step].text;
      $$("#loop-buttons button").forEach((b, i) => b.classList.toggle("active", i === step));
    }

    function chooseAutonomy(level) {
      const texts = {
        local: "Niveau 1 — Agent local : vous travaillez dans votre IDE ou terminal. Contrôle maximal, mais votre machine doit rester disponible et vous devez superviser chaque étape.",
        concurrent: "Niveau 2 — Agents concurrents : plusieurs agents travaillent en parallèle avec leurs propres contextes. Gain de vitesse, mais risque de conflits, de duplication et de coordination fragile.",
        cloud: "Niveau 3 — Cloud agent : le job continue même si vous fermez votre poste. L agent peut créer une pull request. Il faut alors une revue humaine, des permissions strictes et un environnement isolé.",
        slack: "Niveau 4 — Déclenchement par message : une demande arrive via Slack ou un autre canal, l agent lance un cloud job et notifie à la fin. Utile en équipe, mais exige audit, ownership et garde-fous.",
        scheduled: "Niveau 5 — Automation planifiée : le système vérifie périodiquement une source et agit seul. Puissant, mais dangereux sans tests, rollback, notifications, budget max et critères d échec."
      };

      const out = $("#autonomy-out");
      if (out) out.textContent = texts[level] || texts.local;
      $$("#autonomy-buttons button").forEach(b => b.classList.toggle("active", b.dataset.level === level));
    }

    function simReset() {
      const log = $("#sim-log");
      const result = $("#sim-result");
      if (log) log.textContent = "Simulateur prêt. Choisissez un mode d exécution pour comparer les résultats sur une tâche large : cloner un site web.";
      if (result) result.textContent = "En attente de simulation.";
    }

    function simRun(mode) {
      const log = $("#sim-log");
      const result = $("#sim-result");
      if (!log || !result) return;

      if (mode === "prompt") {
        log.textContent = [
          "MODE PROMPT ONE-SHOT",
          "1. L utilisateur demande : clone entire website.",
          "2. Le modèle répond en une seule passe.",
          "3. Il génère une structure apparente.",
          "4. Certains boutons ne fonctionnent pas.",
          "5. Les features ne sont pas testées.",
          "6. Aucune vérification incrémentale n existe."
        ].join("\n");
        result.textContent = "Verdict : rapide à lancer, mais résultat sketchy. Le modèle ne peut pas tenir un scope énorme dans une seule réponse fiable.";
      }

      if (mode === "context") {
        log.textContent = [
          "MODE CONTEXT ENGINEERING",
          "1. L agent charge des fichiers pertinents via tool calling.",
          "2. Il connecte des sources avec RAG ou MCP.",
          "3. Il commence à travailler sur plusieurs parties du site.",
          "4. Le contexte se remplit.",
          "5. Le système résume pour continuer.",
          "6. Le résumé perd des détails critiques.",
          "7. L agent suppose que certaines pages sont finies.",
          "8. Des features restent partielles ou non vérifiées."
        ].join("\n");
        result.textContent = "Verdict : meilleur que le one-shot, mais toujours limité sur les tâches longues. L agent devient dépendant de sa capacité à résumer son propre travail.";
      }

      if (mode === "harness") {
        log.textContent = [
          "MODE HARNESS ENGINEERING",
          "1. Le harness génère un requirement file complet.",
          "2. Les exigences sont découpées en tâches.",
          "3. Itération 1 : sélectionner Home page.",
          "4. Contexte frais + règles de démarrage et de fin.",
          "5. Exécution, test, documentation.",
          "6. Itération 2 : sélectionner Authentication.",
          "7. Contexte frais + règles + outils pertinents.",
          "8. Exécution, test, documentation.",
          "9. Itérations suivantes : Dashboard, Billing, Tests, Déploiement.",
          "10. Le loop continue jusqu à complétion vérifiée."
        ].join("\n");
        result.textContent = "Verdict : architecture plus robuste. L agent ne porte pas tout le projet dans sa tête ; le harness porte la structure, la mémoire de progression et les critères de sortie.";
      }
    }

    function generateHarnessSpec() {
      const project = $("#hs-project")?.value || "Application web";
      const goal = $("#hs-goal")?.value || "Livrer une fonctionnalité complète et testée";
      const stack = $("#hs-stack")?.value || "TypeScript, React, Node, Supabase";
      const constraints = $("#hs-constraints")?.value || "Tests unitaires, CI, sécurité, accessibilité";
      const success = $("#hs-success")?.value || "Toutes les tâches sont passantes, documentées et reviewables";
      const autonomy = $("#hs-autonomy")?.value || "cloud";
      const loop = $("#hs-loop")?.value || "une tâche par itération";

      const spec = `# Harness Spec — ${project}

## Objectif
${goal}

## Stack
${stack}

## Contraintes
${constraints}

## Critères de succès
${success}

## Niveau d autonomie
${autonomy}

## Protocole de boucle
${loop}

## 1. Couche Prompt Engineering
Définir le rôle de l agent, le ton, les interdits et le format de sortie attendu.
Le prompt reste important, mais il ne porte plus seul la complexité du système.

## 2. Couche Context Engineering
Charger uniquement le contexte pertinent pour la tâche courante :
- fichiers concernés ;
- outils ;
- documentation interne ;
- résultats de tests ;
- historique minimal nécessaire.

## 3. Couche Harness Engineering
Le harness orchestre l exécution :
- générer un requirement file ;
- découper en tâches atomiques ;
- sélectionner une tâche par itération ;
- fournir un contexte frais ;
- imposer des règles de start et finish ;
- exécuter ;
- tester ;
- documenter ;
- passer à la tâche suivante.

## 4. Gardes-fous
- plafond de tokens et de coûts ;
- timeout par tâche ;
- interdiction de déclarer une feature finie sans test ;
- journalisation des décisions ;
- rollback possible ;
- revue humaine pour les actions sensibles.

## 5. Sortie attendue
Un rapport final contenant :
- tâches accomplies ;
- preuves de tests ;
- fichiers modifiés ;
- limitations restantes ;
- prochaines étapes.`;

      const out = $("#hs-out");
      if (out) {
        out.textContent = spec;
        out.style.display = "block";
      }
      const copy = $("#hs-copy");
      if (copy) copy.style.display = "inline-flex";
    }

    const FLASHCARDS = [
      { front: "Harness Engineering", back: "Ingénierie de l environnement autour de l agent : orchestration, exécution, gestion de contexte, boucles, règles de start/finish.", tip: "0:00" },
      { front: "Prompt Engineering", back: "Définit qui est l agent, son persona, ses instructions et son format de réponse. Toujours utile, mais devient une couche inférieure.", tip: "6:54" },
      { front: "Context Engineering", back: "Gère la fenêtre de contexte avec tool calling, MCP, RAG, fichiers pertinents et actions externes.", tip: "1:00" },
      { front: "Tool calling", back: "Permet à l agent d explorer un repo, lire des fichiers spécifiques et créer des actions externes.", tip: "1:11" },
      { front: "MCP", back: "Ajoute des fonctionnalités vendor-specific au-dessus du modèle.", tip: "1:21" },
      { front: "RAG", back: "Connecte des bases personnalisées pour rendre des données disponibles à la demande.", tip: "1:26" },
      { front: "Context summarization", back: "Technique de compression du contexte quand il se remplit. Utile, mais dangereuse sur les tâches longues.", tip: "2:52" },
      { front: "Limite du résumé", back: "L agent devient dépendant de sa capacité à résumer son travail précédent ; il peut croire qu une tâche est finie.", tip: "3:13" },
      { front: "Loops", back: "Changement critique du harness : itérations avec contexte frais et règles strictes de démarrage et de fin.", tip: "5:57" },
      { front: "Requirement file", back: "Document large généré au début pour découper le projet en tâches exploitables.", tip: "7:18" },
      { front: "One task per iteration", back: "À chaque boucle, l agent sélectionne une seule tâche à compléter, teste et documente.", tip: "7:23" },
      { front: "Ralph", back: "Exemple cité d architecture simple et efficace basée sur requirement document, JSON tasks et loop d implémentation.", tip: "6:23" },
      { front: "Cloud agent", back: "Agent exécuté hors du poste local, capable de continuer après fermeture du client et de créer une PR.", tip: "5:22" },
      { front: "Scheduled automation", back: "Niveau d autonomie élevé : l agent agit périodiquement sans déclenchement manuel. Nécessite des garde-fous forts.", tip: "5:51" }
    ];

    function renderFlashcard() {
      const card = $("#flashcard");
      if (!card) return;

      if (STATE.exam.finished) return;
      STATE.exam.started = true;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";

        if (!selected) {
          q.classList.add("incorrect");
          return;
        }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");

        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = "";
        if (STATE.exam.passed) {
          advice = "Vous pouvez concevoir un harness simple : requirement file, boucle, contexte frais, test, documentation, escalade d autonomie contrôlée.";
        } else if (correct >= 5) {
          advice = "Bases solides. Revoyez les limites du context summarization, le rôle des loops et les garde-fous d autonomie.";
        } else {
          advice = "Reprenez la distinction prompt / context / harness, puis le simulateur de boucle.";
        }
        res.innerHTML = `
          <strong>Résultat : ${correct}/${qs.length}</strong><br>
          ${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br>
          <span class="muted">${advice}</span>
        `;
      }

      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      const first = visibleModules()[0]?.id || "home";
      showSection(first);
      updateScore();
      updateChecklistProgress();

      $$("#nav button").forEach(btn => {
        btn.addEventListener("click", () => showSection(btn.dataset.target));
      });
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.copyText = copyText;
    window.showLoopStep = showLoopStep;
    window.chooseAutonomy = chooseAutonomy;
    window.simRun = simRun;
    window.simReset = simReset;
    window.generateHarnessSpec = generateHarnessSpec;
    window.renderFlashcard = renderFlashcard;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
</html>
