    // ==========================================
    // ÉTAT ET UTILITAIRES
    // ==========================================
    let currentModuleIndex = 0;
    let score = 0;
    let totalQuizQuestions = 0;
    let visitedModules = new Set();

    function $(sel) { return document.querySelector(sel); }
    function $$(sel) { return document.querySelectorAll(sel); }

    function init() {
      // Charger le thème
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.body.setAttribute('data-theme', savedTheme);
      
      // Charger la progression
      const savedProgress = localStorage.getItem('rag_progress');
      if (savedProgress) {
        visitedModules = new Set(JSON.parse(savedProgress));
      }
      
      // Charger la checklist
      const savedChecks = localStorage.getItem('rag_checklist');
      if (savedChecks) {
        const checks = JSON.parse(savedChecks);
        for (let i = 1; i <= 5; i++) {
          const el = $(`#check${i}`);
          if (el && checks[i-1]) el.checked = true;
        }
      }

      renderNav();
      showModule(0);
      updateProgress();
    }

    function renderNav() {
      const nav = $('#nav');
      nav.innerHTML = COURSE_DATA.modules.map((m, i) => `
        <button data-index="${i}" class="${visitedModules.has(m.id) ? 'completed' : ''}" onclick="showModule(${i})">
          ${m.title}
        </button>
      `).join('');
    }

    function showModule(index) {
      currentModuleIndex = index;
      const module = COURSE_DATA.modules[index];
      
      // Marquer comme visité
      visitedModules.add(module.id);
      localStorage.setItem('rag_progress', JSON.stringify([...visitedModules]));
      
      // Mise à jour UI
      $$('.section').forEach(s => s.classList.remove('active'));
      $$('#nav button').forEach(b => b.classList.remove('active'));
      
      // Injection du contenu si pas déjà rendu (pour garder l'état des quiz, on pourrait optimiser, mais ici on réinjecte)
      // Pour une app simple, on régénère le HTML du module actif
      const contentDiv = $('#content');
      contentDiv.innerHTML = `<div class="section active">${module.content}</div>`;
      
      $$('#nav button')[index].classList.add('active');
      renderNav(); // Pour mettre à jour les coches
      updateProgress();
      
      // Scroll top
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      // Mobile : fermer le menu
      $('#sidebar').classList.remove('mobile-open');
    }

    function nextModule() {
      if (currentModuleIndex < COURSE_DATA.modules.length - 1) {
        showModule(currentModuleIndex + 1);
      }
    }

    function prevModule() {
      if (currentModuleIndex > 0) {
        showModule(currentModuleIndex - 1);
      }
    }

    function updateProgress() {
      const pct = Math.round((visitedModules.size / COURSE_DATA.modules.length) * 100);
      $('#progressBar').style.width = pct + '%';
      
      // Calculer le score global des quiz validés
      const correctAnswers = $$('.q-option.correct').length;
      // Total des questions uniques (simplifié pour cette démo)
      $('#scoreDisplay').textContent = `Progression: ${pct}%`;
    }

    // ==========================================
    // INTERACTIONS SPÉCIFIQUES
    // ==========================================
    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function toggleMobileNav() {
      $('#sidebar').classList.toggle('mobile-open');
    }

    function processDiagnostic() {
      // Simulation de personnalisation
      nextModule();
    }

    function generatePrompt() {
      const role = $('#p-role').value;
      const mission = $('#p-mission').value;
      const tools = $('#p-tools').value;
      const format = $('#p-format').value;
      
      const prompt = `# Rôle
Tu es ${role}.

# Mission
${mission}

# Outils à ta disposition
- ${tools}

# Contraintes de format et de ton
${format}

# Instructions de raisonnement
1. Analyse la demande de l'utilisateur.
2. Utilise l'outil de recherche vectorielle pour trouver les informations pertinentes.
3. Si les résultats sont nombreux, utilise le Reranker pour identifier les top 3 extraits les plus pertinents.
4. Formule ta réponse en te basant uniquement sur ces extraits.
5. Cite ta source (nom du document ou date) si applicable.`;

      $('#prompt-result').textContent = prompt;
      $('#prompt-result').style.display = 'block';
      $('#copy-btn').style.display = 'inline-flex';
    }

    function copyPrompt() {
      const text = $('#prompt-result').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = $('#copy-btn');
        const original = btn.textContent;
        btn.textContent = '✅ Copié !';
        setTimeout(() => btn.textContent = original, 2000);
      });
    }

    function checkScenario(el, isCorrect) {
      // Reset styles
      $$('.simulator .q-option').forEach(opt => {
        opt.classList.remove('correct', 'incorrect');
        opt.style.pointerEvents = 'none';
      });
      
      const feedback = $('#sim-feedback');
      if (isCorrect) {
        el.classList.add('correct');
        feedback.className = 'feedback-box success';
        feedback.innerHTML = '<strong>✅ Excellente analyse !</strong><br>C\'est exactement la puissance du RAG agentique : combiner la recherche sémantique avec des filtres de métadonnées (ville, note) pour obtenir des insights actionnables, et non juste du texte générique.';
      } else {
        el.classList.add('incorrect');
        feedback.className = 'feedback-box error';
        feedback.innerHTML = '<strong>❌ Pas optimal.</strong><br>Un agent RAG doit exploiter les métadonnées (ville, catégorie, note) pour filtrer la base vectorielle et fournir une analyse contextuelle, pas une réponse générique ou manuelle.';
      }
    }

    function checkFinalQuiz() {
      let currentScore = 0;
      const q1 = $('input[name="q1"]:checked');
      const q2 = $('input[name="q2"]:checked');
      const q3 = $('input[name="q3"]:checked');
      
      if (!q1 || !q2 || !q3) {
        alert('Veuillez répondre à toutes les questions.');
        return;
      }
      
      // Validation
      [q1, q2, q3].forEach(q => {
        const parent = q.closest('.q-item');
        const explain = parent.querySelector('.explain');
        const options = parent.querySelectorAll('.q-option');
        
        options.forEach(opt => {
          const input = opt.querySelector('input');
          if (input.value === "1") {
            opt.classList.add('correct');
          } else if (input.checked && input.value === "0") {
            opt.classList.add('incorrect');
          }
        });
        
        explain.style.display = 'block';
        if (q.value === "1") currentScore++;
      });
      
      const resultDiv = $('#final-result');
      resultDiv.textContent = `Résultat : ${currentScore}/3`;
      
      if (currentScore === 3) {
        resultDiv.style.color = 'var(--green)';
        showCertificate(currentScore);
      } else {
        resultDiv.style.color = 'var(--yellow)';
        resultDiv.textContent += ' - Relisez les explications et réessayez !';
      }
      
      updateProgress();
    }

    function showCertificate(score) {
      $('#cert-block').classList.add('show');
      $('#cert-date').textContent = new Date().toLocaleDateString('fr-FR');
      $('#cert-score').textContent = `${score}/3`;
      // Scroll vers le certificat
      setTimeout(() => {
        $('#cert-block').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 500);
    }

    function saveChecklist() {
      const checks = [];
      for (let i = 1; i <= 5; i++) {
        checks.push($(`#check${i}`).checked);
      }
      localStorage.setItem('rag_checklist', JSON.stringify(checks));
    }

    function resetCourse() {
      if (confirm('Voulez-vous vraiment réinitialiser votre progression ?')) {
        localStorage.removeItem('rag_progress');
        localStorage.removeItem('rag_checklist');
        visitedModules.clear();
        showModule(0);
        // Recharger la page pour nettoyer les états de quiz
        location.reload();
      }
    }

    // Initialisation
    document.addEventListener('DOMContentLoaded', init);
  </script>
<script src="/course-kit.js"></script>
</body>
</html>
