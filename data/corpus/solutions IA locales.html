<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Ollama | LLMs Locaux, RAG & Agents IA</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🦙 <span>Ollama</span> Masterclass</div>
        <div class="muted small">LLMs locaux • Modelfile • REST API • Python • RAG • Agents</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "ollama-premium-masterclass-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false,
      cli: { installed: ["llama3.2:latest"], log: [] }
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden,
          cli: STATE.cli
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
        if (data.cli) STATE.cli = data.cli;
      } catch (e) {}
    }

    function esc(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function quizHTML(items, moduleId, title = "Quiz express", boxId = "") {
      const idAttr = boxId ? ' id="' + boxId + '"' : "";
      return `
        <div class="quiz" data-module="${moduleId}"${idAttr}>
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function codeHTML(label, id, code) {
      return `
        <div class="card">
          <h3>${label}</h3>
          <pre class="code" id="${id}">${code}</pre>
          <button class="btn secondary small" onclick="copyText('${id}', this)">Copier</button>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function copyText(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.innerText.trim();
      const done = () => {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "✅ Copié";
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else fallbackCopy(text, done);
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "cli") renderTerminal();
      if (id === "rag-project") resetRagSim();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    const DIAG_TEXT = {
      debutant: "Suivez l ordre des modules : installation, CLI, choix de modèles, puis le premier projet Grocery Organizer avant de toucher au RAG.",
      praticien: "Passez rapidement aux modules Modelfile, REST API et Python, puis concentrez-vous sur les projets RAG et agence de recrutement IA.",
      expert: "Allez directement aux projets avancés : RAG avec LangChain + ChromaDB, orchestration multi-agents, puis sécurisez la mise en production."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.praticien}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ SÉLECTEUR DE MODÈLES ============
    const MODEL_CATALOG = {
      "llama3.2:latest": { name: "llama3.2 (3B)", size: "2.0 GB", best: "Tâches générales, instructions, résumé, tool use", needs: "Ressources moyennes" },
      "llama3.2:1b": { name: "llama3.2:1b", size: "1.3 GB", best: "Edge devices, multilingue, tâches légères", needs: "Ressources faibles" },
      "codellama:7b": { name: "codellama:7b", size: "3.8 GB", best: "Génération et complétion de code", needs: "Ressources moyennes" },
      "llava:7b": { name: "llava:7b", size: "4.7 GB", best: "Multimodal : images + texte", needs: "Ressources moyennes" },
      "nomic-embed-text": { name: "nomic-embed-text", size: "274 MB", best: "Embeddings pour systèmes RAG", needs: "Ressources faibles" },
      "mistral:7b": { name: "mistral:7b", size: "4.1 GB", best: "Génération générale équilibrée", needs: "Ressources moyennes" }
    };

    function selectModel() {
      const usecase = $("#ms-usecase").value;
      const resources = $("#ms-resources").value;
      let rec = "", why = "";

      if (usecase === "rag") {
        rec = "nomic-embed-text + llama3.2:latest";
        why = "Pour un RAG il faut deux modèles : un modèle d embedding (nomic-embed-text, léger, grande fenêtre) et un LLM pour la génération (llama3.2). C est exactement l architecture du projet PDF RAG du cours.";
      } else if (usecase === "images") {
        rec = "llava:7b";
        why = "LLaVA est un modèle multimodal entraîné pour comprendre images et texte. Le cours l utilise pour décrire une photo de fleurs et répondre à des questions de suivi.";
      } else if (usecase === "code") {
        rec = "codellama:7b";
        why = "CodeLlama est spécialisé en complétion et génération de code (fill-in-the-middle, génération). Le cours teste avec une fonction Python hello world.";
      } else if (usecase === "texte" && resources === "faible") {
        rec = "llama3.2:1b";
        why = "Le variant 1B (1.3 GB) est conçu pour tourner sur edge et reste compétitif pour les tâches légères : gestion d infos personnelles, retrieval multilingue, rewriting.";
      } else if (usecase === "texte") {
        rec = "llama3.2:latest (3B)";
        why = "Le 3B est le défaut recommandé : bon équilibre performance / ressources. Il surpasse des modèles plus anciens sur instructions, résumé, rewriting et tool use.";
      } else {
        rec = "mistral:7b";
        why = "Bon modèle généraliste équilibré à tester. Le cours insiste : testez plusieurs modèles, il n y a pas de modèle universel.";
      }

      const m = MODEL_CATALOG[rec.split(" + ")[0]] || {};
      const out = $("#ms-out");
      if (out) {
        out.style.display = "block";
        out.textContent =
          "MODÈLE RECOMMANDÉ : " + rec + "\n" +
          (m.size ? "Taille : " + m.size + "\n" : "") +
          (m.best ? "Points forts : " + m.best + "\n" : "") +
          "\nPOURQUOI :\n" + why +
          "\n\nRÈGLE DU COURS : il n y a pas de modèle universel. Testez, comparez, puis gardez celui qui fonctionne pour VOTRE cas d usage. Swapper un modèle dans Ollama ne demande qu une ligne de configuration.";
      }
    }

    // ============ SIMULATEUR CLI ============
    function renderTerminal() {
      const log = $("#cli-log");
      if (!log) return;
      log.innerHTML = STATE.cli.log.map(l => `<span class="${l.cls || ""}">${esc(l.text)}</span>`).join("\n");
      log.scrollTop = log.scrollHeight;
    }

    function cliPrint(text, cls) {
      STATE.cli.log.push({ text, cls: cls || "" });
      if (STATE.cli.log.length > 120) STATE.cli.log = STATE.cli.log.slice(-120);
      renderTerminal();
    }

    function runCli(input) {
      const cmd = (input.value || "").trim();
      if (!cmd) return;
      input.value = "";
      cliPrint("$ " + cmd, "info");

      const parts = cmd.split(/\s+/);
      const base = parts[0].toLowerCase();

      if (base !== "ollama") { cliPrint("commande non reconnue. Essayez : ollama list", "err"); saveState(); return; }
      const action = (parts[1] || "").toLowerCase();
      const target = parts.slice(2).join(" ");

      if (action === "list") {
        if (STATE.cli.installed.length === 0) { cliPrint("aucun modèle installé", "info"); }
        else {
          cliPrint("NAME                    SIZE", "info");
          STATE.cli.installed.forEach(m => {
            const info = MODEL_CATALOG[m] || { size: "?" };
            cliPrint(m.padEnd(24) + (info.size || "?"), "ok");
          });
        }
      } else if (action === "pull") {
        if (!target) { cliPrint("usage : ollama pull <model>", "err"); }
        else if (!MODEL_CATALOG[target]) { cliPrint("modèle inconnu. Disponibles : " + Object.keys(MODEL_CATALOG).join(", "), "err"); }
        else if (STATE.cli.installed.includes(target)) { cliPrint("déjà installé", "info"); }
        else {
          STATE.cli.installed.push(target);
          cliPrint("pulling manifest...", "info");
          cliPrint("success : " + target + " téléchargé localement", "ok");
        }
      } else if (action === "run") {
        if (!target) { cliPrint("usage : ollama run <model>", "err"); }
        else if (!STATE.cli.installed.includes(target)) { cliPrint("modèle non installé. Faites d abord : ollama pull " + target, "err"); }
        else {
          cliPrint(">>> session ouverte avec " + target, "ok");
          if (target === "llava:7b") cliPrint("(modèle multimodal : vous pouvez lui passer une image)", "info");
          if (target === "nomic-embed-text") cliPrint("(modèle d embeddings : plutôt utilisé via API, pas en chat)", "info");
          cliPrint(">>> tapez /bye pour sortir", "info");
        }
      } else if (action === "rm" || action === "remove") {
        if (!target) { cliPrint("usage : ollama rm <model>", "err"); }
        else if (!STATE.cli.installed.includes(target)) { cliPrint("modèle non trouvé", "err"); }
        else {
          STATE.cli.installed = STATE.cli.installed.filter(m => m !== target);
          cliPrint("supprimé : " + target, "ok");
        }
      } else if (action === "show") {
        if (!target) { cliPrint("usage : ollama show <model>", "err"); }
        else if (!STATE.cli.installed.includes(target)) { cliPrint("modèle non installé", "err"); }
        else {
          const info = MODEL_CATALOG[target] || {};
          cliPrint("architecture  llama", "info");
          cliPrint("parameters    " + (info.name || target), "info");
          cliPrint("taille        " + (info.size || "?"), "info");
          cliPrint("usage         " + (info.best || "-"), "info");
        }
      } else if (action === "help") {
        cliPrint("Commandes disponibles dans ce simulateur :", "info");
        cliPrint("  ollama list | pull <model> | run <model> | rm <model> | show <model>", "info");
      } else {
        cliPrint("action inconnue. Essayez : ollama help", "err");
      }
      saveState();
    }

    // ============ ATELIER MODELFILE ============
    function generateModelfile() {
      const base = $("#mf-base").value;
      const temp = $("#mf-temp").value;
      const persona = $("#mf-persona").value || "assistant concis";
      const name = ($("#mf-name").value || "mon-modele").toLowerCase().replace(/[^a-z0-9-]/g, "-");

      const modelfile = `FROM ${base}

PARAMETER temperature ${temp}

SYSTEM """
Tu es ${persona}. Réponds de manière concise et informative.
"""`;

      const out = $("#mf-out");
      if (out) {
        out.style.display = "block";
        out.textContent =
          "# Modelfile\n" + modelfile +
          "\n\n# Commande pour créer le modèle personnalisé :\n" +
          "ollama create " + name + " -f Modelfile" +
          "\n\n# Commande pour l utiliser :\n" +
          "ollama run " + name;
      }
      const copy = $("#mf-copy");
      if (copy) copy.style.display = "inline-flex";
    }

    // ============ CONSTRUCTEUR REST API ============
    function buildRestRequest() {
      const endpoint = $("#ra-endpoint").value;
      const model = $("#ra-model").value;
      const prompt = $("#ra-prompt").value || "Pourquoi le ciel est bleu ?";

      const curl = endpoint === "generate"
        ? `curl http://localhost:11434/api/generate -d '{
  "model": "${model}",
  "prompt": "${prompt}",
  "stream": false
}'`
        : `curl http://localhost:11434/api/chat -d '{
  "model": "${model}",
  "messages": [
    { "role": "user", "content": "${prompt}" }
  ],
  "stream": false
}'`;

      const py = endpoint === "generate"
        ? `import requests, json

url = "http://localhost:11434/api/generate"
data = {"model": "${model}", "prompt": "${prompt}", "stream": False}

response = requests.post(url, json=data)
if response.status_code == 200:
    print(json.loads(response.text)["response"])`
        : `import ollama

response = ollama.chat(
    model="${model}",
    messages=[{"role": "user", "content": "${prompt}"}]
)
print(response["message"]["content"])`;

      const out = $("#ra-out");
      if (out) {
        out.style.display = "block";
        out.textContent = "# CURL (REST API)\n" + curl + "\n\n# PYTHON\n" + py +
          "\n\n# NOTES :\n" +
          "- Ollama sert localement sur localhost:11434 en arrière-plan.\n" +
          "- stream:false évite la réponse en morceaux. Par défaut stream est true.\n" +
          "- /api/generate = une seule génération. /api/chat = conversation avec messages.";
      }
      const copy = $("#ra-copy");
      if (copy) copy.style.display = "inline-flex";
    }

    // ============ SIMULATEUR RAG ============
    let ragStep = 0;
    const RAG_STEPS = [
      { title: "1. Chargement du document", text: "Le PDF (ex : BOI filing instructions) est chargé avec un loader LangChain. Le texte brut est extrait." },

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous pouvez installer Ollama, choisir un modèle, construire un RAG local et structurer une application multi-agents."
          : (correct >= 5 ? "Bases solides. Revoyez les paramètres de modèles, le Modelfile et le pipeline RAG." : "Reprenez les fondamentaux : installation, CLI, puis le module RAG avant de réessayer.");
        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

      updateExamTimer();
      if (STATE.exam.finished) {

MODEL = "llama3.2"
INPUT_PATH = "data/grocery_list.txt"

# 1. Vérifier que le fichier existe

# 2. Lire les items

# 3. Le prompt dirige le modèle
prompt = f"""
You are an assistant that categorizes and sorts grocery items.
Here is a list of groceries: {items}
Please:
1. Categorize these items into appropriate categories (Produce, Dairy, Meat, Bakery, Beverages, etc.)
2. Sort the items alphabetically within each category
3. Present the categorized list clearly using bullet points
"""

# 4. Générer avec Ollama
response = ollama.generate(model=MODEL, prompt=prompt)
generated_text = response["response"]

# 5. Sauvegarder
with open(OUTPUT_PATH, "w") as f:
    f.write(generated_text)
print("Categorized grocery list has been saved")`)}

from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_ollama import OllamaEmbeddings, ChatOllama
from langchain_chroma import Chroma
from langchain.retrievers import MultiQueryRetriever
from langchain_core.prompts import ChatPromptTemplate, PromptTemplate
from langchain_core.output_parsers import StrOutputParser
from langchain_core.runnables import RunnablePassthrough

MODEL = "llama3.2"
EMBED_MODEL = "nomic-embed-text"
DOC_PATH = "data/boi.pdf"

# 1. Charger le PDF
loader = UnstructuredPDFLoader(file_path=DOC_PATH)
data = loader.load()

# 2. Découper en chunks (1200 caractères, overlap 300)
splitter = RecursiveCharacterTextSplitter(chunk_size=1200, chunk_overlap=300)
chunks = splitter.split_documents(data)

# 3 + 4. Embeddings + stockage vectoriel
embeddings = OllamaEmbeddings(model=EMBED_MODEL)
vector_db = Chroma.from_documents(
    documents=chunks,
    embedding=embeddings,
    collection_name="simple-rag"
)

# 5. LLM local
llm = ChatOllama(model=MODEL)

# 6. Retrieval multi-questions
QUERY_PROMPT = PromptTemplate(
    input_variables=["question"],
    template="Generate five different versions of the given user question "
             "to retrieve relevant documents. Original question: {question}"
)
retriever = MultiQueryRetriever.from_llm(
    retriever=vector_db.as_retriever(),
    llm=llm,
    prompt=QUERY_PROMPT
)

# 7. Chaîne RAG
template = "Answer the question based only on the following context: {context}\\nQuestion: {question}"
prompt = ChatPromptTemplate.from_template(template)

chain = (
    {"context": retriever, "question": RunnablePassthrough()}
    | prompt
    | llm
    | StrOutputParser()
)

print(chain.invoke("What is the document about?"))`)}

          <div class="grid">
            <div class="card bad">
              <h3>1. Prendre le plus gros modèle</h3>
              <p>Un 405B pèse 229 GB et exige une machine énorme. Pour la plupart des usages, 3B à 8B suffisent.</p>
            </div>
            <div class="card bad">
              <h3>2. Négliger l espace disque</h3>
              <p>Les modèles font plusieurs GB. Le cours recommande ~10 GB libres minimum et nettoie les modèles inutilisés avec ollama rm.</p>
            </div>
            <div class="card bad">
              <h3>3. Croire aveuglément le modèle</h3>
              <p>Le cours montre une réponse factuellement fausse (une péninsule inventée). Les LLMs ne sont pas toujours corrects : vérifiez. <span class="source">⏱ 1:04:29</span></p>
            </div>
            <div class="card bad">
              <h3>4. Oublier stream:false</h3>
              <p>Sans ce paramètre, la REST API renvoie un flux brut mot par mot, difficile à exploiter.</p>
            </div>
            <div class="card bad">
              <h3>5. RAG sans modèle d embedding adapté</h3>
              <p>Un LLM généraliste ne produit pas les embeddings. Il faut un modèle dédié comme nomic-embed-text.</p>
            </div>
            <div class="card bad">
              <h3>6. Prompt flou</h3>
              <p>Dans le grocery organizer comme dans l agence IA, des instructions directes et concises font toute la qualité de la sortie.</p>
            </div>
          </div>
