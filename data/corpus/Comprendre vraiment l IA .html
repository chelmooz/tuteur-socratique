<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterclass Premium : Fondamentaux IA | Réseaux de Neurones, Tokens, Embeddings, Attention, Transformers, LLMs</title>
<link rel="stylesheet" href="/course-kit.css">
<style>
:root {
  --bg: #07111f;
  --bg-elevated: #0d1b2c;
  --panel: #101f33;
  --panel-hover: #152a41;
  --line: #27415f;
  --line-soft: rgba(148,163,184,0.10);
  --txt: #eef6ff;
  --txt-dim: #94a3b8;
  --muted: #64748b;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.28);
  --accent-2: #22d3ee;
  --accent-2-soft: rgba(34,211,228,0.12);
  --ok: #22c55e;
  --ok-soft: rgba(34,197,94,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.12);
  --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-base: 16px;
  --leading: 1.6;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 14px 40px rgba(0,0,0,0.4);
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;
}
</style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">🧠 <span>Core AI Concepts</span> Masterclass</div>
        <div class="muted small">Neurones • Training • Tokens • Embeddings • Attention • Transformers • Contexte • Scaling • LLMs</div>
      </div>
      <div class="progress-wrap">
        <div class="muted small">Progression : <span id="progressText">0%</span> • <span id="scoreDisplay">Score 0/0</span></div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
      <div class="controls no-print">
        <button class="icon-btn" onclick="toggleSources()" title="Afficher / masquer les références au transcript">⏱</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Thème sombre / clair">🌓</button>
        <button class="icon-btn" onclick="toggleMobileNav()" title="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <nav id="nav" aria-label="Navigation du cours"></nav>
    </aside>
    <main id="content"></main>
  </div>

  <script>
    const KEY = "core-ai-concepts-premium-v1";

    const STATE = {
      theme: "dark",
      visited: new Set(),
      quizScores: {},
      diagnostic: null,
      path: "masterclass",
      flash: { index: 0, known: new Set() },
      checklist: {},
      exam: { finished: false, score: 0, total: 10, passed: false, remaining: 480, interval: null },
      certName: "",
      sourcesHidden: false
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          theme: STATE.theme,
          visited: [...STATE.visited],
          quizScores: STATE.quizScores,
          diagnostic: STATE.diagnostic,
          path: STATE.path,
          flash: { index: STATE.flash.index, known: [...STATE.flash.known] },
          checklist: STATE.checklist,
          exam: { finished: STATE.exam.finished, score: STATE.exam.score, total: STATE.exam.total, passed: STATE.exam.passed },
          certName: STATE.certName,
          sourcesHidden: STATE.sourcesHidden
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.assign(STATE, {
          theme: data.theme || "dark",
          visited: new Set(data.visited || []),
          quizScores: data.quizScores || {},
          diagnostic: data.diagnostic || null,
          path: data.path || "masterclass",
          certName: data.certName || "",
          sourcesHidden: !!data.sourcesHidden
        });
        STATE.flash.index = data.flash?.index || 0;
        STATE.flash.known = new Set(data.flash?.known || []);
        STATE.checklist = data.checklist || {};
        if (data.exam) {
          STATE.exam.finished = !!data.exam.finished;
          STATE.exam.score = data.exam.score || 0;
          STATE.exam.total = data.exam.total || 10;
          STATE.exam.passed = !!data.exam.passed;
        }
      } catch (e) {}
    }

    function quizHTML(items, moduleId, title = "Quiz express") {
      return `
        <div class="quiz" data-module="${moduleId}">
          <h3>${title}</h3>
          ${items.map((item, i) => `
            <div class="q" data-answer="${item.a}">
              <p class="q-text">${i + 1}. ${item.q}</p>
              ${item.o.map((opt, j) => `
                <label class="q-option">
                  <input type="radio" name="${moduleId}-q${i}" value="${j}">
                  ${opt}
                </label>
              `).join("")}
              <div class="explain">${item.e || ""}</div>
            </div>
          `).join("")}
          <button class="btn" onclick="checkQuiz(this)">Vérifier mes réponses</button>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function switchTab(btn, panelId) {
      const root = btn.closest(".tabs");
      $$(".tab-btn", root).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-panel", root).forEach(p => p.classList.toggle("active", p.id === panelId));
    }

    function checkQuiz(btn) {
      const box = btn.closest(".quiz");
      const moduleId = box.dataset.module;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      const result = box.querySelector(".result");
      if (result) result.textContent = "Résultat : " + correct + "/" + qs.length;
      STATE.quizScores[moduleId] = { correct, total: qs.length };
      saveState();
      updateScore();
    }

    function visibleModules() {
      return MODULES.filter(m => STATE.path === "masterclass" || m.express !== false);
    }

    function renderNav() {
      $("#nav").innerHTML = visibleModules().map(m => `
        <button data-target="${m.id}" class="${STATE.visited.has(m.id) ? "completed" : ""}">${m.title}</button>
      `).join("");
      $$("#nav button").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.target)));
    }

    function renderSections() {
      $("#content").innerHTML = MODULES.map(m => `<section id="${m.id}" class="section">${m.content}</section>`).join("");
    }

    function showSection(id) {
      if (!MODULES.find(m => m.id === id)) return;
      $$(".section").forEach(s => s.classList.toggle("active", s.id === id));
      $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.target === id));
      STATE.visited.add(id);
      saveState();
      updateProgress();
      initModule(id);
      $("#sidebar").classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initModule(id) {
      if (id === "diagnostic") restoreDiagnostic();
      if (id === "nn") updateNeuron();
      if (id === "tokens") runTokenizer();
      if (id === "embeddings") renderEmbedMap("animals");
      if (id === "attention") showAttention("computer");
      if (id === "context") updateDesk();
      if (id === "scaling") updateScaling();
      if (id === "flashcards") renderFlashcard();
      if (id === "final") restoreExam();
      if (id === "action") restoreAction();
    }

    function updateProgress() {
      const mods = visibleModules();
      const done = mods.filter(m => STATE.visited.has(m.id)).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      $("#progressBar").style.width = pct + "%";
      $("#progressText").textContent = pct + "%";
    }

    function updateScore() {
      let correct = 0, total = 0;
      Object.values(STATE.quizScores).forEach(s => { correct += s.correct || 0; total += s.total || 0; });
      if (STATE.exam.finished) { correct += STATE.exam.score; total += STATE.exam.total; }
      $("#scoreDisplay").textContent = "Score " + correct + "/" + total;
    }

    function toggleTheme() { STATE.theme = STATE.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", STATE.theme); saveState(); }
    function toggleSources() { STATE.sourcesHidden = !STATE.sourcesHidden; document.body.classList.toggle("hide-sources", STATE.sourcesHidden); saveState(); }
    function toggleMobileNav() { $("#sidebar").classList.toggle("mobile-open"); }

    function nextFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx >= 0 && idx < mods.length - 1) showSection(mods[idx + 1].id);
    }
    function prevFrom(id) {
      const mods = visibleModules();
      const idx = mods.findIndex(m => m.id === id);
      if (idx > 0) showSection(mods[idx - 1].id);
    }

    // ============ DIAGNOSTIC ============
    const DIAG_TEXT = {
      debutant: "Suivez les modules dans l ordre et jouez avec chaque simulateur : neurone, tokenizer, attention. Les analogies du cours (étudiant, bureau de travail) sont vos ancres.",
      praticien: "Passez vite sur les bases, concentrez-vous sur l attention, le transformer, la fenêtre de contexte et les lois de scaling — c est là que se joue votre compréhension des systèmes réels.",
      expert: "Allez directement aux subtilités : correction historique sur l attention, coût quadratique, limites du scaling, distinction base model vs assistant — puis validez avec l examen."
    };

    function validateDiagnostic() {
      const level = document.querySelector("input[name='diag-level']:checked");
      const goal = document.querySelector("input[name='diag-goal']:checked");
      const time = document.querySelector("input[name='diag-time']:checked");
      if (!level || !goal || !time) { alert("Répondez aux trois questions du diagnostic."); return; }

      STATE.diagnostic = { level: level.value, goal: goal.value, time: time.value };
      STATE.path = time.value === "express" ? "express" : "masterclass";
      saveState();
      renderNav();

      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Votre parcours recommandé</h3>
          <p><span class="pill">Niveau : ${level.value}</span><span class="pill">Objectif : ${goal.value}</span><span class="pill">Mode : ${time.value}</span></p>
          <p>${DIAG_TEXT[level.value] || DIAG_TEXT.praticien}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    function restoreDiagnostic() {
      if (!STATE.diagnostic) return;
      const rec = $("#diag-rec");
      const next = $("#diag-next");
      if (rec) {
        rec.style.display = "block";
        rec.innerHTML = `
          <h3>Parcours enregistré</h3>
          <p><span class="pill">Niveau : ${STATE.diagnostic.level}</span><span class="pill">Objectif : ${STATE.diagnostic.goal}</span><span class="pill">Mode : ${STATE.path}</span></p>
          <p>${DIAG_TEXT[STATE.diagnostic.level] || ""}</p>
        `;
      }
      if (next) next.style.display = "inline-flex";
    }

    // ============ SIMULATEUR DE NEURONE ============
    function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
    function relu(z) { return Math.max(0, z); }

    function updateNeuron() {
      const w1 = Number($("#nw1")?.value ?? 0.8);
      const w2 = Number($("#nw2")?.value ?? 0.3);
      const bias = Number($("#nbias")?.value ?? -0.5);
      const act = $("#nact")?.value || "sigmoid";
      const x1 = 1.0, x2 = 0.6;

      const z = w1 * x1 + w2 * x2 + bias;
      let out = z;
      if (act === "sigmoid") out = sigmoid(z);
      if (act === "relu") out = relu(z);

      $("#nv-w1").textContent = w1.toFixed(2);
      $("#nv-w2").textContent = w2.toFixed(2);
      $("#nv-bias").textContent = bias.toFixed(2);
      $("#n-formula").textContent = `z = (${w1.toFixed(2)} × ${x1.toFixed(1)}) + (${w2.toFixed(2)} × ${x2.toFixed(1)}) + (${bias.toFixed(2)}) = ${z.toFixed(3)}`;
      $("#n-out").textContent = out.toFixed(4);
      $("#n-out-label").textContent = act === "none" ? "Sortie brute (z)" : "Sortie après activation " + act;

      const fill = $("#n-out-bar");
      if (fill) fill.style.width = Math.min(100, Math.max(0, out * 100)) + "%";
    }

    // ============ SIMULATEUR DE TOKENIZER ============
    const TOKEN_IDS = { "cat": 8241, "kitten": 1793, "the": 279, "a": 262 };

    function pseudoId(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h + str.charCodeAt(i)) | 0;
      }
      return Math.abs(h % 48000) + 100;
    }

    function tokenToPill(tok) {
      const lower = tok.toLowerCase();
      const id = TOKEN_IDS[lower] !== undefined ? TOKEN_IDS[lower] : pseudoId(tok);
      const known = TOKEN_IDS[lower] !== undefined ? ' style="border-color: var(--green);"' : "";
      return `<span class="token-pill"${known}><span>${tok}</span><span class="tid">#${id}</span></span>`;
    }

    function splitWord(w) {
      if (w.length <= 5) return [w];
      if (w.length <= 9) return [w.slice(0, Math.ceil(w.length / 2)), w.slice(Math.ceil(w.length / 2))];
      return [w.slice(0, 4), w.slice(4, Math.ceil(w.length / 2) + 2), w.slice(Math.ceil(w.length / 2) + 2)];
    }

    function runTokenizer() {
      const input = $("#tok-input")?.value || "Write a story about a robot exploring Mars";
      const out = $("#tok-output");
      if (!out) return;

      const words = input.split(/(\s+|[.,!?;:])/).filter(t => t.trim() !== "");
      let pills = [];
      let count = 0;

      words.forEach(w => {
        if (/^[.,!?;:]/.test(w)) {
          pills.push(tokenToPill(w));
          count++;
        } else if (w.length > 8) {
          splitWord(w).forEach(p => { pills.push(tokenToPill(p)); count++; });
        } else {
          pills.push(tokenToPill(w));
          count++;
        }
      });

      out.innerHTML = pills.join("");
      const stats = $("#tok-stats");
      if (stats) stats.innerHTML = `<span class="pill">${count} tokens</span><span class="pill">${input.split(/\s+/).filter(Boolean).length} mots</span><span class="pill muted">tokens en vert = IDs exacts du transcript (cat=8241, kitten=1793)</span>`;
    }

    // ============ CARTE D'EMBEDDINGS ============
    function renderEmbedMap(mode) {
      const wrap = $("#embed-map");
      if (!wrap) return;

      const animals = `
        <svg class="schema" viewBox="0 0 800 340" role="img" aria-label="Carte d embeddings : les concepts proches sont proches">
          <line x1="60" y1="290" x2="760" y2="290" stroke="var(--border)" stroke-width="2"/>
          <line x1="60" y1="290" x2="60" y2="30" stroke="var(--border)" stroke-width="2"/>
          <circle cx="200" cy="180" r="10" fill="var(--green)" class="pulse"/>
          <text x="200" y="165" text-anchor="middle">cat</text>
          <circle cx="260" cy="220" r="10" fill="var(--green)"/>
          <text x="260" y="245" text-anchor="middle">kitten</text>
          <circle cx="300" cy="130" r="10" fill="var(--green)"/>
          <text x="300" y="115" text-anchor="middle">dog</text>
          <circle cx="650" cy="90" r="10" fill="var(--red)"/>
          <text x="650" y="75" text-anchor="middle">airplane</text>
          <text x="410" y="320" text-anchor="middle" class="sub">Les concepts similaires (cat, kitten, dog) ont des vecteurs proches. Airplane est loin.</text>
        </svg>`;

      const royalty = `
        <svg class="schema" viewBox="0 0 800 340" role="img" aria-label="Arithmétique vectorielle : king - man + woman ≈ queen">
          <line x1="60" y1="290" x2="760" y2="290" stroke="var(--border)" stroke-width="2"/>
          <line x1="60" y1="290" x2="60" y2="30" stroke="var(--border)" stroke-width="2"/>
          <circle cx="180" cy="120" r="10" fill="var(--purple)"/>
          <text x="180" y="105" text-anchor="middle">king</text>
          <circle cx="180" cy="240" r="10" fill="var(--purple)"/>
          <text x="180" y="265" text-anchor="middle">man</text>
          <circle cx="480" cy="240" r="10" fill="var(--purple)"/>
          <text x="480" y="265" text-anchor="middle">woman</text>
          <circle cx="480" cy="120" r="12" fill="var(--green)" class="pulse"/>
          <text x="480" y="105" text-anchor="middle">≈ queen</text>
          <path class="dash purple" d="M195 120 L465 120" marker-end="url(#arr-emb)"/>
          <path class="dash purple" d="M180 135 L180 225"/>
          <path class="dash purple" d="M480 225 L480 135"/>
          <defs>
            <marker id="arr-emb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L0,6 L9,3 z" fill="var(--accent)" />
            </marker>
          </defs>
          <text x="410" y="320" text-anchor="middle" class="sub">king − man + woman ≈ queen : la géométrie encode les relations entre idées.</text>
        </svg>`;

      const paris = `
        <svg class="schema" viewBox="0 0 800 340" role="img" aria-label="Paris - France + Italy ≈ Rome">
          <line x1="60" y1="290" x2="760" y2="290" stroke="var(--border)" stroke-width="2"/>
          <line x1="60" y1="290" x2="60" y2="30" stroke="var(--border)" stroke-width="2"/>
          <circle cx="180" cy="120" r="10" fill="var(--purple)"/>
          <text x="180" y="105" text-anchor="middle">Paris</text>
          <circle cx="180" cy="240" r="10" fill="var(--purple)"/>
          <text x="180" y="265" text-anchor="middle">France</text>
          <circle cx="480" cy="240" r="10" fill="var(--purple)"/>
          <text x="480" y="265" text-anchor="middle">Italy</text>
          <circle cx="480" cy="120" r="12" fill="var(--green)" class="pulse"/>
          <text x="480" y="105" text-anchor="middle">≈ Rome</text>
          <path class="dash purple" d="M195 120 L465 120"/>
          <path class="dash purple" d="M180 135 L180 225"/>
          <path class="dash purple" d="M480 225 L480 135"/>
          <text x="410" y="320" text-anchor="middle" class="sub">Paris − France + Italy ≈ Rome : même relation capitale ↔ pays.</text>
        </svg>`;

      wrap.innerHTML = mode === "royalty" ? royalty : (mode === "paris" ? paris : animals);
      $$("#embed-buttons button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    }

    // ============ DÉMO ATTENTION ============
    function showAttention(mode) {
      const out = $("#att-demo");
      if (!out) return;

      if (mode === "computer") {
        out.innerHTML = `
          <p><span class="att-word att-target">mouse</span> dans :</p>
          <p style="font-size:1.05rem">"To open the file, I click the <strong>mouse</strong>."</p>
          <div class="q">
            ${[
              ["open", 85], ["file", 92], ["click", 88], ["the", 10], ["I", 15]
            ].map(([w, s]) => `
              <div style="margin:0.4rem 0">
                <div style="display:flex;justify-content:space-between"><span class="att-word">${w}</span><span class="muted small">${s}% attention</span></div>
                <div class="att-weights-bar"><div class="att-weights-fill" style="width:${s}%"></div></div>
              </div>
            `).join("")}
          </div>
          <p class="muted">Résultat : la représentation de <strong>mouse</strong> se rapproche de <span class="pill">keyboard</span> <span class="pill">computer</span> plutôt que de <span class="pill">cheese</span> <span class="pill">animal</span>.</p>
        `;
      } else {
        out.innerHTML = `
          <p><span class="att-word att-target">mouse</span> dans :</p>
          <p style="font-size:1.05rem">"The hungry cat chased the <strong>mouse</strong>."</p>
          <div class="q">
            ${[
              ["cat", 95], ["chased", 82], ["hungry", 60], ["the", 8], [".", 5]
            ].map(([w, s]) => `
              <div style="margin:0.4rem 0">
                <div style="display:flex;justify-content:space-between"><span class="att-word">${w}</span><span class="muted small">${s}% attention</span></div>
                <div class="att-weights-bar"><div class="att-weights-fill" style="width:${s}%"></div></div>
              </div>
            `).join("")}
          </div>
          <p class="muted">Résultat : le même token <strong>mouse</strong> se rapproche cette fois de <span class="pill">cheese</span> <span class="pill">animal</span> plutôt que de <span class="pill">computer</span>.</p>
        `;
      }
      $$("#att-buttons button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    }

    // ============ CALCULATEUR DE FENÊTRE DE CONTEXTE ============
    function updateDesk() {
      const prompt = Number($("#cw-prompt")?.value ?? 500);
      const history = Number($("#cw-history")?.value ?? 1500);
      const docs = Number($("#cw-docs")?.value ?? 4000);
      const resp = Number($("#cw-resp")?.value ?? 1000);
      const capacity = Number($("#cw-cap")?.value ?? 8192);

      $("#cwv-prompt").textContent = prompt;
      $("#cwv-history").textContent = history;
      $("#cwv-docs").textContent = docs;
      $("#cwv-resp").textContent = resp;
      $("#cwv-cap").textContent = capacity.toLocaleString();

      const total = prompt + history + docs + resp;
      const overflow = Math.max(0, total - capacity);
      const used = Math.min(total, capacity);

      const bar = $("#desk-bar");
      if (bar) {
        const pct = (v) => Math.min(100, (v / capacity) * 100);
        bar.innerHTML = `
          <div class="desk-seg desk-prompt" style="width:${pct(prompt)}%" title="Prompt"></div>
          <div class="desk-seg desk-history" style="width:${pct(history)}%" title="Historique"></div>
          <div class="desk-seg desk-docs" style="width:${pct(docs)}%" title="Documents"></div>

    // ============ SIMULATEUR DE SCALING ============
    function updateScaling() {
      const params = Number($("#sc-params")?.value ?? 50);
      const data = Number($("#sc-data")?.value ?? 50);
      const compute = Number($("#sc-compute")?.value ?? 50);

      $("#scv-params").textContent = params;
      $("#scv-data").textContent = data;
      $("#scv-compute").textContent = compute;

      const scale = (params + data + compute) / 3;
      const error = 4.2 * Math.pow(scale / 100 + 0.05, -0.9);

      const fill = $("#sc-error-bar");
      if (fill) fill.style.width = Math.min(100, (error / 4.5) * 100) + "%";
      const out = $("#sc-out");
      if (out) {
        let msg = "";
        if (scale < 35) msg = "Petit modèle : erreur élevée, mais testable à moindre coût. C est ainsi qu on estime les grands modèles avant de dépenser des millions.";
        else if (scale < 70) msg = "Modèle moyen : l erreur baisse de façon prévisible. Des capacités comme le few-shot learning commencent à apparaître.";
        else msg = "Grand modèle : erreur basse, mais les gains deviennent très coûteux. La qualité des données et l architecture comptent autant que la taille.";
        out.textContent = msg;
      }
    }

    function startExam() {
      if (STATE.exam.finished) return;
      STATE.exam.remaining = 480;
      updateExamTimer();
      clearInterval(STATE.exam.interval);
      STATE.exam.interval = setInterval(() => {
        STATE.exam.remaining--;
        updateExamTimer();
        if (STATE.exam.remaining <= 0) submitExam();
      }, 1000);
      const btn = $("#exam-start");
      if (btn) btn.style.display = "none";
    }

    function updateExamTimer() {
      const el = $("#exam-timer");
      if (!el) return;
      const m = Math.floor(Math.max(0, STATE.exam.remaining) / 60);
      const s = String(Math.max(0, STATE.exam.remaining) % 60).padStart(2, "0");
      el.textContent = "⏱ " + m + ":" + s;
    }

    function submitExam() {
      clearInterval(STATE.exam.interval);
      const box = $("#final-quiz");
      if (!box) return;
      const qs = $$(".q", box);
      let correct = 0;

      qs.forEach(q => {
        const selected = q.querySelector("input:checked");
        const explain = q.querySelector(".explain");
        const options = $$(".q-option", q);
        q.classList.remove("correct", "incorrect");
        options.forEach(o => o.classList.remove("correct", "incorrect"));
        if (explain) explain.style.display = "block";
        if (!selected) { q.classList.add("incorrect"); return; }

        const answer = Number(q.dataset.answer);
        const value = Number(selected.value);
        const chosen = selected.closest(".q-option");
        if (value === answer) {
          q.classList.add("correct");
          if (chosen) chosen.classList.add("correct");
          correct++;
        } else {
          q.classList.add("incorrect");
          if (chosen) chosen.classList.add("incorrect");
          if (options[answer]) options[answer].classList.add("correct");
        }
      });

      STATE.exam.finished = true;
      STATE.exam.score = correct;
      STATE.exam.total = qs.length;
      STATE.exam.passed = correct >= 7;
      saveState();
      updateScore();

      const res = $("#exam-result");
      if (res) {
        let advice = STATE.exam.passed
          ? "Vous maîtrisez la chaîne complète : neurones → tokens → embeddings → attention → transformer → contexte → scaling → LLM. Vous pouvez aborder les cours avancés (RAG, agents, fine-tuning) avec des fondations solides."

        res.innerHTML = `<strong>Résultat : ${correct}/${qs.length}</strong><br>${STATE.exam.passed ? "✅ Réussite" : "⚠️ À consolider"}<br><span class="muted">${advice}</span>`;
      }
      const certBtn = $("#go-cert");
      if (certBtn) certBtn.style.display = "inline-flex";
    }

          <div id="certificate" class="certificate">
            <span class="badge">🧠</span>
            <h2>Certificat de maîtrise</h2>
            <p>Décerné à</p>
            <h3 id="cert-name-out">Apprenant</h3>
            <p>pour avoir complété la masterclass</p>
            <p class="highlight">Core AI Concepts : Neurones, Tokens, Embeddings, Attention, Transformers, Contexte, Scaling, LLMs</p>
            <p class="muted">Date : <span id="cert-date"></span> • Score : <span id="cert-score"></span> • Niveau : <span id="cert-level"></span></p>
          </div>

          <h2>Plan d action 7 jours</h2>
          <div class="card checklist">
            <label><input type="checkbox" id="c1" onchange="toggleCheck('c1')"> Jour 1 : expliquez à voix haute la chaîne complète (neurone → token → embedding → attention → transformer → prédiction).</label>
            <label><input type="checkbox" id="c2" onchange="toggleCheck('c2')"> Jour 2 : rejouez avec le simulateur de neurone et le tokenizer jusqu à prédire leurs résultats.</label>
            <label><input type="checkbox" id="c3" onchange="toggleCheck('c3')"> Jour 3 : testez la recherche sémantique : deux phrases aux mots différents mais au sens proche.</label>
            <label><input type="checkbox" id="c4" onchange="toggleCheck('c4')"> Jour 4 : prenez un mot ambigu (bank, mouse) et observez comment le contexte change le sens via l attention.</label>
            <label><input type="checkbox" id="c5" onchange="toggleCheck('c5')"> Jour 5 : mesurez la fenêtre de contexte de votre LLM habituel et simulez un dépassement avec le calculateur.</label>
            <label><input type="checkbox" id="c6" onchange="toggleCheck('c6')"> Jour 6 : comparez un base model et un assistant instructé sur la même requête.</label>
            <label><input type="checkbox" id="c7" onchange="toggleCheck('c7')"> Jour 7 : refaites l examen final et visez 9/10.</label>
          </div>
          <p class="muted small">Checklist : <span id="check-progress">0/7</span></p>

          <h2>Ressources ancrées au transcript</h2>
          <div class="resources">
            <ul>
              <li><strong>Série</strong> : Core AI Concepts, Part One — la suite couvrira d autres notions annoncées (RAG détaillé, etc.).</li>
              <li><strong>Papier clé</strong> : « Attention Is All You Need » (Google, 2017) — perceée du transformer.</li>
              <li><strong>Analogies à réutiliser</strong> : l étudiant (training/inference), les boutons de volume (poids, attention), le bureau de travail (fenêtre de contexte), la voiture et le moteur (LLM et transformer).</li>
              <li><strong>Repères chiffrés</strong> : cat = 8241, kitten = 1793, GPT-3 = 175B paramètres, 10 tokens ≈ 100 comparaisons.</li>
            </ul>
          </div>

          <div class="toolbar no-print">
            <button class="btn secondary" onclick="prevFrom('action')">← Revenir à l examen</button>
            <button class="btn" onclick="showSection('home')">Retour à l accueil</button>
          </div>
        `
      }
    ];

    function init() {
      loadState();
      document.body.setAttribute("data-theme", STATE.theme);
      document.body.classList.toggle("hide-sources", STATE.sourcesHidden);
      renderNav();
      renderSections();
      showSection(visibleModules()[0]?.id || "home");
      updateScore();
      updateChecklistProgress();
    }

    window.showSection = showSection;
    window.nextFrom = nextFrom;
    window.prevFrom = prevFrom;
    window.toggleTheme = toggleTheme;
    window.toggleSources = toggleSources;
    window.toggleMobileNav = toggleMobileNav;
    window.validateDiagnostic = validateDiagnostic;
    window.switchTab = switchTab;
    window.checkQuiz = checkQuiz;
    window.updateNeuron = updateNeuron;
    window.runTokenizer = runTokenizer;
    window.renderEmbedMap = renderEmbedMap;
    window.showAttention = showAttention;
    window.updateDesk = updateDesk;
    window.updateScaling = updateScaling;
    window.flipFlash = flipFlash;
    window.nextFlash = nextFlash;
    window.prevFlash = prevFlash;
    window.markFlash = markFlash;
    window.chooseScenario = chooseScenario;
    window.startExam = startExam;
    window.submitExam = submitExam;
    window.generateCert = generateCert;
    window.toggleCheck = toggleCheck;
    window.exportJSON = exportJSON;
    window.resetCourse = resetCourse;
    window.$ = $;

    document.addEventListener("DOMContentLoaded", init);
  </script>
<script src="/course-kit.js"></script>
</body>
